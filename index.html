}

@media (prefers-color-scheme: dark){:root[data-cor="verde"]:not([data-theme="light"]){--bg:#141917; --surface:#1d2421; --surface-2:#26302c; --line:#33403a; --fg:#e8ede9; --muted:#a2b0a9; --toga:#1d5c4a; --toga-2:#133f33; --toga-txt:#86d1b1; --toga-borda:#3f8f73; --trilho:#26302c}}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
html{background:var(--bg);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:where(a,button,input,select,textarea,summary,[tabindex]):focus-visible{outline:2px solid var(--foco,var(--lacre));outline-offset:2px}
main:focus{outline:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* barra superior */
.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--toga);color:var(--toga-fg);box-shadow:0 2px 6px rgba(0,0,0,.18)}
.topo-linha{display:flex;align-items:center;gap:8px;min-height:60px}
.topo h1{font-family:var(--f-display);font-weight:700;font-size:1.3rem;margin:0;flex:1;min-width:0;line-height:1.15;text-wrap:balance}
.topo h1.longo{font-size:1.08rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.topo h1.longo small{display:none}
.topo h1 small{display:block;font-family:var(--f-body);font-weight:400;font-size:.78rem;opacity:.8;letter-spacing:.02em}
.icone{background:none;border:0;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:inherit;flex:none;margin-left:-8px}
.icone:hover{background:rgba(255,255,255,.12)}
.relogio{font-family:var(--f-mono);font-size:1.05rem;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.relogio.alerta{color:#ffd28a}
.abas{display:flex}
.abas button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:12px 0 10px;font-weight:700;letter-spacing:.08em;font-size:.85rem;text-transform:uppercase;color:rgba(255,255,255,.78)}
.abas button[aria-selected="true"]{color:#fff;border-color:var(--lacre)}
.periodos{display:flex;gap:8px;overflow-x:auto;padding-block:4px 12px;scrollbar-width:none}
.periodos::-webkit-scrollbar{display:none}
.periodos button{flex:none;border:1.5px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:.88rem;font-variant-numeric:tabular-nums}
.periodos button[aria-pressed="true"]{background:var(--lacre);border-color:var(--lacre);color:var(--lacre-fg)}

main{flex:1;padding-block:18px 120px}
.secao{display:flex;align-items:center;gap:12px;margin:28px 0 12px;font-weight:700;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.secao::after{content:"";flex:1;height:1px;background:var(--line)}
.secao:first-child{margin-top:4px}
.nota{font-size:.88rem;color:var(--muted);margin:0}
.nivel{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--c);line-height:1}
.barras{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.barras i{display:block;width:3px;border-radius:1px;background:currentColor;opacity:.25}
.barras i:nth-child(1){height:4px}.barras i:nth-child(2){height:6px}.barras i:nth-child(3){height:8px}.barras i:nth-child(4){height:10px}.barras i:nth-child(5){height:12px}
.barras i.on{opacity:1}
.escada{display:flex;gap:4px;margin-top:10px}
.escada span{flex:1;min-width:0;border-radius:8px;padding:7px 5px 6px;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);font-size:.66rem;line-height:1.2;color:var(--muted)}
.escada b{display:block;color:var(--fg);font-size:.78rem}
.box-nivel{border-left:4px solid var(--c);background:var(--surface-2);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.box-nivel p{margin:0;font-size:.92rem}
.q-niv{display:flex;margin:-2px 0 10px;font-size:.7rem}

/* métricas (progresso) */
.metrica{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;margin-bottom:12px}
.tile{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;color:#fff;background:var(--c)}
.metrica .top{display:flex;justify-content:space-between;gap:8px;font-size:1rem}
.metrica .top b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.trilho{height:8px;border-radius:4px;background:var(--trilho);overflow:hidden;display:flex;margin-top:6px}
.trilho i{display:block;height:100%}
.f-ok{background:var(--ok)} .f-er{background:var(--erro)} .f-lacre{background:var(--lacre)} .f-toga{background:var(--toga)}
.cont{display:flex;gap:12px;font-family:var(--f-mono);font-size:.85rem;font-variant-numeric:tabular-nums;align-items:center}
.ck{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:4px;color:#fff;margin-right:4px;vertical-align:-3px}
.ck svg.i{width:11px;height:11px;stroke-width:3.2}
.ck.ok{background:var(--ok)} .ck.er{background:var(--erro)} .ck.br{background:var(--aviso)}

/* acertos por assunto */
.assuntos{display:flex;flex-direction:column;gap:8px}
.assunto{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;align-items:stretch;border:0;background:none;padding:0;text-align:left;width:100%}
.assunto .tile{width:48px;height:48px;border-radius:8px}
.assunto .barra{position:relative;border-radius:8px;overflow:hidden;background:var(--surface-2);display:flex;align-items:center;min-height:48px}
.assunto .barra .ok{position:absolute;inset:0 auto 0 0;background:var(--ok);opacity:.9}
.assunto .barra .er{position:absolute;inset:0 0 0 auto;background:var(--erro);opacity:.85}
.assunto .barra span{position:relative;display:flex;justify-content:space-between;gap:8px;width:100%;padding:0 14px;font-weight:700;color:var(--fg);min-width:0}
.assunto .barra.tem span{color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.assunto .barra span em{font-style:normal;font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums;flex:none}
.assunto .barra span b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.assunto:hover .barra{filter:brightness(1.05)}

/* listas de simulados */
.lista{display:flex;flex-direction:column;background:var(--surface);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.item{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.item:first-child{border-top:0}
.item{transition:background-color .15s}
.item:hover:not([disabled]){background:var(--surface-2)}
.selo{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff}
.selo svg.i{width:26px;height:26px;stroke-width:2.6}
.selo.nao{background:var(--neutro)} .selo.pausa{background:var(--lacre)} .selo.aprov{background:var(--ok)} .selo.reprov{background:var(--erro)} .selo.perf{background:var(--toga)}
.item-tit{font-family:var(--f-display);font-weight:600;font-size:1.08rem;line-height:1.25}
.item-sub{font-size:.86rem;color:var(--muted)}
.item .cont{margin-top:3px}
.item-data{font-size:.8rem;color:var(--muted);text-align:right;white-space:nowrap;line-height:1.35}

/* cartões de matéria */
.grade-mat{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;transition:border-color .15s,background-color .15s;display:flex;flex-direction:column;gap:10px;text-align:left;min-width:0}
.card:hover{border-color:var(--toga-txt)}
.card .tile{width:44px;height:44px;border-radius:10px}
.card b{font-family:var(--f-display);font-weight:600;font-size:1.05rem;line-height:1.2}
.card small{color:var(--muted);font-size:.82rem}
.card .trilho{margin-top:0}
.card.destaque{border:2px solid var(--lacre);background:var(--surface)}
.card.destaque b{font-size:1.15rem}

/* destaque e cabeçalho de matéria */
.cabeca{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;align-items:center;margin-bottom:6px}
.cabeca .tile{width:56px;height:56px;border-radius:12px}
.cabeca .tile svg.i{width:28px;height:28px}
.cabeca h2{margin:0;font-family:var(--f-display);font-size:1.35rem;line-height:1.2}
.dica{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--lacre);border-radius:var(--r);padding:12px 14px;font-size:.92rem}

/* FAB */
.fab{position:fixed;right:max(20px,calc(env(safe-area-inset-right,0px) + 20px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;border:0;background:var(--lacre);color:var(--lacre-fg);display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.28);z-index:7}
.fab svg.i{width:30px;height:30px;stroke-width:2.6}

/* gaveta */
.camada{position:fixed;inset:0;z-index:20;background:rgba(16,8,10,.55);display:flex}
.gaveta{width:min(82vw,330px);height:100%;background:var(--surface);overflow:auto;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:4px 0 18px rgba(0,0,0,.3)}
.gaveta-topo{background:var(--toga);color:#fff;padding:calc(28px + env(safe-area-inset-top,0px)) 20px 20px max(20px,env(safe-area-inset-left,0px))}
.gaveta-topo svg.i{width:44px;height:44px;stroke-width:1.6}
.gaveta-topo b{display:block;font-family:var(--f-display);font-size:1.25rem;margin-top:10px}
.gaveta-topo small{opacity:.8}
html[data-anim="on"] .camada.abre{animation:cam-entra .28s ease-out both}
html[data-anim="on"] .camada.abre .gaveta{animation:gav-entra .34s cubic-bezier(.2,.9,.3,1) both}
html[data-anim="on"] .camada.abre .gaveta nav>*{animation:gav-item .38s ease-out both}
html[data-anim="on"] .camada.abre .gaveta nav>*:nth-child(n){animation-delay:calc(.06s + var(--gi,0)*.025s)}
.camada.sai{animation:cam-sai .3s ease-in both}.camada.sai .gaveta{animation:gav-sai .3s cubic-bezier(.4,0,.8,.4) both}
@keyframes cam-entra{from{background:rgba(16,8,10,0)}}
@keyframes cam-sai{to{background:rgba(16,8,10,0)}}
@keyframes gav-entra{from{transform:translateX(-102%)}}
@keyframes gav-sai{to{transform:translateX(-102%)}}
@keyframes gav-item{from{opacity:0;transform:translateX(-18px)}}
.gaveta nav{display:flex;flex-direction:column;padding-block:8px}
.gaveta nav button{display:flex;gap:18px;align-items:center;background:none;border:0;padding:14px 20px 14px max(20px,env(safe-area-inset-left,0px));text-align:left;font-size:1.02rem}
.gaveta nav button:hover,.gaveta nav button[aria-current="page"]{background:var(--surface-2)}
.gaveta nav button[aria-current="page"]{font-weight:700}
.gaveta,.folha,.camada,.folha-camada{overscroll-behavior:contain}
.gaveta nav button svg.i{color:var(--muted)}
.gaveta hr{border:0;border-top:1px solid var(--line);margin:6px 0}

/* configurar */
.cartao{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:16px}
.chave{display:flex;align-items:center;gap:14px;justify-content:space-between}
.chave p{margin:0} .chave small{display:block;color:var(--muted);font-size:.86rem}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:background .15s;pointer-events:none}
.switch span::after{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked+span{background:var(--toga)}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:focus-visible+span{outline:2px solid var(--lacre);outline-offset:2px}
.info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-radius:10px;overflow:hidden}
.info div{background:var(--surface-2);padding:10px}
.info strong{display:block;font-family:var(--f-display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.info small{color:var(--muted);font-size:.78rem}
.botao{border:0;border-radius:10px;padding:15px 18px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.95rem;width:100%}
.botao.cheio{background:var(--toga);color:var(--toga-fg)}
.botao.linha{background:transparent;border:1.5px solid var(--line)}
.botoes{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.lado{display:flex;gap:10px} .lado .botao{flex:1}

/* questão */
.q-cab{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.q-mat{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.q-mat .tile{width:30px;height:30px;border-radius:7px;color:#fff}
.q-mat .tile svg.i{width:18px;height:18px}
.q-mat b{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.q-mat span{font-size:.8rem;color:var(--muted)}
.q-enun{font-size:1.12rem;line-height:1.5;margin:0}
.alts{margin-top:12px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.alt{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:center;padding:15px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;font-size:1.02rem;line-height:1.45}
.alt:first-child{border-top:0}
.alt:hover:not([disabled]){background:var(--surface-2)}
.letra{width:32px;height:32px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-weight:700;font-size:.9rem;color:var(--muted)}
.alt.marcada{background:var(--surface-2)} .alt.marcada .letra{background:var(--toga);border-color:var(--toga-txt);color:#fff}
.alt.certa{background:var(--ok-bg)} .alt.certa .letra{background:var(--ok);border-color:var(--ok);color:#fff}
.alt.errada{background:var(--erro-bg)} .alt.errada .letra{background:var(--erro);border-color:var(--erro);color:#fff}
.alt[disabled]{cursor:default}
.coment{margin-top:12px;border-radius:var(--r);padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--ok)}
.coment.err{border-left-color:var(--erro)}
.coment h3{margin:0 0 6px;font-family:var(--f-display);font-size:1.08rem}
.coment p{margin:0 0 8px}
.fund{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);margin:0}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.92rem}
.nav button[disabled]{opacity:.35;cursor:default}
.nav button.forte{font-weight:700}

/* folha de questões */
.folha-camada{position:fixed;inset:0;z-index:20;background:rgba(16,8,10,.55);display:flex;align-items:flex-end;justify-content:center}
.folha{background:var(--bg);width:100%;max-width:760px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px))}
.folha h2{font-family:var(--f-display);margin:0 0 4px;font-size:1.25rem}
.gq{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;margin:14px 0}
.gq button{aspect-ratio:1;max-width:100%;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.9rem}
.gq button.resp{background:var(--toga);border-color:var(--toga-txt);color:#fff}
.gq button.g-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.gq button.g-er{background:var(--erro);border-color:var(--erro);color:#fff}
.gq button.atual{outline:2px solid var(--lacre);outline-offset:2px}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legenda i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1.5px solid var(--line)}
.confirma{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:10px}
.confirma p{margin:0 0 10px}

/* resultado */
.placar{border-radius:var(--r);padding:22px 20px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;color:#fff}
.placar.aprov{background:var(--ok)} .placar.reprov{background:var(--erro)} .placar.perf{background:var(--toga)}
.placar .pct{font-family:var(--f-display);font-weight:700;font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}
.placar h2{margin:0;font-family:var(--f-display);font-size:1.4rem}
.placar p{margin:4px 0 0;opacity:.92;font-size:.92rem}
.revisao{display:flex;flex-direction:column;gap:10px}
.rev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.rev summary{cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;list-style:none}
.rev summary::-webkit-details-marker{display:none}
.rev .num{font-family:var(--f-mono);font-size:.82rem;padding:2px 8px;border-radius:6px;color:#fff;font-variant-numeric:tabular-nums}
.rev .num.ok{background:var(--ok)} .rev .num.er{background:var(--erro)} .rev .num.br{background:var(--aviso)}
.rev .rq{font-size:.95rem}
.rev .rotulo{font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.rev .rbody{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:.93rem}
.rev .rbody p{margin:0 0 6px}
.c-er{color:color-mix(in srgb,var(--erro) 82%,var(--fg))}
.c-ok{color:var(--ok)}
.desemp{display:flex;flex-direction:column;gap:8px}
.desemp .linha{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.92rem}
.desemp .tile{width:28px;height:28px;border-radius:6px}
.desemp .tile svg.i{width:16px;height:16px}
.sinc{font-size:.78rem;color:var(--muted);text-align:center;margin-top:28px}
.vazio{padding:24px 18px;text-align:center;color:var(--muted)}
/* lei seca */
.ls-texto{font-family:var(--f-display);font-size:1.12rem;line-height:1.6;margin:0}
.ls-lac{display:inline-block;min-width:7em;border-bottom:2px solid var(--lacre);color:transparent;user-select:none}
.ls-marca{background:var(--ok-bg);border-radius:4px;padding:0 3px;font-weight:700}
.ls-ref{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);margin:10px 0 0}
.ls-ce{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.ls-ce .botao{text-transform:none;letter-spacing:0;font-size:1.02rem}
.ls-ce .botao.certa{background:var(--ok);color:#fff;border-color:var(--ok)}
.ls-ce .botao.errada{background:var(--erro);color:#fff;border-color:var(--erro)}
.ls-lista details{border-top:1px solid var(--line);padding:12px 14px}
.ls-lista details:first-child{border-top:0}
.ls-lista summary{cursor:pointer;font-weight:700;display:flex;justify-content:space-between;gap:10px}
.ls-lista summary small{font-weight:400;color:var(--muted);white-space:nowrap}
.ls-lista details p{margin:8px 0 0;line-height:1.55}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media (max-width:380px){.placar{grid-template-columns:1fr}.grade-mat{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ---------- apostilas ---------- */
.f-a{fill:var(--c)}.f-b{fill:var(--lacre)}.f-t{fill:var(--toga)}.f-s{fill:var(--surface-2)}.f-w{fill:var(--surface)}
.s-a{stroke:var(--c)}.s-b{stroke:var(--lacre)}.s-t{stroke:var(--toga)}.s-w{stroke:var(--surface)}.s-l{stroke:var(--line)}
.t-m{fill:var(--muted);font:700 10px var(--f-body);letter-spacing:.08em}
.ilu{width:100%;max-width:260px;height:auto;display:block}
.ap-hero{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:14px;align-items:center;margin:14px 0 6px}
.ap-hero h2{margin:0;font-family:var(--f-display);font-size:1.45rem;line-height:1.2}
.leitura{--fs:1}
.texto{font-size:calc(1.02rem * var(--fs));line-height:1.65}
.texto h3{font-family:var(--f-display);font-size:1.32em;line-height:1.25;margin:34px 0 10px;padding-top:12px;border-top:2px solid var(--line);scroll-margin-top:96px}
.texto h3::before{content:"";display:block;width:42px;height:4px;border-radius:2px;background:var(--c,var(--toga));margin:-14px 0 14px}
.texto h4{font-size:1.04em;margin:22px 0 6px;color:var(--fg)}
.texto h5{font-size:.95em;margin:16px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.texto p{margin:0 0 12px}
.texto ul,.texto ol{margin:0 0 14px;padding-left:22px}
.texto li{margin:0 0 6px}
.texto strong{font-weight:700}
.texto mark{background:color-mix(in srgb,var(--lacre) 30%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.call,.memo{border-radius:10px;padding:12px 14px;margin:14px 0 16px;border-left:5px solid var(--k);background:color-mix(in srgb,var(--k) 11%,var(--surface))}
.call>b,.memo>b{display:flex;align-items:center;gap:6px;font-size:.78em;letter-spacing:.07em;text-transform:uppercase;color:color-mix(in srgb,var(--k) 85%,var(--fg));margin-bottom:4px}
.call>b svg.i,.memo>b svg.i{width:16px;height:16px}
.call p,.memo p{margin:0 0 6px}.call p:last-child,.memo p:last-child{margin:0}
.call.ex{--k:var(--nv2)}.call.at{--k:var(--erro)}.call.di{--k:var(--lacre)}.call.pr{--k:var(--nv7)}.call.le{--k:var(--nv1)}
.memo{--k:var(--nv5);border-left-style:dashed}
.teste{--k:var(--nv3);border:1px solid color-mix(in srgb,var(--k) 45%,var(--line));border-radius:12px;padding:12px 14px;margin:16px 0 18px;background:var(--surface)}
.teste>b{display:flex;align-items:center;gap:6px;font-size:.78em;letter-spacing:.07em;text-transform:uppercase;color:color-mix(in srgb,var(--k) 85%,var(--fg));margin-bottom:6px}
.teste>b svg.i{width:16px;height:16px}
.teste details{border-top:1px solid var(--line);padding:8px 0}
.teste summary{cursor:pointer;font-weight:600;list-style-position:outside;margin-left:18px}
.teste details p{margin:6px 0 0 18px;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--k) 10%,var(--surface))}
.teste .tdica{font-size:.85em;color:var(--muted);margin:0 0 4px}
@media print{.teste details p{display:block}}
.tab{overflow-x:auto;margin:12px 0 16px;border:1px solid var(--line);border-radius:10px}
.tab table{border-collapse:collapse;width:100%;font-size:.9em;min-width:420px}
.tab th{background:var(--surface-2);text-align:left;font-weight:700}
.tab th,.tab td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tab tr:last-child td{border-bottom:0}
.fig{margin:18px 0;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.calc-dica,.calc-rot{margin:0 0 8px;color:var(--muted);font-size:.92em}
.calc-rot{margin:10px 0 6px;color:var(--fg);font-weight:600}
.calc-in{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.calc-in label{display:grid;gap:4px;min-width:0;font-size:.92em;font-weight:600}
.calc-l3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.calc-in input,.calc-in select{width:100%;box-sizing:border-box;min-width:0;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit}
.calc-out{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--surface-2);border-left:5px solid var(--neutro)}
.calc-out.ok{background:var(--ok-bg);border-left-color:var(--ok)}
.calc-out.nao{background:var(--erro-bg);border-left-color:var(--erro)}
.calc-out ul{margin:8px 0 0;padding:0;list-style:none}
.calc-out li{margin:4px 0}
html[data-anim="on"] .calc-out.calc-novo{animation:pv-res-in .4s ease-out both}
.fig>figcaption{display:flex;align-items:center;gap:6px;font-weight:700;font-size:.8em;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.fig>figcaption svg.i{width:16px;height:16px}
.fig.ilus{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:4px 0}
.fig.ilus .leg{font-size:.85em;color:var(--muted);text-align:center;max-width:420px}
.pir{display:flex;flex-direction:column;align-items:center;gap:4px}
.pir div{background:color-mix(in srgb,var(--toga) calc(var(--o)*100%),var(--surface-2));color:var(--toga-fg);border-radius:6px;padding:8px 10px;text-align:center;font-size:.88em;line-height:1.3;min-width:120px}
.tl{list-style:none;padding:0;margin:0;position:relative}
.tl::before{content:"";position:absolute;left:15px;top:8px;bottom:8px;width:3px;background:var(--line);border-radius:2px}
.tl li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;margin:0 0 12px;position:relative}
.tl-n{width:32px;height:32px;border-radius:50%;background:var(--toga);color:var(--toga-fg);display:grid;place-items:center;font-weight:700;font-size:.9em;z-index:1}
.tl p{margin:2px 0 0;font-size:.92em;color:var(--muted)}
.fx{display:flex;flex-direction:column;align-items:stretch;gap:2px;max-width:520px;margin:0 auto}
.fx-c{border:2px solid var(--c);border-radius:10px;padding:9px 12px;text-align:center;font-size:.92em;background:color-mix(in srgb,var(--c) 9%,var(--surface))}
.fx-s{display:grid;place-items:center;color:var(--muted);height:20px}.fx-s svg.i{transform:rotate(90deg);width:18px;height:18px}
.cp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cp>div{border-top:5px solid var(--c);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.cp b{display:block;margin-bottom:4px}.cp ul{margin:0;padding-left:18px;font-size:.92em}
.mapa{margin:26px 0 10px;padding:16px;border-radius:14px;border:2px solid var(--toga-borda);background:var(--surface)}
.mapa>figcaption{display:flex;align-items:center;gap:6px;font-weight:700;font-size:.8em;letter-spacing:.08em;text-transform:uppercase;color:var(--toga-txt);margin-bottom:14px}
:root[data-theme="dark"] .mapa>figcaption{color:var(--nv1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mapa>figcaption{color:var(--nv1)}}
.mapa-c{display:inline-block;background:var(--toga);color:var(--toga-fg);font-family:var(--f-display);font-weight:700;font-size:1.12em;padding:10px 16px;border-radius:999px;position:relative;box-shadow:0 3px 0 var(--lacre)}
.mapa-r{margin:0 0 0 22px;padding:14px 0 0 18px;border-left:3px solid var(--line);display:flex;flex-direction:column;gap:12px}
.ramo{position:relative;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:9px 12px}
.ramo::before{content:"";position:absolute;left:-23px;top:18px;width:18px;border-top:3px solid var(--line)}
.ramo b{display:block;color:var(--c);font-size:.95em}
.ramo ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.ramo li{background:color-mix(in srgb,var(--c) 13%,var(--surface));border-radius:999px;padding:3px 10px;font-size:.85em;margin:0}
@media (min-width:760px){
 .mapa-in{display:grid;grid-template-columns:1fr auto 1fr;gap:0 26px;align-items:center}
 .mapa-c{grid-column:2;align-self:center;text-align:center;max-width:220px;border-radius:18px}
 .mapa-r{display:contents}
 .ramo{margin:6px 0}
 .ramo.esq{grid-column:1}.ramo.dir{grid-column:3}
 .ramo.esq::before{left:auto;right:-27px;width:26px}.ramo.dir::before{left:-27px;width:26px}
}
.sumario{display:flex;flex-direction:column;gap:6px;margin:14px 0 6px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.sumario button{display:flex;gap:10px;align-items:center;text-align:left;background:none;border:0;padding:6px 4px;border-radius:8px;color:inherit;font-size:.95rem}
.sumario button:hover{background:var(--surface-2)}
.sumario span{width:24px;height:24px;flex:none;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:.78rem;font-weight:700}
.metodo{margin:16px 0 4px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:4px 14px}
.metodo summary{display:flex;align-items:center;gap:8px;font-weight:700;padding:10px 0;cursor:pointer}
.metodo .texto h3{font-size:1.1em;margin-top:18px}
.ap-fim{display:flex;flex-direction:column;gap:10px;margin:30px 0 40px}
.ap-fim .botao{display:flex;align-items:center;justify-content:center;gap:8px;text-transform:none;letter-spacing:0;font-size:.95rem}
.ap-fim .lado .botao{font-size:.85rem;padding:12px 10px}
.ap-item[disabled]{opacity:.55}
.lido{display:inline-flex;align-items:center;gap:4px;color:var(--ok);font-weight:700}
.lido svg.i{width:16px;height:16px}
.progresso-leitura{height:4px;background:rgba(255,255,255,.2);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)))}
.progresso-leitura i{display:block;height:100%;width:0;background:var(--lacre);transition:width .1s}
.topo .icone[data-acao="fonte"]{font-weight:700;font-size:.95rem;width:38px;margin:0}
.card.apost{border:1px solid var(--line);border-left:4px solid var(--toga-borda)}
.btn-ap{display:flex;align-items:center;gap:12px;width:100%;margin:12px 0 4px;padding:12px 14px;border-radius:12px;border:2px solid var(--toga-borda);background:var(--surface);text-align:left;color:inherit}
.btn-ap b{display:block}.btn-ap small{color:var(--muted)}
/* destaques (marca-texto) */
.texto strong.mk{background:linear-gradient(180deg,transparent 52%,color-mix(in srgb,var(--lacre) 42%,transparent) 52%);border-radius:2px;padding:0 1px}
.texto strong.lg{background:linear-gradient(180deg,transparent 80%,color-mix(in srgb,var(--c,var(--toga)) 26%,transparent) 80%)}
.memo{box-shadow:0 2px 0 color-mix(in srgb,var(--k) 25%,transparent)}
.memo>b{font-size:.82em}
.memo p{font-size:1.02em}
.memo>.ilu,.teste>.ilu{float:right;width:72px;max-width:72px;margin:-6px -6px 4px 8px}
.call .cena{float:right;width:74px;height:56px;margin:-4px -4px 4px 8px}
/* páginas da apostila */
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 4px;font-size:.85rem;color:var(--muted)}
.pager b{color:var(--fg)}
.pager .indice{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:inherit;font-size:.85rem}
.pager .indice svg.i{width:16px;height:16px}
.tema-ban{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr);gap:12px;align-items:center;margin:10px 0 8px;padding:12px;border-radius:16px;background:color-mix(in srgb,var(--c) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 35%,var(--line))}
.tema-ban .ilu{max-width:120px}
.tema-ban .tn{display:block;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
:root[data-theme="dark"] .tema-ban .tn{color:var(--fg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tema-ban .tn{color:var(--fg)}}
.tema-ban h3{margin:4px 0 0;font-family:var(--f-display);font-size:1.3rem;line-height:1.2}
.navtema{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:26px 0 10px}
.navtema button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:inherit;min-width:0}
.navtema button small{color:var(--muted);font-size:.75rem;display:flex;align-items:center;gap:4px}
.navtema button small svg.i{width:14px;height:14px}
.navtema button span{font-weight:700;font-size:.92rem;line-height:1.25;overflow-wrap:anywhere}
.navtema button.prox{grid-column:2;align-items:flex-end;text-align:right;border:2px solid var(--toga-borda)}
.navtema button.so{grid-column:1/-1}
.indice-temas{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.indice-temas button{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;padding:8px 12px 8px 8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:inherit}
.indice-temas button .ilu{width:54px;max-width:54px}
.indice-temas button b{display:block;font-size:.95rem;line-height:1.25}
.indice-temas button small{color:var(--muted);font-size:.75rem}
.indice-temas .vis{color:var(--ok)}.indice-temas .vis svg.i{width:18px;height:18px}
.capa-acoes{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.btn-lida{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border-radius:12px;border:1px dashed var(--line);background:var(--surface);color:inherit;text-align:left}
.btn-lida.on{border:2px solid var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.btn-lida .tile{width:34px;height:34px}
.btn-lida b{display:block}.btn-lida small{color:var(--muted)}
.verso{margin:22px 0;padding:18px 18px 16px;border-radius:16px;background:var(--toga);color:var(--toga-fg);position:relative;overflow:hidden}
.verso::after{content:"\201C";position:absolute;right:12px;top:-22px;font-size:7rem;font-family:Georgia,serif;opacity:.15}
.verso small{display:block;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.85;margin-bottom:8px}
.verso p{margin:0;font-family:var(--f-display);font-size:1.12rem;line-height:1.45}
.verso cite{display:block;margin-top:10px;font-style:normal;font-weight:700;font-size:.9rem;color:var(--lacre)}
:root[data-theme="dark"] .verso cite{color:#f1c27d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .verso cite{color:#f1c27d}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.chips button{flex:none;border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--toga-fg);border-radius:999px;padding:6px 12px;font-size:.82rem;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--toga-fg);color:var(--toga);font-weight:700}
.res-tema{margin:16px 0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);border-left:5px solid var(--c);background:var(--surface)}
.res-tema h4{margin:0 0 6px;font-size:1em}
.res-tema ul{margin:0;padding-left:20px}.res-tema li{margin:0 0 4px}
.res-tema .call{margin:8px 0 0}
.card.resumo{border:1px solid var(--line);border-left:4px solid var(--lacre)}
/* modo de leitura, favoritos e notas */
.modo-ap{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:var(--surface-2);margin:12px 0 4px}
.modo-ap button{border:0;background:none;color:var(--muted);border-radius:9px;padding:9px 6px;font-size:.85rem;font-weight:600}
.modo-ap button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.pager-b{display:flex;gap:6px}
.secao-tema{scroll-margin-top:90px;padding-top:6px}
.secao-tema+.secao-tema{border-top:3px dashed var(--line);margin-top:26px;padding-top:18px}
.tema-cont{margin:0;font-size:.78rem;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.topo-link{display:inline-flex;align-items:center;gap:6px;margin:6px 0 0;background:none;border:0;color:var(--muted);font-size:.85rem;padding:6px 0}
.topo-link svg.i{width:16px;height:16px}
#indice-ap{scroll-margin-top:90px}
.sumario-tudo{margin:12px 0;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:4px 12px}
.sumario-tudo summary{display:flex;align-items:center;gap:8px;font-weight:700;padding:10px 0;cursor:pointer}
.sumario-tudo summary svg.i{width:18px;height:18px}
.indice-mini{display:flex;flex-direction:column;gap:2px;padding-bottom:8px}
.indice-mini button{display:flex;gap:10px;align-items:center;text-align:left;background:none;border:0;padding:7px 4px;border-radius:8px;color:inherit;font-size:.93rem}
.indice-mini button span{width:24px;height:24px;flex:none;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:.75rem;font-weight:700}
.extras-tema{display:flex;flex-direction:column;gap:10px;margin:22px 0 6px;padding-top:14px;border-top:1px solid var(--line)}
.btn-fav{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:inherit;font-weight:600;font-size:.9rem}
.btn-fav svg.i{width:18px;height:18px}
.btn-fav.on{background:color-mix(in srgb,var(--lacre) 18%,var(--surface));border-color:var(--lacre)}
.btn-fav.on svg.i{fill:var(--lacre);stroke:var(--lacre)}
.notas{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:2px 12px}
.notas summary{display:flex;align-items:center;gap:8px;font-weight:600;padding:9px 0;cursor:pointer;font-size:.92rem}
.notas summary svg.i{width:18px;height:18px}
.notas textarea{width:100%;box-sizing:border-box;margin:0 0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);padding:10px;font:inherit;font-size:.95rem;resize:vertical}
.link-tema{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:8px 12px;border-radius:999px;border:1px solid var(--toga-borda);background:var(--surface);color:inherit;font-weight:600;font-size:.88rem}
.link-tema svg.i{width:16px;height:16px}
mark.achado{background:#ffd54a;color:#111;border-radius:3px;padding:0 2px}
.busca{display:flex;align-items:center;gap:8px;margin:12px 0;padding:4px 12px;border:2px solid var(--toga-borda);border-radius:12px;background:var(--surface)}
.busca svg.i{width:20px;height:20px;color:var(--muted)}
.busca input{flex:1;min-width:0;border:0;background:none;color:var(--fg);font:inherit;font-size:1rem;padding:10px 0;outline:none}
.busca:focus-within{outline:2px solid var(--foco,var(--lacre));outline-offset:2px}
.trecho{display:block;margin-top:4px;font-size:.84rem;color:var(--muted);line-height:1.4}
.trecho mark,.res-busca .item-tit mark{background:#ffd54a;color:#111;border-radius:2px}
/* cartões */
.flash{position:relative;margin:14px 0;padding:18px;border-radius:16px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 6%,var(--surface));min-height:180px}
.flash-cab{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);margin-bottom:10px}
.flash-cab .tile{width:28px;height:28px}
.flash-q{font-family:var(--f-display);font-size:1.25rem;line-height:1.35;margin:0}
.flash-r{margin-top:14px;padding-top:12px;border-top:2px dashed var(--line);font-size:1.02rem;line-height:1.5}
.notas-flash{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
@media (max-width:400px){.notas-flash{grid-template-columns:1fr 1fr}}
.notas-flash .botao{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;text-transform:none;letter-spacing:0}
.notas-flash small{font-size:.72rem;color:var(--muted);font-weight:500}
.notas-flash .f-er{border-color:var(--erro);color:var(--erro)}.notas-flash .f-ok{border-color:var(--ok);color:var(--ok)}
/* metas e hoje */
.metas-top{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.metas-top>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.metas-top svg.i{width:20px;height:20px;color:var(--lacre)}
.metas-top b{font-size:1.4rem;font-family:var(--f-mono);font-weight:600}
.metas-top small{font-size:.72rem;color:var(--muted);line-height:1.2}
.grafico{margin:0;padding:16px 12px 8px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.barras7{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.barras7>div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:152px}
.barras7 .b7{display:block;width:62%;max-width:36px;border-radius:6px 6px 2px 2px;background:color-mix(in srgb,var(--toga-txt) 45%,var(--trilho))}
.barras7 .b7.ok{background:var(--toga-txt)}
.barras7 b{font-size:.78rem;line-height:20px;font-variant-numeric:tabular-nums}.barras7 small{display:block;height:22px;line-height:22px;font-size:.72rem;color:var(--muted)}
.barras7 .hoje small{color:var(--fg);font-weight:700}
.barras7 .linha-meta{position:absolute;left:0;right:0;border-top:1.5px dashed var(--lacre);pointer-events:none;display:block}
.barras7 .linha-meta span{position:absolute;right:0;top:-17px;font-size:.68rem;font-style:normal;font-weight:700;color:color-mix(in srgb,var(--lacre) 62%,var(--fg));background:var(--surface);padding:0 4px}
.opcoes{display:flex;gap:8px;flex-wrap:wrap}
.cores{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cores button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:inherit;font-weight:700;text-align:left}
.cores button[aria-pressed="true"]{border:2px solid var(--toga-borda);padding:9px 11px}
.cores .amostra{width:28px;height:28px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.cores small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.cores.uma{grid-template-columns:1fr}
.cores.tres{grid-template-columns:repeat(3,1fr)} .cores.tres button{flex-direction:column;align-items:center;text-align:center;gap:6px;padding:12px 6px} .cores.tres button[aria-pressed="true"]{padding:11px 5px}
.cores .ico-op{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);font-size:.9rem}
.cores button[aria-pressed="true"] .ico-op{background:var(--toga);color:var(--toga-fg);border-color:var(--toga)}
.nav-q{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin-top:12px}
.nav-q button{display:flex;align-items:center;justify-content:center;gap:6px;padding:13px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:inherit;font-weight:700;font-size:.95rem}
.nav-q button.cheio{background:var(--toga);color:var(--toga-fg);border-color:var(--toga)}
.nav-q button[disabled]{opacity:.35}
.dica-modo{margin:10px 2px 0;color:var(--muted);font-size:.9rem}
.opcoes button{min-width:64px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:inherit;font-weight:700}
.opcoes button[aria-pressed="true"]{background:var(--toga);color:var(--toga-fg);border-color:var(--toga-txt)}
.campo{display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.campo input{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit}
.hoje-card{width:100%;margin:10px 0 4px;border:2px solid var(--lacre)}
/* resumo de uma folha */
.resumo-folha{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px;font-size:.93rem;line-height:1.45}
.rf-cab{display:flex;flex-direction:column;gap:2px;border-bottom:2px solid var(--toga-borda);padding-bottom:8px;margin-bottom:12px}
.rf-cab b{font-family:var(--f-display);font-size:1.25rem}.rf-cab span{color:var(--muted);font-size:.8rem}
.rf-mat h4{font-size:1em;color:var(--c);border-left:4px solid var(--c);padding-left:8px}
:root[data-theme="dark"] .rf-mat h4{color:var(--fg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rf-mat h4{color:var(--fg)}}
.rf-mat ul{margin:0;padding-left:18px}.rf-mat li{margin:0 0 3px}
.rf-mat{margin:0 0 26px;padding:0 0 6px;border-bottom:1px solid var(--line)}
.rf-tit{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:center;margin:0 0 4px}
.rf-tit .ilu{max-width:72px}
.rf-mat .rf-tit h3{margin:0;padding:0;border:0;font-size:1.2em;color:var(--c)}
.rf-mat .rf-tit h3::before{display:none}
:root[data-theme="dark"] .rf-mat .rf-tit h3{color:var(--fg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rf-mat .rf-tit h3{color:var(--fg)}}
.rf-mat h4{margin:18px 0 6px}
.rf-verso{margin:8px 0 0;font-size:.8rem;color:var(--muted);font-style:italic;border-top:1px solid var(--line);padding-top:8px}
.rf-verso b{font-style:normal}
@media print{
 body.imp-folha #impressao .resumo-folha{font-size:10.5pt;line-height:1.45;border:0;padding:0;margin:0}
 body.imp-folha #impressao .rf-mat{margin:0 0 14pt}
 body.imp-folha #impressao .rf-mat h4,body.imp-folha #impressao .rf-tit{break-after:avoid}
 body.imp-folha #impressao .rf-mat li{margin:0 0 3pt}
 body.imp-folha #impressao .rf-cab b{font-size:15pt}
 .tema-ban,.verso{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .extras-tema{display:none}
}
@page{margin:10mm}
/* festa */
.festa{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(10,14,24,.55);padding:20px}
.festa canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.festa-card{position:relative;width:min(100%,420px);background:var(--surface);color:var(--fg);border-radius:20px;padding:22px 20px 18px;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.35);animation:pulo .5s cubic-bezier(.2,1.4,.4,1)}
.festa-card .trofeu{width:96px;height:96px;margin:-62px auto 6px;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.festa-card h2{margin:4px 0 4px;font-family:var(--f-display);font-size:1.6rem}
.festa-card .frase{margin:0 0 4px;color:var(--muted)}
.festa-card .verso{text-align:left;margin:14px 0}
@keyframes pulo{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.festa-card{animation:none}}
/* ---------- motivação depois de perder a ofensiva ---------- */
.mv{display:block;overflow:visible;--m1:var(--p1,var(--toga-txt));--m2:var(--p2,var(--lacre))}
.mv *{transform-box:fill-box;transform-origin:50% 100%}
.mv [transform]{transform-box:view-box;transform-origin:0 0}
.motiva .festa-card{padding-top:16px}
.motiva .mv{width:180px;height:135px;margin:0 auto 4px}
.motiva .mv-info{margin:10px 0 0;font-size:.85rem;color:var(--muted)}
.motiva .botoes{margin-top:14px}
.motiva-banner{position:relative;display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;margin:4px 0 14px;padding:12px 14px 12px 8px;border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,#ff8a1f 16%,var(--surface)),color-mix(in srgb,var(--toga-txt) 12%,var(--surface)));border:1px solid color-mix(in srgb,#ff8a1f 30%,var(--line));overflow:hidden}
.motiva-banner .mv{width:96px;height:72px}
.motiva-banner b{display:block;font-family:var(--f-display);font-size:1.05rem;line-height:1.25;margin-bottom:2px}
.motiva-banner p{margin:0;font-size:.9rem;line-height:1.4}
.motiva-banner small{display:block;margin-top:6px;color:var(--muted);font-size:.78rem}
.motiva-banner.segue{background:linear-gradient(135deg,color-mix(in srgb,#3bb273 14%,var(--surface)),color-mix(in srgb,var(--toga-txt) 12%,var(--surface)));border-color:color-mix(in srgb,#3bb273 30%,var(--line))}
[data-estilo="premium"] .motiva-banner{border-radius:24px;border:0;background:linear-gradient(135deg,color-mix(in srgb,#ff8a1f 18%,var(--surface)),color-mix(in srgb,var(--p1) 16%,var(--surface)))}
[data-estilo="premium"] .motiva-banner.segue{background:linear-gradient(135deg,color-mix(in srgb,var(--p2) 16%,var(--surface)),color-mix(in srgb,var(--p1) 16%,var(--surface)))}
/* reacender a chama */
.mv-cinza{fill:var(--line);animation:mv-some .5s 1.3s both}
.mv-fogo{animation:mv-acende 1s 1.1s both}
.mv-fogo .mv-d{animation:cv-danca 1.6s 2.2s ease-in-out infinite}
.mv-fisco{fill:#ffc53d;animation:mv-sobe 1.8s ease-out infinite;transform-origin:50% 50%}
.mv-fisco:nth-of-type(2){animation-delay:.6s}.mv-fisco:nth-of-type(3){animation-delay:1.2s}
/* nascer do sol */
.mv-sol{animation:mv-nasce 1.6s cubic-bezier(.2,.9,.3,1) both}
.mv-raios{transform-origin:50% 50%;animation:mv-gira 12s linear infinite}
.mv-nuvem{animation:mv-vaga 6s ease-in-out infinite alternate}
/* foguete */
.mv-foguete{animation:mv-decola 3s ease-in-out infinite}
.mv-fumaca{transform-origin:50% 50%;animation:mv-fuma 1.2s ease-out infinite}
.mv-fumaca:nth-of-type(2){animation-delay:.4s}.mv-fumaca:nth-of-type(3){animation-delay:.8s}
/* broto */
.mv-caule{stroke-dasharray:80;animation:mv-desenha 1.1s .3s ease-out both}
.mv-folha{animation:mv-abre .6s 1.2s cubic-bezier(.2,1.5,.4,1) both}
.mv-folha.f2{animation-delay:1.5s}.mv-flor{transform-origin:50% 50%;animation:mv-abre .7s 1.9s cubic-bezier(.2,1.5,.4,1) both}
/* escada */
.mv-degrau{animation:cresce .45s ease-out both}
.mv-degrau:nth-of-type(2){animation-delay:.15s}.mv-degrau:nth-of-type(3){animation-delay:.3s}.mv-degrau:nth-of-type(4){animation-delay:.45s}
.mv-estrela{transform-origin:50% 50%;animation:mv-pula 2.6s .6s ease-in-out infinite}
.mv-bandeira{transform-origin:0 100%;animation:mv-tremula 1.2s ease-in-out infinite alternate}
.mv-brilhos{transform-origin:50% 50%;animation:mv-gira 14s linear infinite,mv-pisca 1.6s ease-in-out infinite alternate}
.mv-trofeu{animation:ent-pop .7s cubic-bezier(.2,1.5,.4,1) both}
.mv-cint{transform-origin:50% 50%;animation:pisca 1.4s ease-in-out infinite}.mv-cint.c2{animation-delay:.7s}
.mv-pagina{transform-origin:0 50%;animation:mv-folheia 2.4s ease-in-out infinite}
.mv-letras text{animation:mv-sobe-l 2.4s ease-out infinite}.mv-letras text:nth-child(2){animation-delay:.8s}.mv-letras text:nth-child(3){animation-delay:1.6s}
@keyframes mv-pisca{from{opacity:.45}to{opacity:1}}
@keyframes mv-folheia{0%,15%{transform:none}55%,100%{transform:scaleX(-1)}}
@keyframes mv-sobe-l{0%{transform:translateY(16px);opacity:0}30%{opacity:1}100%{transform:translateY(-8px);opacity:0}}
.motiva-banner.meta{background:linear-gradient(135deg,color-mix(in srgb,#ffc53d 22%,var(--surface)),color-mix(in srgb,#3bb273 14%,var(--surface)));border-color:color-mix(in srgb,#ffc53d 40%,var(--line))}
.mt-selo{display:inline-block;padding:3px 12px;border-radius:99px;background:color-mix(in srgb,#ffc53d 30%,var(--surface));color:var(--fg);font-size:.78rem;font-weight:700;letter-spacing:.02em}
.mt-alvo{transform-origin:50% 50%;animation:mt-treme .5s .55s ease-out both}
.mt-flecha{animation:mt-voa .55s cubic-bezier(.3,.8,.4,1) both}

function md(txt,cor){const L=String(txt).replace(/\r/g,"").split("\n");let h="",i=0;const toc=[];
 const tipoLista=l=>/^- /.test(l)?"ul":/^\d+\. /.test(l)?"ol":null;
 while(i<L.length){const l=L[i].trim();

  if(l.startsWith("# ")){const id="s"+toc.length;toc.push(l.slice(2));h+=`<h3 id="${id}">${inl(l.slice(2))}</h3>`;i++;continue}
  if(l.startsWith("::mapa ")){const c=l.slice(7);const rs=[];i++;while(i<L.length&&L[i].trim().startsWith("* ")){rs.push(L[i].trim().slice(2));i++}h+=mapaMental(c,rs);continue}
  if(l.startsWith("::ilus ")){const p=l.slice(7).split("|");h+=`<figure class="fig ilus">${ilustra(p[0].trim(),cor)}${p[1]?`<figcaption class="leg">${inl(p[1].trim())}</figcaption>`:""}</figure>`;i++;continue}
  if(l.startsWith("::calc ")){const p=l.slice(7).split("|");h+=calcWidget(p[0].trim(),(p[1]||"").trim());i++;continue}
  if(l.startsWith("::")){const sp=l.indexOf(" ");h+=diagrama(l.slice(2,sp),l.slice(sp+1).split("|").map(x=>x.trim()));i++;continue}
  if(l.startsWith("!! ")){let it=[];while(i<L.length&&L[i].trim().startsWith("!! ")){it.push(L[i].trim().slice(3));i++}
   h+=`<aside class="memo">${ilustra("mente",cor)}<b>${ic("lampada")}Para memorizar</b>${it.map(x=>`<p>${inl(x)}</p>`).join("")}</aside>`;continue}
  if(l.startsWith("?? ")){let it=[];while(i<L.length&&L[i].trim().startsWith("?? ")){const s=L[i].trim().slice(3);const k=s.indexOf(" | ");it.push(k<0?[s,""]:[s.slice(0,k),s.slice(k+3)]);i++}
   h+=`<aside class="teste">${ilustra("checklist",cor)}<b>${ic("alvo")}Teste-se</b><p class="tdica">Tente responder sozinho antes de tocar na pergunta para ver a resposta.</p>${it.map(([q,r])=>`<details><summary>${inl(q)}</summary><p>${inl(r)}</p></details>`).join("")}</aside>`;continue}
  if(l.startsWith("> ")){let it=[];while(i<L.length&&L[i].trim().startsWith("> ")){it.push(L[i].trim().slice(2));i++}
   const m=it[0].match(/^([^:]{2,12}):\s*/);let k=m&&CALL[m[1].toLowerCase()];if(k){it[0]=it[0].slice(m[0].length);it[0]=it[0].charAt(0).toUpperCase()+it[0].slice(1)}else k=CALL.dica;
   h+=`<aside class="call ${k[1]}">${k[1]==="ex"?CENA:""}<b>${ic(k[2])}${k[0]}</b>${it.map(x=>`<p>${inl(x)}</p>`).join("")}</aside>`;continue}
  if(l.startsWith("|")){const rows=[];while(i<L.length&&L[i].trim().startsWith("|")){rows.push(L[i].trim().replace(/^\||\|$/g,"").split("|").map(x=>x.trim()));i++}
   h+=`<div class="tab"><table><thead><tr>${rows[0].map(c=>`<th>${inl(c)}</th>`).join("")}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${r.map(c=>`<td>${inl(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;continue}
  const tl=tipoLista(l);if(tl){let it=[];while(i<L.length&&tipoLista(L[i].trim())===tl){it.push(L[i].trim().replace(/^(- |\d+\. )/,""));i++}h+=`<${tl}>${it.map(x=>`<li>${inl(x)}</li>`).join("")}</${tl}>`;continue}
  let p=[];while(i<L.length&&L[i].trim()&&!/^(#|::|!! |\?\? |> |\||- |\d+\. )/.test(L[i].trim())){p.push(L[i].trim());i++}
  if(p.length)h+=`<p>${inl(p.join(" "))}</p>`;else i++;
 }

const METODO=`# Como usar esta apostila
Cada matéria segue o mesmo caminho: primeiro a visão geral, depois os temas em ordem lógica, com exemplos, quadros de atenção e o que costuma cair na prova. No fim vêm as técnicas de memorização e um mapa mental para revisar em poucos minutos.
# Técnicas de memorização que funcionam
- **Leitura ativa:** ao terminar cada tema, feche a tela e explique em voz alta, com suas palavras, o que leu. O que você não conseguir explicar é o que precisa reler.
- **Recuperação (testar-se):** logo depois de ler, faça o simulado de nível 1 da matéria. Errar cedo é útil: o cérebro grava melhor a resposta certa quando a corrige.
- **Repetição espaçada:** revise o mapa mental no dia seguinte, depois de 3 dias, de 7 dias e de 15 dias. Cada revisão leva poucos minutos e segura o conteúdo por muito mais tempo.
- **Siglas e frases-chave:** as siglas da apostila (como LIMPE) servem de gancho. Monte também as suas: quanto mais estranha e pessoal a frase, mais fácil de lembrar.
- **Associação com casos:** ligue cada regra a uma história concreta (o vizinho, o contrato de aluguel, a notícia do jornal). Regra ligada a um caso é lembrada; regra solta é esquecida.
- **Palácio da memória:** imagine um caminho conhecido (sua casa, o trajeto até a faculdade) e "guarde" uma regra em cada cômodo ou ponto do caminho. Para lembrar, percorra o caminho mentalmente.
- **Intercalar matérias:** estude dois ou três temas diferentes na mesma sessão. Parece mais difícil, mas melhora a memória e prepara para provas que misturam assuntos, como a OAB.
> Dica: sessões de 25 a 40 minutos com pausas curtas rendem mais do que horas seguidas. Termine sempre com o mapa mental da matéria.`;

 :{k:"base",nome:"Base",txt:"Leia os temas da apostila com calma e fixe com os cartões. Questões em ritmo leve."}}
function estadoProva(p){const ids=idsDisc(p.d);let o=0,e=0,hoje=0;const h0=inicioDia();
 ids.forEach(id=>{const s=S.stats[id];if(!s)return;if(s.u)o++;else e++;if(s.t&&s.t>=h0)hoje++});
 const feitas=o+e,n=ids.length;const i=periodoDe(p.d);let temas=0,lidos=0;
 if(i>=0&&apOk(i)&&window.APOSTILA[i].mat[p.d]){temas=paginas(p.d).secs.length;lidos=S.lidos&&S.lidos[p.d]?temas:Math.min(temas,(S.apPg&&S.apPg[p.d])||0)}
 else if(S.lidos&&S.lidos[p.d]){temas=1;lidos=1}
 const cob=n?feitas/n:0,ac=feitas?o/feitas:0,lei=temas?lidos/temas:0;
 const preparo=Math.round(100*(.35*cob+.35*(feitas>=5?ac:ac*feitas/5)+.30*lei));
 const datas=(p.datas||[]).map(x=>({...x,n:diasAte(x.dt)})).sort((a,b)=>a.n-b.n);const prox=datas.find(x=>x.n>=0)||null;
 let alvo=0;if(prox){const falta=Math.max(0,n-feitas)+e;alvo=prox.n===0?Math.min(10,Math.max(e,5)):Math.min(40,Math.max(5,Math.ceil(falta/Math.max(1,prox.n))))}
 if(alvo)alvo=Math.max(3,Math.round(alvo*fatorRitmo()));
 const urg=prox?(100-preparo+10)/(prox.n+1):0;
 return {p,ids,n,o,e,feitas,hoje,acerto:feitas?Math.round(ac*100):null,temas,lidos,preparo,datas,prox,alvo,urg,etapa:prox?etapaProva(prox.n):null}}
function provasAtivas(){return provasFac().map(estadoProva).filter(x=>x.prox).sort((a,b)=>b.urg-a.urg)}
function proxSimDisc(d){const n=nFac(d);for(let i=0;i<n;i++){const k=`fac:${d}:${i}`;if(livreSim(k))return k}return null}
/* meta diária: soma o que cada prova pede (as próximas 3 semanas), sem baixar da meta normal */
function metaProvas(){if(!avOn())return 0;return Math.min(100,provasAtivas().filter(x=>x.prox.n<=21).reduce((s,x)=>s+x.alvo,0))}
/* ---------- notas no formato Afya Unigranrio ----------

   vai para o exame final (toda a matéria, de 0 a 100) e passa se (N1 + N2 + exame) ÷ 2 for 50 ou mais.
   Abaixo de 40, reprovação. A substitutiva é só para quem faltou: entra no lugar da N1 ou da N2 que ficou sem nota. */
const NOTA_REGRA={dir:70,ex:40,fim:50};
const notasOn=()=>!!(S.cfg&&S.cfg.notas);
const fmtNota=v=>(Math.round(v*10)/10).toLocaleString("pt-BR");
function situacaoNotas(p){const N=p.notas||{};const le=k=>N[k]===""||N[k]==null||isNaN(+N[k])?null:+N[k];
 const v1=le("v1")||50,v2=le("v2")||(100-v1>0?100-v1:50);const lim=(x,m)=>x===null?null:Math.max(0,Math.min(m,x));
 let n1=lim(le("n1"),v1),n2=lim(le("n2"),v2),sub=le("sub"),ex=lim(le("ex"),100),usouSub=null;
 if(sub!==null){if(n1===null){n1=lim(sub,v1);usouSub="N1"}else if(n2===null){n2=lim(sub,v2);usouSub="N2"}}
 const R=NOTA_REGRA,base={n1,n2,ex,v1,v2,usouSub,ignorouSub:sub!==null&&!usouSub};
 if(n1===null&&n2===null)return {...base,est:"vazio",soma:null};
 if(n1===null||n2===null){const tem=n1!==null?n1:n2,falta=n1!==null?"N2":"N1",max=n1!==null?v2:v1;const pDir=R.dir-tem,pEx=R.ex-tem;
  if(pDir<=0)return {...base,est:"aprovado",soma:tem,titulo:"Aprovação garantida",msg:`Você já somou ${fmtNota(tem)} pontos. Mesmo com zero na ${falta}, passa direto. Agora é estudar para aprender de verdade.`};
  if(pDir<=max)return {...base,est:"parcial",soma:tem,falta:pDir,titulo:`Mire em ${fmtNota(pDir)} na ${falta}`,msg:`Com ${fmtNota(tem)} pontos até aqui, você precisa de ${fmtNota(pDir)} de ${fmtNota(max)} na ${falta} para passar direto (70). ${pEx>0?`Com ${fmtNota(pEx)} já garante o exame final.`:"O exame final já está garantido como rede de segurança."}`};
  if(pEx<=max)return {...base,est:"parcial",soma:tem,falta:pEx,titulo:`Mire em ${fmtNota(pEx)} na ${falta}`,msg:`A ${falta} vale ${fmtNota(max)}, então os 70 direto ficaram fora de alcance. Com ${fmtNota(pEx)} você chega aos 40 e ganha a chance do exame final. Dá para virar.`};
  return {...base,est:"parcial",soma:tem,titulo:`Capriche na ${falta}`,msg:`Nem a nota máxima na ${falta} leva aos 40. Converse com a coordenação sobre as opções e use a ${falta} para aprender o máximo.`}}
 const soma=n1+n2;
 if(soma>=R.dir)return {...base,est:"aprovado",soma,titulo:"Aprovado direto!",msg:`N1 + N2 = ${fmtNota(soma)} pontos. Passou sem exame final. Parabéns, o esforço valeu.`};
 if(soma<R.ex)return {...base,est:"reprovado",soma,titulo:"Abaixo de 40",msg:`N1 + N2 = ${fmtNota(soma)} pontos, menos que os 40 do exame final. Confira com a coordenação e use o app para chegar mais forte na próxima vez.`};

 if(ex===null)return {...base,est:"exame",soma,falta:preciso,titulo:`Exame final: precisa de ${fmtNota(preciso)}`,msg:`N1 + N2 = ${fmtNota(soma)} pontos. No exame final (toda a matéria, de 0 a 100) você precisa de ${fmtNota(preciso)} para a média (soma + exame) ÷ 2 chegar a 50.`};
 const media=(soma+ex)/2;
 return media>=R.fim?{...base,est:"aprovado",soma,media,titulo:"Aprovado no exame final!",msg:`Média final ${fmtNota(media)} (${fmtNota(soma)} + ${fmtNota(ex)}) ÷ 2. Você virou o jogo.`}
  :{...base,est:"reprovado",soma,media,titulo:`Média final ${fmtNota(media)}`,msg:`Faltaram ${fmtNota(R.fim-media)} pontos na média. Procure a coordenação e não desanime: cada questão que você faz aqui conta para a próxima.`}}

/* ---------- dias de estudo, metas e prova ---------- */
const hojeStr=t=>{const d=t?new Date(t):new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())};
const inicioDia=t=>{const d=new Date(t||Date.now());d.setHours(0,0,0,0);return d.getTime()};
const temAtiv=x=>!!x&&((x.q||0)+(x.c||0)+(x.p||0))>0;
function marcarDia(campo,n){S.dias=S.dias||{};const k=hojeStr();const x=S.dias[k]=S.dias[k]||{q:0,c:0,p:0};const antes=x.q||0;x[campo]=(x[campo]||0)+(n||1);
 if(campo==="q"){const m=metaDia();if(antes<m&&x.q>=m)metaNova=true}
 const ks=Object.keys(S.dias).sort();if(ks.length>400)ks.slice(0,ks.length-400).forEach(z=>delete S.dias[z])}
function sequencia(){const D=S.dias||{};let n=0;const d=new Date();if(!temAtiv(D[hojeStr(d)]))d.setDate(d.getDate()-1);while(temAtiv(D[hojeStr(d.getTime())])){n++;d.setDate(d.getDate()-1)}return n}
/* configurações do estudante: período atual, data da prova (opcional) e ritmo */
function perAtual(){const p=S.cfg&&S.cfg.per;return (p===undefined||p===null||p==="")?null:+p}
function diasProva(){const p=S.cfg&&S.cfg.prova;if(!p)return null;const t=new Date(p+"T12:00:00").getTime();if(isNaN(t))return null;return Math.ceil((inicioDia(t)-inicioDia())/864e5)}

/* ---------- cartões de memorização (revisão espaçada) ---------- */
const INTERV=[0,1,3,7,15,30,60,120];
function cartoesDe(d){const P=paginas(d);const out=[];P.secs.forEach((s,k)=>{let j=0;s.corpo.split("\n").forEach(l=>{l=l.trim();if(l.startsWith("?? ")){const x=l.slice(3);const m=x.indexOf(" | ");if(m>0)out.push({id:`${d}:${k+1}:${j}`,d,k:k+1,p:x.slice(0,m),r:x.slice(m+3)});j++}})});return out}
const estC=id=>(S.cards&&S.cards[id])||null;
const DIA=864e5;
/* Cada cartão guarda o intervalo atual (iv, em dias) e a facilidade (ef). Acertar multiplica o intervalo pela facilidade;
   errar zera o intervalo e torna o cartão um pouco mais "difícil", para ele voltar com mais frequência. Cartões antigos (só com b) são convertidos. */
function sr(s){s=s||{};if(s.iv===undefined){s.iv=s.b?INTERV[Math.min(INTERV.length-1,s.b)]:0;s.ef=2.5}if(!s.ef)s.ef=2.5;return s}
function proxIv(s0,nota){const s=sr(Object.assign({},s0));let iv=s.iv||0,ef=s.ef;
 if(nota===0)return {iv:0,ef:Math.max(1.3,ef-0.2)};
 if(nota===1){iv=iv<1?1:Math.max(iv+1,Math.round(iv*1.2));ef=Math.max(1.3,ef-0.15)}
 else if(nota===2){iv=iv<1?1:iv<3?3:Math.round(iv*ef)}
 else{iv=iv<1?4:Math.round(Math.max(iv,1)*ef*1.3)+1;ef=Math.min(3.2,ef+0.15)}
 return {iv:Math.min(365,iv),ef}}
const txtIv=d=>d<1?"hoje":d===1?"amanhã":d<30?`em ${d} dias`:d<60?"em 1 mês":`em ${Math.round(d/30)} meses`;
function contaVencidos(){const now=Date.now();return Object.keys(S.cards||{}).filter(id=>S.cards[id].due<=now).length}
function infoDeck(d){const cs=cartoesDe(d);const now=Date.now();let novos=0,venc=0;cs.forEach(c=>{const s=estC(c.id);if(!s)novos++;else if(s.due<=now)venc++});return {cs,novos,venc}}
let deck=null;
function montarDeck(ds,novosMax){const now=Date.now();let v=[],n=[];ds.forEach(d=>{cartoesDe(d).forEach(c=>{const s=estC(c.id);if(!s)n.push(c);else if(s.due<=now)v.push(c)})});
 v.sort((a,b)=>estC(a.id).due-estC(b.id).due);return emb(v).concat(n.slice(0,novosMax))}
function iniciarDeck(ds,novosMax,titulo){Promise.all([...new Set(ds.map(periodoDe))].map(carregarApP)).then(()=>{const q=montarDeck(ds.filter(d=>apOk(periodoDe(d))),novosMax);
  deck={titulo,q,pos:0,virado:false,ok:0,er:0,tot:q.length};ir({tela:"cartao"})})}

 const ds=PERIODOS[i].filter(d=>window.APOSTILA[i].mat&&window.APOSTILA[i].mat[d]);const venc=contaVencidos();
 const extra=`<div class="periodos" role="group" aria-label="Período">${PERIODOS.map((_,j)=>`<button data-acao="cards-per" data-p="${j}" aria-pressed="${i===j}">${j+1}º período</button>`).join("")}</div>`;
 return topo("Cartões de memorização","Perguntas das apostilas com revisão espaçada",{menu:true,extra})+
 `<main class="wrap">${capaTela("cartas","Memorize sem decorar","Tente lembrar antes de virar. O app traz cada cartão de volta na hora certa.")}<div class="dica"><p style="margin:0">Leia a pergunta, tente responder de cabeça e só depois vire o cartão. Depois diga como foi: <b>Errei</b>, <b>Difícil</b>, <b>Acertei</b> ou <b>Fácil</b>. Cada cartão aprende o seu ritmo: o que você acerta com facilidade volta cada vez mais tarde, e o que você erra volta logo, até fixar.</p></div>

function telaCartao(){if(!deck)return topo("Cartões","",{})+`<main class="wrap">${vazio("cartas","Nenhuma sessão aberta","Escolha uma matéria para estudar os cartões dela, ou revise os que chegaram no dia de hoje.",`<button class="botao cheio" data-acao="ir-raiz" data-tela="cartoes">Escolher cartões</button>`)}</main>`;
 if(deck.pos>=deck.q.length){const v=versoGeral(deck.tot+deck.ok);
  if(!deck.tot)return topo(deck.titulo,"Tudo em dia",{})+`<main class="wrap">${vazio("cartas","Nada para revisar agora","Todos os cartões estão em dia. Volte amanhã, ou estude cartões novos de uma matéria: eles entram na revisão espaçada a partir da primeira resposta.",`<button class="botao cheio" data-acao="ir-raiz" data-tela="cartoes">Escolher cartões novos</button>`)}</main>`;
  return topo(deck.titulo,"Sessão concluída",{})+`<main class="wrap"><div class="placar ${deck.er?"aprov":"perf"}"><div class="pct">${deck.tot}</div><div><h2>Sessão concluída</h2><p>${deck.ok} acertos de primeira · ${deck.er} para rever</p><p>${(()=>{const now=Date.now();const am=Object.keys(S.cards||{}).filter(id=>S.cards[id].due<=inicioDia(now)+2*DIA).length;return am?`Amanhã: ${am} cartão${am>1?"es":""} para revisar.`:"Nenhum cartão marcado para amanhã."})()}</p></div></div>${versoCard(v,"Para seguir firme")}
  <div class="botoes"><button class="botao cheio" data-acao="voltar">Voltar</button></div></main>`}
 const c=deck.q[deck.pos];const f=infoDisc(c.d);const s=estC(c.id);
 const lab=n=>n===0?"volta nesta sessão":txtIv(proxIv(s,n).iv);
 return topo(deck.titulo,`Cartão ${deck.pos+1} de ${deck.q.length}`,{extra:`<div class="progresso-leitura"><i style="width:${Math.round(deck.pos*100/deck.q.length)}%"></i></div>`})+
 `<main class="wrap"><div class="flash" style="--c:${f.cor}">${ilustra(AP_DISC[c.d]||"livros",f.cor)}<div class="flash-cab">${tile(f.cor,f.ic)}<span>${esc(nomeCurto(f.nome))} · Tema ${c.k}${s?(s.lap?` · errou ${s.lap}×`:""):" · novo"}</span></div>
 <p class="flash-q">${inl(c.p)}</p>${deck.virado?`<div class="flash-r">${inl(c.r)}</div>`:""}</div>
 ${deck.virado?`<p class="nota-q" id="pergunta-nota">Como foi lembrar a resposta?</p><div class="notas-flash" role="group" aria-labelledby="pergunta-nota"><button class="botao linha f-er" data-acao="card-nota" data-v="0">Errei<small>${lab(0)}</small></button><button class="botao linha" data-acao="card-nota" data-v="1">Difícil<small>${lab(1)}</small></button><button class="botao linha" data-acao="card-nota" data-v="2">Acertei<small>${lab(2)}</small></button><button class="botao linha f-ok" data-acao="card-nota" data-v="3">Fácil<small>${lab(3)}</small></button></div>
  <button class="link-tema" data-acao="abrir-tema" data-d="${c.d}" data-k="${c.k}">${ic("livro")} Ver este tema na apostila</button>`
 :`<div class="botoes"><button class="botao cheio" data-acao="card-virar">Mostrar resposta</button></div>`}</main>`}
function avaliarCartao(nota){const c=deck.q[deck.pos];S.cards=S.cards||{};const s=sr(S.cards[c.id]||{b:0,due:0,n:0});const agora=Date.now();const r=proxIv(s,nota);s.ef=r.ef;
 if(nota===0){s.iv=0;s.b=0;s.lap=(s.lap||0)+1;s.due=agora+10*60*1000;if(!c.rep){deck.q.push(Object.assign({},c,{rep:1}))}deck.er+=c.rep?0:1}
 else{/* pequena variação nos intervalos longos evita que muitos cartões vençam no mesmo dia */
  let iv=r.iv;if(iv>=7)iv=Math.max(1,iv+Math.round(iv*0.06*(Math.random()*2-1)));s.iv=iv;s.b=INTERV.findIndex(x=>x>=iv);if(s.b<0)s.b=INTERV.length-1;
  s.due=inicioDia(agora)+iv*DIA;if(!c.rep)deck.ok++}
 s.n=(s.n||0)+1;S.cards[c.id]=s;marcarDia("c");salvar();deck.pos++;deck.virado=false;anunciar(nota===0?"O cartão volta ainda nesta sessão":"Próxima revisão "+txtIv(s.iv))}

const INTERV_AP=[1,7,15,30,60];
function agendaAp(){S.revAp=S.revAp||{};Object.keys(S.lidos||{}).forEach(d=>{if(!S.revAp[d])S.revAp[d]={n:0,prox:inicioDia(S.lidos[d])+864e5}});Object.keys(S.revAp).forEach(d=>{if(!(S.lidos&&S.lidos[d]))delete S.revAp[d]});return S.revAp}
function apsVencidas(){const A=agendaAp();const now=Date.now();return Object.keys(A).filter(d=>A[d].prox<=now&&DISC[d])}
function errosPendentes(){return Object.keys(S.stats).filter(k=>S.stats[k].u===0&&QMAP[k]).length}
function itensHoje(){return contaVencidos()+apsVencidas().length+(errosHoje().length?1:0)}
function itemPlano(feito,acao,attrs,cor,icn,tit,sub,desab){return `<button class="item plano${feito?" feito":""}" data-acao="${acao}" ${attrs||""} ${desab?"disabled":""}>${tile(feito?"var(--ok)":cor,feito?"ok":icn)}<span style="min-width:0"><span class="item-tit">${tit}</span><br><span class="item-sub">${sub}</span></span><span class="item-data">${ic("prox")}</span></button>`}
/* anel de progresso da meta e semana de estudo */
function anel(v,max,rot){const p=max?Math.min(1,v/max):0;const C=2*Math.PI*42;
 return `<svg class="anel" viewBox="0 0 100 100" role="img" aria-label="${esc(rot)}"><circle cx="50" cy="50" r="42" class="anel-t"/><circle cx="50" cy="50" r="42" class="anel-v${p>=1?" cheio":""}" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-p)).toFixed(1)}" transform="rotate(-90 50 50)"/></svg>`}
function semana(){const D=S.dias||{};const fmt=new Intl.DateTimeFormat("pt-BR",{weekday:"long"});let h="",n=0;
 for(let k=6;k>=0;k--){const d=new Date();d.setDate(d.getDate()-k);const on=temAtiv(D[hojeStr(d.getTime())]);if(on)n++;
  h+=`<li class="dia${on?" on":""}${k===0?" hoje":""}" style="--d:${6-k}"><i aria-hidden="true">${on?ic("ok"):""}</i><span aria-hidden="true">${fmt.format(d).slice(0,1).toUpperCase()}</span><span class="sr">${fmt.format(d)}${k===0?" (hoje)":""}: ${on?"estudou":"sem estudo"}</span></li>`}
 return `<ol class="semana" aria-label="Estudo nos últimos 7 dias: ${n} de 7">${h}</ol>`}

const LS=(window.LEISECA||[]).filter(x=>x&&x.t&&Array.isArray(x.l)&&x.l.length===4&&x.t.indexOf(x.l[0])>=0&&META[x.m]);
const LSMAP={};LS.forEach(x=>LSMAP[x.id]=x);
let lsSess=null;
function lsMats(){return [...new Set(LS.map(x=>x.m))]}
function lsFiltro(){const f=rota.lsm||"todas";return f==="todas"?LS:LS.filter(x=>x.m===f)}
function lsSt(id){return (S.ls||{})[id]}
function lsDominado(id){const x=lsSt(id);return !!(x&&x.u===1&&x.a>=2)}
function telaLeiSeca(){const L=lsFiltro();const f=rota.lsm||"todas";const dom=L.filter(x=>lsDominado(x.id)).length;const err=L.filter(x=>{const z=lsSt(x.id);return z&&z.u===0}).length;
 const chips=`<div class="chips" role="group" aria-label="Filtrar por matéria"><button data-acao="ls-filtro" data-v="todas" aria-pressed="${f==="todas"}">Todas</button>${lsMats().map(m=>`<button data-acao="ls-filtro" data-v="${m}" aria-pressed="${f===m}">${esc(nomeCurto(META[m].nome))}</button>`).join("")}</div>`;
 return topo("Lei seca",`${L.length} dispositivos · ${dom} dominados`,{menu:true,extra:chips})+
 `<main class="wrap">${capaTela("pergaminho","A letra da lei","A FGV cobra o texto literal. Treine os artigos que mais caem.")}<div class="dica"><p style="margin:0">Treine o texto literal dos artigos mais cobrados. Em <b>Complete o artigo</b>, escolha o trecho que falta. Em <b>Certo ou errado</b>, diga se o texto mostrado é o da lei ou uma versão alterada, como a banca costuma fazer. O dispositivo conta como dominado depois de dois acertos seguidos.</p></div>
 <div class="botoes" style="margin-top:14px;display:grid;gap:10px">
  <button class="botao cheio" data-acao="ls-iniciar" data-modo="lac">Complete o artigo</button>
  <button class="botao linha" data-acao="ls-iniciar" data-modo="ce">Certo ou errado</button>
  ${err?`<button class="botao linha" data-acao="ls-iniciar" data-modo="err">Refazer os que errei (${err})</button>`:""}
 </div>
 <h2 style="margin:22px 2px 8px;font-size:1rem;font-family:var(--f-display)">Texto dos dispositivos</h2>
 <div class="alts ls-lista">${L.map(x=>{const z=lsSt(x.id);const st=lsDominado(x.id)?"dominado":z?(z.u?"acertou a última":"errou a última"):"não treinado";
  return `<details><summary><span>${esc(x.ref)}</span><small>${st}</small></summary><p>${esc(x.t)}</p></details>`}).join("")}</div>
 <p class="ls-ref" style="text-align:center;margin-top:14px">Textos conferidos com a legislação compilada do Planalto.</p></main>`}
function lsIniciar(modo){let L=lsFiltro();
 if(modo==="err")L=L.filter(x=>{const z=lsSt(x.id);return z&&z.u===0});
 else L=emb(L).sort((a,b)=>(lsDominado(a.id)?1:0)-(lsDominado(b.id)?1:0));
 L=L.slice(0,10);if(!L.length)return;
 const itens=L.map(x=>{const m=modo==="err"?(Math.random()<.5?"lac":"ce"):modo;return {id:x.id,modo:m,ord:emb([0,1,2,3]),certo:Math.random()<.5}});
 lsSess={itens,i:0,resp:{},ok:0};ir({tela:"ls-quiz"})}
function lsTextoLacuna(x,mostrar){const k=x.t.indexOf(x.l[0]);const a=esc(x.t.slice(0,k)),b=esc(x.t.slice(k+x.l[0].length));
 return a+(mostrar?`<span class="ls-marca">${esc(x.l[0])}</span>`:`<span class="ls-lac" aria-label="lacuna">${"_".repeat(10)}</span>`)+b}
function telaLsQuiz(){const s=lsSess;if(!s){rota={tela:"leiseca"};return telaLeiSeca()}
 if(s.i>=s.itens.length)return telaLsFim();
 const it=s.itens[s.i],x=LSMAP[it.id];if(!x){s.i++;return telaLsQuiz()}
 const r=s.resp[s.i],resp=r!==undefined;const M=META[x.m];
 const cab=`<div class="q-cab"><div class="q-mat">${tile(M.cor,M.ic)}<b>${esc(M.nome)}</b><span>· ${it.modo==="lac"?"Complete o artigo":"Certo ou errado"}</span></div>`;
 let corpo="";
 if(it.modo==="lac"){
  corpo=cab+`<p class="ls-texto">${lsTextoLacuna(x,resp)}</p><p class="ls-ref">${esc(x.ref)}</p></div>
  <div class="alts" role="radiogroup" aria-label="Trechos">${it.ord.map((oi,pos)=>{let c="";if(resp){if(oi===0)c="certa";else if(oi===r)c="errada"}
   return `<button class="alt ${c}" role="radio" aria-checked="${oi===r}" data-acao="ls-resp" data-v="${oi}" ${resp?"disabled":""}><span class="letra">${LETRAS[pos]}</span><span>${esc(x.l[oi])}</span></button>`}).join("")}</div>`;
  if(resp)corpo+=`<div class="coment ${r===0?"":"err"}"><h3>${r===0?"Resposta correta":"Resposta incorreta"}</h3><p>O texto da lei diz: <b>${esc(x.l[0])}</b>.</p>${x.ex?`<p>${esc(x.ex)}</p>`:""}<p class="fund">${esc(x.ref)}</p></div>`}
 else{const mostrado=it.certo?x.t:x.e;const acertou=resp&&((r===1)===it.certo);
  corpo=cab+`<p class="ls-texto">“${esc(mostrado)}”</p><p class="ls-ref">${esc(x.ref)}</p></div>
  <p style="margin:14px 2px 0;font-weight:600">Este é o texto da lei?</p>
  <div class="ls-ce"><button class="botao linha ${resp?(it.certo?"certa":r===1?"errada":""):""}" data-acao="ls-resp" data-v="1" ${resp?"disabled":""}>Certo</button><button class="botao linha ${resp?(!it.certo?"certa":r===0?"errada":""):""}" data-acao="ls-resp" data-v="0" ${resp?"disabled":""}>Errado</button></div>`;
  if(resp)corpo+=`<div class="coment ${acertou?"":"err"}"><h3>${acertou?"Resposta correta":"Resposta incorreta"} · ${it.certo?"o texto estava certo":"o texto estava alterado"}</h3>${it.certo?"":`<p>${esc(x.ex||"")}</p><p><b>Texto da lei:</b> ${esc(x.t)}</p>`}<p class="fund">${esc(x.ref)}</p></div>`}
 const ult=s.i===s.itens.length-1;
 return topo(`Lei seca · ${s.i+1} de ${s.itens.length}`,"",{voltarAcao:"ls-sair"})+`<main class="wrap">${corpo}</main>
 <nav class="nav"><div class="nav-in"><button data-acao="ls-sair">${ic("ant")}<span>Sair</span></button><span></span><button data-acao="ls-prox" class="forte" ${resp?"":"disabled"}>${ic("prox")}<span>${ult?"Ver resultado":"Próximo"}</span></button></div></nav>`}
function telaLsFim(){const s=lsSess,n=s.itens.length;
 const lista=s.itens.map((it,k)=>{const x=LSMAP[it.id];if(!x)return "";const r=s.resp[k];const ok=it.modo==="lac"?r===0:((r===1)===it.certo);
  return `<details><summary><span>${esc(x.ref)}</span><small class="${ok?"c-ok":"c-er"}">${ok?"acertou":"errou"}</small></summary><p>${esc(x.t)}</p></details>`}).join("");
 return topo("Resultado · lei seca","",{voltarAcao:"ls-sair"})+`<main class="wrap"><div class="q-cab" style="text-align:center"><p class="q-enun" style="font-size:1.6rem"><b>${s.ok} de ${n}</b></p><p class="ls-ref" style="margin-top:4px">acertos nesta rodada</p></div>
 <div class="alts ls-lista" style="margin-top:14px">${lista}</div>
 <div style="display:grid;gap:10px;margin-top:14px"><button class="botao cheio" data-acao="ls-sair">Voltar à lei seca</button></div></main>`}
function lsResponder(v){const s=lsSess;if(!s||s.resp[s.i]!==undefined)return;const it=s.itens[s.i];const ok=it.modo==="lac"?v===0:((v===1)===it.certo);
 s.resp[s.i]=v;if(ok)s.ok++;S.ls=S.ls||{};const z=S.ls[it.id]=S.ls[it.id]||{a:0,e:0,u:0};
 if(ok){z.a=z.u===1?z.a+1:1;z.u=1}else{z.e=(z.e||0)+1;z.a=0;z.u=0}z.d=Date.now();
 marcarDia("q");salvar();rota.manterScroll=true;render()}

/* ---------- gaveta ---------- */

  const it=(t,n,l)=>`<button data-acao="ir-raiz" data-tela="${t}"${rota.tela===t?' aria-current="page"':""}>${ic(n)}<span>${l}</span></button>`;

   <nav aria-label="Seções do app">${it("hoje","alvo","Hoje"+(itensHoje()?` <span class="badge">${itensHoje()}</span>`:""))}${it("metas","barras","Metas e desempenho")}${it("progresso","pct","Progresso geral")}${it("busca","lupa","Buscar em tudo")}
   <p class="nav-grupo">Estudar</p>${it("faculdade","livro","Faculdade (1º ao 10º)")}${it("cartoes","cartas","Cartões de memorização")}${it("leiseca","recibo","Lei seca")}${it("favs","marcador","Favoritos e anotações")}
   <p class="nav-grupo">Treinar</p>${it("oab","carro","Simulados OAB")}${it("materias","grade","Simulados por matéria")}
