html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
html{background:var(--bg);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:where(a,button,input,select,textarea,summary,[tabindex]):focus-visible{outline:2px solid var(--foco,var(--lacre));outline-offset:2px}
main:focus{outline:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* barra superior */
.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--toga);color:var(--toga-fg);box-shadow:0 2px 6px rgba(0,0,0,.18)}
.topo-linha{display:flex;align-items:center;gap:8px;min-height:60px}
.topo h1{font-family:var(--f-display);font-weight:700;font-size:1.3rem;margin:0;flex:1;min-width:0;line-height:1.15;text-wrap:balance}
.topo h1.longo{font-size:1.08rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.topo h1.longo small{display:none}
.topo h1 small{display:block;font-family:var(--f-body);font-weight:400;font-size:.78rem;opacity:.8;letter-spacing:.02em}
.icone{background:none;border:0;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:inherit;flex:none;margin-left:-8px}
.icone:hover{background:rgba(255,255,255,.12)}
.relogio{font-family:var(--f-mono);font-size:1.05rem;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.relogio.alerta{color:#ffd28a}
.abas{display:flex}
.abas button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:12px 0 10px;font-weight:700;letter-spacing:.08em;font-size:.85rem;text-transform:uppercase;color:rgba(255,255,255,.78)}
.abas button[aria-selected="true"]{color:#fff;border-color:var(--lacre)}
.periodos{display:flex;gap:8px;overflow-x:auto;padding-block:4px 12px;scrollbar-width:none}
.periodos::-webkit-scrollbar{display:none}
.periodos button{flex:none;border:1.5px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:.88rem;font-variant-numeric:tabular-nums}
.periodos button[aria-pressed="true"]{background:var(--lacre);border-color:var(--lacre);color:var(--lacre-fg)}

main{flex:1;padding-block:18px 120px}
.secao{display:flex;align-items:center;gap:12px;margin:28px 0 12px;font-weight:700;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.secao::after{content:"";flex:1;height:1px;background:var(--line)}
.secao:first-child{margin-top:4px}
.nota{font-size:.88rem;color:var(--muted);margin:0}
.nivel{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--c);line-height:1}
.barras{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.barras i{display:block;width:3px;border-radius:1px;background:currentColor;opacity:.25}
.barras i:nth-child(1){height:4px}.barras i:nth-child(2){height:6px}.barras i:nth-child(3){height:8px}.barras i:nth-child(4){height:10px}.barras i:nth-child(5){height:12px}
.barras i.on{opacity:1}
.escada{display:flex;gap:4px;margin-top:10px}
.escada span{flex:1;min-width:0;border-radius:8px;padding:7px 5px 6px;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);font-size:.66rem;line-height:1.2;color:var(--muted)}
.escada b{display:block;color:var(--fg);font-size:.78rem}
.box-nivel{border-left:4px solid var(--c);background:var(--surface-2);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.box-nivel p{margin:0;font-size:.92rem}
.q-niv{display:flex;margin:-2px 0 10px;font-size:.7rem}

/* métricas (progresso) */
.metrica{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;margin-bottom:12px}
.tile{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;color:#fff;background:var(--c)}
.metrica .top{display:flex;justify-content:space-between;gap:8px;font-size:1rem}
.metrica .top b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.trilho{height:8px;border-radius:4px;background:var(--trilho);overflow:hidden;display:flex;margin-top:6px}
.trilho i{display:block;height:100%}
.f-ok{background:var(--ok)} .f-er{background:var(--erro)} .f-lacre{background:var(--lacre)} .f-toga{background:var(--toga)}
.cont{display:flex;gap:12px;font-family:var(--f-mono);font-size:.85rem;font-variant-numeric:tabular-nums;align-items:center}
.ck{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:4px;color:#fff;margin-right:4px;vertical-align:-3px}
.ck svg.i{width:11px;height:11px;stroke-width:3.2}
.ck.ok{background:var(--ok)} .ck.er{background:var(--erro)} .ck.br{background:var(--aviso)}

/* acertos por assunto */
.assuntos{display:flex;flex-direction:column;gap:8px}
.assunto{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;align-items:stretch;border:0;background:none;padding:0;text-align:left;width:100%}
.assunto .tile{width:48px;height:48px;border-radius:8px}
.assunto .barra{position:relative;border-radius:8px;overflow:hidden;background:var(--surface-2);display:flex;align-items:center;min-height:48px}
.assunto .barra .ok{position:absolute;inset:0 auto 0 0;background:var(--ok);opacity:.9}
.assunto .barra .er{position:absolute;inset:0 0 0 auto;background:var(--erro);opacity:.85}
.assunto .barra span{position:relative;display:flex;justify-content:space-between;gap:8px;width:100%;padding:0 14px;font-weight:700;color:var(--fg);min-width:0}
.assunto .barra.tem span{color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.assunto .barra span em{font-style:normal;font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums;flex:none}
.assunto .barra span b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.assunto:hover .barra{filter:brightness(1.05)}

/* listas de simulados */
.lista{display:flex;flex-direction:column;background:var(--surface);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.item{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.item:first-child{border-top:0}
.item{transition:background-color .15s}
.item:hover:not([disabled]){background:var(--surface-2)}
.selo{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff}
.selo svg.i{width:26px;height:26px;stroke-width:2.6}
.selo.nao{background:var(--neutro)} .selo.pausa{background:var(--lacre)} .selo.aprov{background:var(--ok)} .selo.reprov{background:var(--erro)} .selo.perf{background:var(--toga)}
.item-tit{font-family:var(--f-display);font-weight:600;font-size:1.08rem;line-height:1.25}
.item-sub{font-size:.86rem;color:var(--muted)}
.item .cont{margin-top:3px}
.item-data{font-size:.8rem;color:var(--muted);text-align:right;white-space:nowrap;line-height:1.35}

/* cartões de matéria */
.grade-mat{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;transition:border-color .15s,background-color .15s;display:flex;flex-direction:column;gap:10px;text-align:left;min-width:0}
.card:hover{border-color:var(--toga-txt)}
.card .tile{width:44px;height:44px;border-radius:10px}
.card b{font-family:var(--f-display);font-weight:600;font-size:1.05rem;line-height:1.2}
.card small{color:var(--muted);font-size:.82rem}
.card .trilho{margin-top:0}
.card.destaque{border:2px solid var(--lacre);background:var(--surface)}
.card.destaque b{font-size:1.15rem}

/* destaque e cabeçalho de matéria */
.cabeca{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;align-items:center;margin-bottom:6px}
.cabeca .tile{width:56px;height:56px;border-radius:12px}
.cabeca .tile svg.i{width:28px;height:28px}
.cabeca h2{margin:0;font-family:var(--f-display);font-size:1.35rem;line-height:1.2}
.dica{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--lacre);border-radius:var(--r);padding:12px 14px;font-size:.92rem}

/* FAB */
.fab{position:fixed;right:max(20px,calc(env(safe-area-inset-right,0px) + 20px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;border:0;background:var(--lacre);color:var(--lacre-fg);display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.28);z-index:7}
.fab svg.i{width:30px;height:30px;stroke-width:2.6}

/* gaveta */
.camada{position:fixed;inset:0;z-index:20;background:rgba(16,8,10,.55);display:flex}
.gaveta{width:min(82vw,330px);height:100%;background:var(--surface);overflow:auto;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:4px 0 18px rgba(0,0,0,.3)}
.gaveta-topo{background:var(--toga);color:#fff;padding:calc(28px + env(safe-area-inset-top,0px)) 20px 20px max(20px,env(safe-area-inset-left,0px))}
.gaveta-topo svg.i{width:44px;height:44px;stroke-width:1.6}
.gaveta-topo b{display:block;font-family:var(--f-display);font-size:1.25rem;margin-top:10px}
.gaveta-topo small{opacity:.8}
html[data-anim="on"] .camada.abre{animation:cam-entra .28s ease-out both}
html[data-anim="on"] .camada.abre .gaveta{animation:gav-entra .34s cubic-bezier(.2,.9,.3,1) both}
html[data-anim="on"] .camada.abre .gaveta nav>*{animation:gav-item .38s ease-out both}
html[data-anim="on"] .camada.abre .gaveta nav>*:nth-child(n){animation-delay:calc(.06s + var(--gi,0)*.025s)}
.camada.sai{animation:cam-sai .3s ease-in both}.camada.sai .gaveta{animation:gav-sai .3s cubic-bezier(.4,0,.8,.4) both}
@keyframes cam-entra{from{background:rgba(16,8,10,0)}}
@keyframes cam-sai{to{background:rgba(16,8,10,0)}}
@keyframes gav-entra{from{transform:translateX(-102%)}}
@keyframes gav-sai{to{transform:translateX(-102%)}}
@keyframes gav-item{from{opacity:0;transform:translateX(-18px)}}
.gaveta nav{display:flex;flex-direction:column;padding-block:8px}
.gaveta nav button{display:flex;gap:18px;align-items:center;background:none;border:0;padding:14px 20px 14px max(20px,env(safe-area-inset-left,0px));text-align:left;font-size:1.02rem}
.gaveta nav button:hover,.gaveta nav button[aria-current="page"]{background:var(--surface-2)}
.gaveta nav button[aria-current="page"]{font-weight:700}
.gaveta,.folha,.camada,.folha-camada{overscroll-behavior:contain}
.gaveta nav button svg.i{color:var(--muted)}
.gaveta hr{border:0;border-top:1px solid var(--line);margin:6px 0}

/* configurar */
.cartao{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:16px}
.chave{display:flex;align-items:center;gap:14px;justify-content:space-between}
.chave p{margin:0} .chave small{display:block;color:var(--muted);font-size:.86rem}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:background .15s;pointer-events:none}
.switch span::after{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked+span{background:var(--toga)}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:focus-visible+span{outline:2px solid var(--lacre);outline-offset:2px}
.info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-radius:10px;overflow:hidden}
.info div{background:var(--surface-2);padding:10px}
.info strong{display:block;font-family:var(--f-display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.info small{color:var(--muted);font-size:.78rem}
.botao{border:0;border-radius:10px;padding:15px 18px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.95rem;width:100%}
.botao.cheio{background:var(--toga);color:var(--toga-fg)}
.botao.linha{background:transparent;border:1.5px solid var(--line)}
.botoes{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.lado{display:flex;gap:10px} .lado .botao{flex:1}

/* questão */
.q-cab{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.q-mat{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.q-mat .tile{width:30px;height:30px;border-radius:7px;color:#fff}
.q-mat .tile svg.i{width:18px;height:18px}
.q-mat b{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.q-mat span{font-size:.8rem;color:var(--muted)}
.q-enun{font-size:1.12rem;line-height:1.5;margin:0}
.alts{margin-top:12px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.alt{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:center;padding:15px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;font-size:1.02rem;line-height:1.45}
.alt:first-child{border-top:0}
.alt:hover:not([disabled]){background:var(--surface-2)}
.letra{width:32px;height:32px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-weight:700;font-size:.9rem;color:var(--muted)}
.alt.marcada{background:var(--surface-2)} .alt.marcada .letra{background:var(--toga);border-color:var(--toga-txt);color:#fff}
.alt.certa{background:var(--ok-bg)} .alt.certa .letra{background:var(--ok);border-color:var(--ok);color:#fff}
.alt.errada{background:var(--erro-bg)} .alt.errada .letra{background:var(--erro);border-color:var(--erro);color:#fff}
.alt[disabled]{cursor:default}
.coment{margin-top:12px;border-radius:var(--r);padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--ok)}
.coment.err{border-left-color:var(--erro)}
.coment h3{margin:0 0 6px;font-family:var(--f-display);font-size:1.08rem}
.coment p{margin:0 0 8px}
.fund{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);margin:0}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.92rem}
.nav button[disabled]{opacity:.35;cursor:default}
.nav button.forte{font-weight:700}

/* folha de questões */
.folha-camada{position:fixed;inset:0;z-index:20;background:rgba(16,8,10,.55);display:flex;align-items:flex-end;justify-content:center}
.folha{background:var(--bg);width:100%;max-width:760px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px))}
.folha h2{font-family:var(--f-display);margin:0 0 4px;font-size:1.25rem}
.gq{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;margin:14px 0}
.gq button{aspect-ratio:1;max-width:100%;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.9rem}
.gq button.resp{background:var(--toga);border-color:var(--toga-txt);color:#fff}
.gq button.g-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.gq button.g-er{background:var(--erro);border-color:var(--erro);color:#fff}
.gq button.atual{outline:2px solid var(--lacre);outline-offset:2px}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legenda i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1.5px solid var(--line)}
.confirma{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:10px}
.confirma p{margin:0 0 10px}

/* resultado */
.placar{border-radius:var(--r);padding:22px 20px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;color:#fff}
.placar.aprov{background:var(--ok)} .placar.reprov{background:var(--erro)} .placar.perf{background:var(--toga)}
.placar .pct{font-family:var(--f-display);font-weight:700;font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}
.placar h2{margin:0;font-family:var(--f-display);font-size:1.4rem}
.placar p{margin:4px 0 0;opacity:.92;font-size:.92rem}
.revisao{display:flex;flex-direction:column;gap:10px}
.rev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.rev summary{cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;list-style:none}
.rev summary::-webkit-details-marker{display:none}
.rev .num{font-family:var(--f-mono);font-size:.82rem;padding:2px 8px;border-radius:6px;color:#fff;font-variant-numeric:tabular-nums}
.rev .num.ok{background:var(--ok)} .rev .num.er{background:var(--erro)} .rev .num.br{background:var(--aviso)}
.rev .rq{font-size:.95rem}
.rev .rotulo{font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.rev .rbody{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:.93rem}
.rev .rbody p{margin:0 0 6px}
.c-er{color:color-mix(in srgb,var(--erro) 82%,var(--fg))}
.c-ok{color:var(--ok)}
.desemp{display:flex;flex-direction:column;gap:8px}
.desemp .linha{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.92rem}
.desemp .tile{width:28px;height:28px;border-radius:6px}
.desemp .tile svg.i{width:16px;height:16px}
.sinc{font-size:.78rem;color:var(--muted);text-align:center;margin-top:28px}
.vazio{padding:24px 18px;text-align:center;color:var(--muted)}
/* lei seca */
.ls-texto{font-family:var(--f-display);font-size:1.12rem;line-height:1.6;margin:0}
.ls-lac{display:inline-block;min-width:7em;border-bottom:2px solid var(--lacre);color:transparent;user-select:none}
.ls-marca{background:var(--ok-bg);border-radius:4px;padding:0 3px;font-weight:700}
.ls-ref{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);margin:10px 0 0}
.ls-ce{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.ls-ce .botao{text-transform:none;letter-spacing:0;font-size:1.02rem}
.ls-ce .botao.certa{background:var(--ok);color:#fff;border-color:var(--ok)}
.ls-ce .botao.errada{background:var(--erro);color:#fff;border-color:var(--erro)}
.ls-lista details{border-top:1px solid var(--line);padding:12px 14px}
.ls-lista details:first-child{border-top:0}
.ls-lista summary{cursor:pointer;font-weight:700;display:flex;justify-content:space-between;gap:10px}
.ls-lista summary small{font-weight:400;color:var(--muted);white-space:nowrap}
.ls-lista details p{margin:8px 0 0;line-height:1.55}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media (max-width:380px){.placar{grid-template-columns:1fr}.grade-mat{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ---------- apostilas ---------- */
.f-a{fill:var(--c)}.f-b{fill:var(--lacre)}.f-t{fill:var(--toga)}.f-s{fill:var(--surface-2)}.f-w{fill:var(--surface)}
.s-a{stroke:var(--c)}.s-b{stroke:var(--lacre)}.s-t{stroke:var(--toga)}.s-w{stroke:var(--surface)}.s-l{stroke:var(--line)}
.t-m{fill:var(--muted);font:700 10px var(--f-body);letter-spacing:.08em}
.ilu{width:100%;max-width:260px;height:auto;display:block}
.ap-hero{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:14px;align-items:center;margin:14px 0 6px}
.ap-hero h2{margin:0;font-family:var(--f-display);font-size:1.45rem;line-height:1.2}
.leitura{--fs:1}
.texto{font-size:calc(1.02rem * var(--fs));line-height:1.65}
.texto h3{font-family:var(--f-display);font-size:1.32em;line-height:1.25;margin:34px 0 10px;padding-top:12px;border-top:2px solid var(--line);scroll-margin-top:96px}
.texto h3::before{content:"";display:block;width:42px;height:4px;border-radius:2px;background:var(--c,var(--toga));margin:-14px 0 14px}
.texto h4{font-size:1.04em;margin:22px 0 6px;color:var(--fg)}
.texto h5{font-size:.95em;margin:16px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.texto p{margin:0 0 12px}
.texto ul,.texto ol{margin:0 0 14px;padding-left:22px}
.texto li{margin:0 0 6px}
.texto strong{font-weight:700}
.texto mark{background:color-mix(in srgb,var(--lacre) 30%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.call,.memo{border-radius:10px;padding:12px 14px;margin:14px 0 16px;border-left:5px solid var(--k);background:color-mix(in srgb,var(--k) 11%,var(--surface))}
.call>b,.memo>b{display:flex;align-items:center;gap:6px;font-size:.78em;letter-spacing:.07em;text-transform:uppercase;color:color-mix(in srgb,var(--k) 85%,var(--fg));margin-bottom:4px}
.call>b svg.i,.memo>b svg.i{width:16px;height:16px}
.call p,.memo p{margin:0 0 6px}.call p:last-child,.memo p:last-child{margin:0}
.call.ex{--k:var(--nv2)}.call.at{--k:var(--erro)}.call.di{--k:var(--lacre)}.call.pr{--k:var(--nv7)}.call.le{--k:var(--nv1)}
.memo{--k:var(--nv5);border-left-style:dashed}
.teste{--k:var(--nv3);border:1px solid color-mix(in srgb,var(--k) 45%,var(--line));border-radius:12px;padding:12px 14px;margin:16px 0 18px;background:var(--surface)}
.teste>b{display:flex;align-items:center;gap:6px;font-size:.78em;letter-spacing:.07em;text-transform:uppercase;color:color-mix(in srgb,var(--k) 85%,var(--fg));margin-bottom:6px}
.teste>b svg.i{width:16px;height:16px}
.teste details{border-top:1px solid var(--line);padding:8px 0}
.teste summary{cursor:pointer;font-weight:600;list-style-position:outside;margin-left:18px}
.teste details p{margin:6px 0 0 18px;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--k) 10%,var(--surface))}
.teste .tdica{font-size:.85em;color:var(--muted);margin:0 0 4px}
@media print{.teste details p{display:block}}
.tab{overflow-x:auto;margin:12px 0 16px;border:1px solid var(--line);border-radius:10px}
.tab table{border-collapse:collapse;width:100%;font-size:.9em;min-width:420px}
.tab th{background:var(--surface-2);text-align:left;font-weight:700}
.tab th,.tab td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tab tr:last-child td{border-bottom:0}
.fig{margin:18px 0;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.calc-dica,.calc-rot{margin:0 0 8px;color:var(--muted);font-size:.92em}
.calc-rot{margin:10px 0 6px;color:var(--fg);font-weight:600}
.calc-in{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.calc-in label{display:grid;gap:4px;min-width:0;font-size:.92em;font-weight:600}
.calc-l3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.calc-in input,.calc-in select{width:100%;box-sizing:border-box;min-width:0;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit}
.calc-out{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--surface-2);border-left:5px solid var(--neutro)}
.calc-out.ok{background:var(--ok-bg);border-left-color:var(--ok)}
.calc-out.nao{background:var(--erro-bg);border-left-color:var(--erro)}
.calc-out ul{margin:8px 0 0;padding:0;list-style:none}
.calc-out li{margin:4px 0}
html[data-anim="on"] .calc-out.calc-novo{animation:pv-res-in .4s ease-out both}
.fig>figcaption{display:flex;align-items:center;gap:6px;font-weight:700;font-size:.8em;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.fig>figcaption svg.i{width:16px;height:16px}
.fig.ilus{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:4px 0}
.fig.ilus .leg{font-size:.85em;color:var(--muted);text-align:center;max-width:420px}
.pir{display:flex;flex-direction:column;align-items:center;gap:4px}
.pir div{background:color-mix(in srgb,var(--toga) calc(var(--o)*100%),var(--surface-2));color:var(--toga-fg);border-radius:6px;padding:8px 10px;text-align:center;font-size:.88em;line-height:1.3;min-width:120px}
.tl{list-style:none;padding:0;margin:0;position:relative}
.tl::before{content:"";position:absolute;left:15px;top:8px;bottom:8px;width:3px;background:var(--line);border-radius:2px}
.tl li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;margin:0 0 12px;position:relative}
.tl-n{width:32px;height:32px;border-radius:50%;background:var(--toga);color:var(--toga-fg);display:grid;place-items:center;font-weight:700;font-size:.9em;z-index:1}
.tl p{margin:2px 0 0;font-size:.92em;color:var(--muted)}
.fx{display:flex;flex-direction:column;align-items:stretch;gap:2px;max-width:520px;margin:0 auto}
.fx-c{border:2px solid var(--c);border-radius:10px;padding:9px 12px;text-align:center;font-size:.92em;background:color-mix(in srgb,var(--c) 9%,var(--surface))}
.fx-s{display:grid;place-items:center;color:var(--muted);height:20px}.fx-s svg.i{transform:rotate(90deg);width:18px;height:18px}
.cp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cp>div{border-top:5px solid var(--c);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.cp b{display:block;margin-bottom:4px}.cp ul{margin:0;padding-left:18px;font-size:.92em}
.mapa{margin:26px 0 10px;padding:16px;border-radius:14px;border:2px solid var(--toga-borda);background:var(--surface)}
.mapa>figcaption{display:flex;align-items:center;gap:6px;font-weight:700;font-size:.8em;letter-spacing:.08em;text-transform:uppercase;color:var(--toga-txt);margin-bottom:14px}
:root[data-theme="dark"] .mapa>figcaption{color:var(--nv1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mapa>figcaption{color:var(--nv1)}}

.motiva .festa-card{padding-top:16px}
.motiva .mv{width:180px;height:135px;margin:0 auto 4px}
.motiva .mv-info{margin:10px 0 0;font-size:.85rem;color:var(--muted)}
.motiva .botoes{margin-top:14px}
.motiva-banner{position:relative;display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;margin:4px 0 14px;padding:12px 14px 12px 8px;border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,#ff8a1f 16%,var(--surface)),color-mix(in srgb,var(--toga-txt) 12%,var(--surface)));border:1px solid color-mix(in srgb,#ff8a1f 30%,var(--line));overflow:hidden}
.motiva-banner .mv{width:96px;height:72px}
.motiva-banner b{display:block;font-family:var(--f-display);font-size:1.05rem;line-height:1.25;margin-bottom:2px}
.motiva-banner p{margin:0;font-size:.9rem;line-height:1.4}
.motiva-banner small{display:block;margin-top:6px;color:var(--muted);font-size:.78rem}
.motiva-banner.segue{background:linear-gradient(135deg,color-mix(in srgb,#3bb273 14%,var(--surface)),color-mix(in srgb,var(--toga-txt) 12%,var(--surface)));border-color:color-mix(in srgb,#3bb273 30%,var(--line))}
[data-estilo="premium"] .motiva-banner{border-radius:24px;border:0;background:linear-gradient(135deg,color-mix(in srgb,#ff8a1f 18%,var(--surface)),color-mix(in srgb,var(--p1) 16%,var(--surface)))}
[data-estilo="premium"] .motiva-banner.segue{background:linear-gradient(135deg,color-mix(in srgb,var(--p2) 16%,var(--surface)),color-mix(in srgb,var(--p1) 16%,var(--surface)))}
/* reacender a chama */
.mv-cinza{fill:var(--line);animation:mv-some .5s 1.3s both}
.mv-fogo{animation:mv-acende 1s 1.1s both}
.mv-fogo .mv-d{animation:cv-danca 1.6s 2.2s ease-in-out infinite}
.mv-fisco{fill:#ffc53d;animation:mv-sobe 1.8s ease-out infinite;transform-origin:50% 50%}
.mv-fisco:nth-of-type(2){animation-delay:.6s}.mv-fisco:nth-of-type(3){animation-delay:1.2s}
/* nascer do sol */
.mv-sol{animation:mv-nasce 1.6s cubic-bezier(.2,.9,.3,1) both}
.mv-raios{transform-origin:50% 50%;animation:mv-gira 12s linear infinite}
.mv-nuvem{animation:mv-vaga 6s ease-in-out infinite alternate}
/* foguete */
.mv-foguete{animation:mv-decola 3s ease-in-out infinite}
.mv-fumaca{transform-origin:50% 50%;animation:mv-fuma 1.2s ease-out infinite}
.mv-fumaca:nth-of-type(2){animation-delay:.4s}.mv-fumaca:nth-of-type(3){animation-delay:.8s}
/* broto */
.mv-caule{stroke-dasharray:80;animation:mv-desenha 1.1s .3s ease-out both}
.mv-folha{animation:mv-abre .6s 1.2s cubic-bezier(.2,1.5,.4,1) both}
.mv-folha.f2{animation-delay:1.5s}.mv-flor{transform-origin:50% 50%;animation:mv-abre .7s 1.9s cubic-bezier(.2,1.5,.4,1) both}
/* escada */
.mv-degrau{animation:cresce .45s ease-out both}
.mv-degrau:nth-of-type(2){animation-delay:.15s}.mv-degrau:nth-of-type(3){animation-delay:.3s}.mv-degrau:nth-of-type(4){animation-delay:.45s}
.mv-estrela{transform-origin:50% 50%;animation:mv-pula 2.6s .6s ease-in-out infinite}
.mv-bandeira{transform-origin:0 100%;animation:mv-tremula 1.2s ease-in-out infinite alternate}
.mv-brilhos{transform-origin:50% 50%;animation:mv-gira 14s linear infinite,mv-pisca 1.6s ease-in-out infinite alternate}
.mv-trofeu{animation:ent-pop .7s cubic-bezier(.2,1.5,.4,1) both}
.mv-cint{transform-origin:50% 50%;animation:pisca 1.4s ease-in-out infinite}.mv-cint.c2{animation-delay:.7s}
.mv-pagina{transform-origin:0 50%;animation:mv-folheia 2.4s ease-in-out infinite}
.mv-letras text{animation:mv-sobe-l 2.4s ease-out infinite}.mv-letras text:nth-child(2){animation-delay:.8s}.mv-letras text:nth-child(3){animation-delay:1.6s}
@keyframes mv-pisca{from{opacity:.45}to{opacity:1}}
@keyframes mv-folheia{0%,15%{transform:none}55%,100%{transform:scaleX(-1)}}
@keyframes mv-sobe-l{0%{transform:translateY(16px);opacity:0}30%{opacity:1}100%{transform:translateY(-8px);opacity:0}}
.motiva-banner.meta{background:linear-gradient(135deg,color-mix(in srgb,#ffc53d 22%,var(--surface)),color-mix(in srgb,#3bb273 14%,var(--surface)));border-color:color-mix(in srgb,#ffc53d 40%,var(--line))}
.mt-selo{display:inline-block;padding:3px 12px;border-radius:99px;background:color-mix(in srgb,#ffc53d 30%,var(--surface));color:var(--fg);font-size:.78rem;font-weight:700;letter-spacing:.02em}
.mt-alvo{transform-origin:50% 50%;animation:mt-treme .5s .55s ease-out both}
.mt-flecha{animation:mt-voa .55s cubic-bezier(.3,.8,.4,1) both}
.mt-onda{transform-origin:50% 50%;animation:mt-onda 1.2s .55s ease-out both}
.mt-medalha{transform-origin:50% 0;animation:mt-cai .8s cubic-bezier(.2,1.4,.4,1) both,mt-balanca 2.4s .8s ease-in-out infinite}
.mt-reflexo{animation:mt-brilha 2s 1s ease-in-out infinite}
.mv .mt-fogo{transform-box:view-box;transform-origin:0 0}
.mt-fogo>g{transform-origin:0 0;transform-box:view-box;animation:mt-explode 1.75s ease-out infinite;animation-delay:inherit}
.mt-circ{stroke-dasharray:277;animation:mt-traca .8s ease-out both}
.mt-check{stroke-dasharray:70;animation:mt-traca2 .45s .7s ease-out both}
.mt-escalador{animation:mt-sobe 1.4s cubic-bezier(.3,.9,.4,1) both}
@keyframes mt-voa{from{transform:translate(70px,-36px);opacity:0}to{transform:none;opacity:1}}
@keyframes mt-treme{0%{transform:none}30%{transform:rotate(-4deg) scale(1.04)}60%{transform:rotate(3deg)}100%{transform:none}}
@keyframes mt-onda{from{transform:scale(.6);opacity:1}to{transform:scale(1.25);opacity:0}}
@keyframes mt-cai{from{transform:translateY(-70px)}to{transform:none}}
@keyframes mt-balanca{0%,100%{transform:rotate(0)}25%{transform:rotate(5deg)}75%{transform:rotate(-5deg)}}
@keyframes mt-brilha{0%,70%,100%{opacity:0}80%{opacity:.9}}
@keyframes mt-explode{0%{transform:scale(.2);opacity:0}15%{opacity:1}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1.3);opacity:0}}
@keyframes mt-traca{from{stroke-dashoffset:277}to{stroke-dashoffset:0}}
@keyframes mt-traca2{from{stroke-dashoffset:70}to{stroke-dashoffset:0}}
@keyframes mt-sobe{from{transform:translate(-44px,70px)}to{transform:none}}

/* ---------- busca: sugestão e animações ---------- */
.quis-dizer{display:flex;gap:10px;align-items:flex-start;margin:6px 0 10px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,#ffc53d 18%,var(--surface));border:1px solid color-mix(in srgb,#ffc53d 45%,var(--line));font-size:.95rem}
.quis-dizer svg{flex:none;width:22px;height:22px;color:#d99a12;margin-top:1px}
.quis-dizer .link-inline{font-size:inherit}
[data-estilo="premium"] .quis-dizer{border-radius:18px}
html[data-anim="on"] .anim-q svg{animation:q-acende 1.4s ease-in-out 2}
html[data-anim="on"] .b-ent{animation:ent-sobe .42s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i,0)*45ms)}
html[data-anim="on"] mark.b-mark{background-size:0 100%;animation:b-marca .5s ease-out both;animation-delay:calc(220ms + var(--i,0)*40ms);background-image:linear-gradient(var(--mark-bg,#ffe066),var(--mark-bg,#ffe066));background-repeat:no-repeat;background-color:transparent}
html[data-anim="on"] .busca-vazia .ilu{animation:b-procura 2.4s ease-in-out infinite}
html[data-anim="on"] .busca .ic,html[data-anim="on"] .busca>svg{transition:transform .3s}
html[data-anim="on"] .busca:focus-within>svg{transform:rotate(-12deg) scale(1.15)}
@keyframes q-acende{0%,100%{transform:none;filter:none}50%{transform:scale(1.2) rotate(-8deg);filter:drop-shadow(0 0 6px #ffc53d)}}
@keyframes b-marca{to{background-size:100% 100%}}
@keyframes b-procura{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-8px) rotate(-4deg)}75%{transform:translateX(8px) rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.b-ent,mark.b-mark,.busca-vazia .ilu,.anim-q svg{animation:none!important;background-size:100% 100%!important}}

/* ---------- modo avançado: provas da faculdade ---------- */
.pv-lista{display:grid;gap:12px}
@media (min-width:760px){.pv-lista{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}}
.pv{position:relative;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:16px;padding:14px;overflow:hidden}
.pv::after{content:"";position:absolute;inset:auto -30px -40px auto;width:120px;height:120px;border-radius:50%;background:color-mix(in srgb,var(--c) 10%,transparent);pointer-events:none}
.pv>*{position:relative;z-index:1}
.pv-topo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.pv-topo b{display:block;line-height:1.25}
.pv-quando{display:block;color:var(--muted);font-size:.85rem;margin-top:2px}
.pv-anel{position:relative;width:58px;height:58px}.pv-anel .anel{width:58px;height:58px}.pv-anel .anel-v{stroke:var(--c)}
.pv-anel span{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}.pv-anel b{font-size:.9rem}.pv-anel small{font-size:.58rem;color:var(--muted)}
.pv-contagem{display:flex;align-items:flex-end;gap:4px;margin:10px 0 2px}
.pv-contagem span{display:grid;place-items:center;width:30px;height:38px;border-radius:8px;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--fg);font:700 1.35rem/1 var(--f-display);box-shadow:inset 0 -3px 0 color-mix(in srgb,var(--c) 30%,transparent)}
.pv-contagem em{font-style:normal;color:var(--muted);font-size:.85rem;margin:0 0 4px 4px}
html[data-anim="on"] .pv-contagem span{animation:cal-cai .5s cubic-bezier(.2,1.2,.4,1) both;animation-delay:calc(.15s + var(--i)*.12s);transform-origin:50% 0}
.pv-etapa{margin:8px 0 0;font-size:.9rem;line-height:1.45}
.pv-chip{display:inline-block;margin-right:6px;padding:1px 9px;border-radius:99px;font-size:.75rem;font-weight:700;background:var(--surface-2);color:var(--fg)}
.pv-chip.base{background:color-mix(in srgb,#3bb273 20%,var(--surface))}.pv-chip.treino{background:color-mix(in srgb,#2e86ab 20%,var(--surface))}
.pv-chip.reta{background:color-mix(in srgb,#ff8a1f 25%,var(--surface))}.pv-chip.hoje{background:#e5484d;color:#fff}
.pv-urg{border-color:color-mix(in srgb,#ff8a1f 50%,var(--line))}
html[data-anim="on"] .pv-urg .pv-chip{animation:pv-pulsa 1.6s ease-in-out infinite}
.pv-passou{opacity:.7}
.pv-barras{display:grid;gap:8px;margin-top:12px}
.pv-barras>div{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:.85rem}.pv-barras span{color:var(--muted)}
.pv-bar{grid-column:1/-1;display:block;height:8px;border-radius:99px;background:var(--trilho);overflow:hidden}
.pv-bar>i{display:block;height:100%;border-radius:inherit;background:var(--c)}.pv-bar.ok>i{background:var(--ok)}.pv-bar.lei>i{background:var(--toga-txt)}
html[data-anim="on"] .pv-bar>i{animation:pv-enche .9s cubic-bezier(.2,.8,.3,1) both .25s;transform-origin:0 50%}
.pv-datas{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.pv-datas li{padding:4px 10px;border-radius:10px;background:var(--surface-2);font-size:.8rem}.pv-datas li.passou{opacity:.55;text-decoration:line-through}.pv-datas li.hoje{background:#e5484d;color:#fff}
.pv-datas small{color:inherit;opacity:.75}
.pv-acoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pv-acoes .botao{flex:1 1 auto;margin:0;min-height:42px;font-size:.88rem}
.pv-ir{background:var(--c)!important;border-color:var(--c)!important;color:#fff!important}
.pv-vazio{width:100%;text-align:left}
.pv-config{display:grid;gap:10px;margin-top:12px}
.pv-cfg{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);transition:opacity .28s,transform .28s}
.pv-cfg.pv-sai{opacity:0;transform:translateX(30px) scale(.96)}
html[data-anim="on"] .pv-cfg.pv-nova{animation:ent-pop .55s cubic-bezier(.2,1.4,.4,1) both}
.pv-chips{list-style:none;margin:6px 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.pv-chips li{display:flex;align-items:center;gap:2px;padding:2px 2px 2px 6px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,var(--surface));font-size:.82rem}
.icone.mini{width:26px;height:26px;min-width:26px;padding:0}.icone.mini svg{width:14px;height:14px}
.pv-cfg-in{min-width:0}
.pv-add-data{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:6px;align-items:center}
.pv-add-data input,.pv-add-data select,.pv-form input,.pv-form select{width:100%;box-sizing:border-box}
.pv-add-data .botao{grid-column:1/-1;width:100%}
.pv-form-l input,.pv-form-l select,.pv-form .campo select{width:100%;min-width:0}
.pv-add-data input,.pv-add-data select,.pv-form select,.campo select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;min-width:0}
.pv-add-data .botao{margin:0;padding:8px 12px;min-height:0}
.pv-form{display:grid;gap:10px;padding:14px;border-radius:14px;border:1px dashed var(--line);background:var(--surface-2)}
.pv-form-l{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pv-form .botao{margin:0}
.pv-erro{margin:0;color:var(--erro);min-height:0}
.pv-como{margin-top:4px;padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.pv-como summary{cursor:pointer;font-weight:700}.pv-como ul{margin:8px 0 0;padding-left:18px;font-size:.9rem;line-height:1.5}
.pv-ok{flex:none;width:16px;height:16px;margin-right:4px;fill:#2fa36b;stroke:none}.pv-ok path{fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
html[data-anim="on"] .pv-ok{animation:ent-pop .5s cubic-bezier(.2,1.6,.4,1) both .1s}
html[data-anim="on"] .pv-ok path{stroke-dasharray:14;stroke-dashoffset:14;animation:pv-risca .45s ease-out forwards .4s}
html[data-anim="on"] .pv-chip-novo{animation:pv-res-in .4s ease-out both}
html[data-anim="on"] .pv-chip-novo .pv-ok{animation:ent-pop .6s cubic-bezier(.2,1.6,.4,1) both .2s,pv-brilho 1.2s ease-out .8s}
@keyframes pv-risca{to{stroke-dashoffset:0}}
@keyframes pv-brilho{0%{filter:drop-shadow(0 0 0 #2fa36b)}40%{filter:drop-shadow(0 0 6px #2fa36b)}100%{filter:drop-shadow(0 0 0 transparent)}}
.pv-mais{margin-top:2px}.pv-mais summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;border:1px dashed var(--line);font-size:.85rem;font-weight:600;color:var(--muted)}
.pv-mais summary::-webkit-details-marker{display:none}.pv-mais summary .i{width:15px;height:15px}
.pv-mais[open] summary{color:var(--fg);border-style:solid;margin-bottom:8px}.pv-mais[open] summary .i{transform:rotate(45deg);transition:transform .2s}
html[data-anim="on"] .pv-mais[open] .pv-add-data{animation:pv-res-in .3s ease-out both}
/* o que cai na N1 e na N2 */
.dv{margin:4px 0 8px;border-radius:14px;background:color-mix(in srgb,var(--c) 7%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 28%,var(--line))}
.dv summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 12px;min-height:44px;box-sizing:border-box}
.dv summary::-webkit-details-marker{display:none}.dv summary>.i{width:18px;height:18px;flex:none;color:var(--c)}
.dv summary b{display:block;font-size:.92rem}.dv-res{display:block;color:var(--muted);font-size:.8rem;line-height:1.3}
.dv summary::after{content:"";margin-left:auto;flex:none;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
.dv[open] summary::after{transform:rotate(-135deg)}
.dv-in{display:grid;gap:12px;padding:2px 12px 12px}
.dv-dica{margin:0;font-size:.86rem;line-height:1.45}
.dv{grid-column:1/-1}
.dv-barra{position:relative;height:34px;margin:0 4px}
.dv-segs{position:absolute;inset:6px 0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:3px}
.dv-segs i{border-radius:6px;background:color-mix(in srgb,var(--c) 18%,var(--surface));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 45%,transparent);transition:background .2s}
.dv-segs i.n1{background:var(--c);box-shadow:none}
.n2tudo .dv-segs i{background-image:repeating-linear-gradient(-45deg,transparent 0 4px,color-mix(in srgb,var(--c) 30%,transparent) 4px 7px)}
.dv-alca{position:absolute;top:50%;left:calc(var(--k)/var(--n)*100%);width:30px;height:30px;margin:-15px 0 0 -15px;display:grid;place-items:center;border-radius:50%;background:var(--surface);color:var(--c);border:3px solid var(--c);box-shadow:0 4px 12px -4px rgba(0,0,0,.35);pointer-events:none;transition:left .2s cubic-bezier(.3,1.3,.5,1)}
.dv-alca .i{width:14px;height:14px}
.dv-range{position:absolute;inset:0 auto 0 -15px;width:calc(100% + 30px);height:100%;margin:0;opacity:0;cursor:grab;z-index:2;touch-action:none}
.dv-range::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:34px}.dv-range::-moz-range-thumb{width:30px;height:34px;border:0}
.dv-range:focus-visible~.dv-alca{outline:3px solid var(--fg);outline-offset:2px}
.dv-rot{position:relative;height:18px;margin:-6px 4px 0;font:800 .72rem/18px var(--f-ui,inherit)}
.dv-rot b{position:absolute;top:0;white-space:nowrap}.dv-rot .n1{right:calc(100% - var(--k)/var(--n)*100% + 20px);color:var(--c)}.dv-rot .n2{left:calc(var(--k)/var(--n)*100% + 20px);color:var(--muted)}
.dv-lista{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.dv-tema{width:100%;display:flex;align-items:center;gap:10px;min-height:44px;margin:0;padding:6px 10px;border-radius:12px;border:1.5px solid color-mix(in srgb,var(--c) 30%,var(--line));background:var(--surface);color:var(--fg);font:inherit;text-align:left;cursor:pointer;transition:background .2s,border-color .2s,transform .15s}
.dv-tema:active{transform:scale(.98)}
.dv-tema.n1{background:color-mix(in srgb,var(--c) 12%,var(--surface));border-color:transparent}
.dv-num{flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;border:2px solid var(--c);color:var(--c);font:800 .75rem/1 var(--f-ui,inherit);background:var(--surface)}
.dv-tema.n1 .dv-num{background:var(--c);color:#fff}
.dv-tit{flex:1;min-width:0;font-size:.86rem;line-height:1.3}
.dv-qual{flex:none;font:800 .66rem/1 var(--f-ui,inherit);padding:4px 7px;border-radius:99px;color:var(--c);box-shadow:inset 0 0 0 1.5px var(--c)}
.dv-qual::before{content:"N2"}.dv-tema.n1 .dv-qual{background:var(--c);color:#fff;box-shadow:none}.dv-tema.n1 .dv-qual::before{content:"N1"}
.n2tudo .dv-tema .dv-qual::before{content:"N2"}.n2tudo .dv-tema.n1 .dv-qual::before{content:"N1 · N2"}
.dv-corte{display:flex;align-items:center;gap:8px;margin:4px 0;color:var(--c);font-size:.78rem;font-weight:700}
.dv-corte::before,.dv-corte::after{content:"";flex:1;border-top:2px dashed var(--c)}
.dv-corte span{display:inline-flex;align-items:center;gap:5px;text-align:center}.dv-corte .i{width:14px;height:14px}
.dv-lados{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.dv-lado{display:grid;gap:3px;align-content:start;padding:10px 12px;border-radius:12px;min-width:0}
.dv-lado.n1{background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.dv-lado.n2{background:var(--surface);border:2px solid color-mix(in srgb,var(--c) 55%,transparent)}
.dv-lado.tudo{background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--c) 10%,var(--surface)) 0 8px,var(--surface) 8px 16px)}
.dv-lado b{font-size:.9rem}.dv-lado small{color:var(--muted);font-size:.78rem;line-height:1.35;overflow-wrap:anywhere}

.ass-l{display:flex;flex-direction:column;gap:2px;min-width:0}
.ass-l .trilho{margin:4px 0 2px}
.tag-fraco{display:inline-block;margin-right:6px;padding:2px 8px;border-radius:999px;background:var(--erro-bg);color:color-mix(in srgb,var(--erro) 82%,var(--fg));font-weight:700;font-size:.74rem;vertical-align:middle}
.porque{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.porque-t{font-weight:700;font-size:.92rem;margin:0 0 6px!important}
.porque p{font-size:.93rem;margin:0 0 6px}
.porque p.sua{background:var(--erro-bg);border-radius:8px;padding:6px 8px}
.rbody .px{display:block;font-size:.88rem;color:var(--muted);margin:2px 0 4px 20px}
.link-rep{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:6px 0;border:0;background:none;color:var(--muted);font-size:.86rem;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.link-rep svg.i{width:16px;height:16px}
.link-tema+.link-rep{margin-left:12px}
.opcoes.col{flex-direction:column}
.opcoes.col button{text-align:left;font-weight:600}
.campo textarea{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;resize:vertical}
.rep-enun{font-size:.92rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0 12px;max-height:160px;overflow:auto}
.rep-q{display:block;font-size:.86rem;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rep-t{display:block;font-size:.86rem;color:var(--muted);margin-top:4px;font-style:italic}
.item.plano.feito .item-tit{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ok) 70%,transparent)}
.link-inline{background:none;border:0;padding:0;color:var(--toga-txt);font-weight:700;text-decoration:underline;font-size:inherit}
:root[data-theme="dark"] .link-inline{color:var(--nv1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .link-inline{color:var(--nv1)}}
@media print{
 html,body{height:auto!important;min-height:0!important}
 .app,.festa{display:none!important}
 #impressao{display:block}
 .topo,.ap-fim,.sumario,.fab,.progresso-leitura,.camada{display:none!important}
 body{background:#fff;color:#000}
 .texto{font-size:11pt}
 .fig,.mapa,.call,.memo,.tab{break-inside:avoid}
}
/* ---------- componentes novos (valem nos dois estilos) ---------- */
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.pular{position:absolute;left:12px;top:-80px;z-index:40;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;text-decoration:none}
.pular:focus{top:calc(8px + env(safe-area-inset-top,0px))}
.texto{font-family:var(--f-read)}
.botao,.card,.item,.alt,.cores button,.opcoes button,.estilos button,.nav-q button,.indice-temas button,.navtema button{transition:background-color .15s,border-color .15s,color .15s,transform .1s}
.botao:active:not([disabled]),.card:active,.item:active:not([disabled]),.alt:active:not([disabled]){transform:scale(.985)}
.botao[disabled]{opacity:.5;cursor:default}
.botao.cheio:hover:not([disabled]){filter:brightness(1.08)}
.botao.linha:hover:not([disabled]){background:var(--surface-2)}
/* estado vazio */
.vazio-ilu{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:28px 12px 20px}
.vazio-ilu .ilu{max-width:190px}
.v-tit{font-family:var(--f-display);font-weight:600;font-size:1.25rem;line-height:1.25;margin:6px 0 0;text-wrap:balance}
.v-txt{color:var(--muted);max-width:46ch;margin:0;text-wrap:pretty}
.vazio-acoes{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.vazio-acoes .botao{width:auto;padding-inline:22px}
.carregando{padding:18px 0}
.esq{display:block;height:14px;border-radius:7px;background:var(--surface-2);margin:14px 0;animation:pulsa 1.1s ease-in-out infinite alternate}
.esq.l1{width:58%;height:26px}.esq.l2{width:94%}.esq.l3{width:78%}
@keyframes pulsa{to{opacity:.45}}
/* estilo visual nas configurações */
.estilos{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.estilos button{display:flex;gap:12px;align-items:center;text-align:left;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:inherit}
.estilos button[aria-pressed="true"]{border:2px solid var(--toga-txt);padding:11px}
.estilos b{font-size:1rem}
.estilos em{font-style:normal;font-size:.72rem;font-weight:600;background:var(--surface-2);border-radius:999px;padding:2px 8px;margin-left:4px;color:var(--muted)}
.estilos small{display:block;color:var(--muted);font-size:.84rem;margin-top:2px}
.prev{width:66px;height:50px;flex:none;border-radius:9px;overflow:hidden;position:relative;border:1px solid var(--line)}
.prev i{position:absolute;display:block;border-radius:2px}
.prev i:nth-child(1){left:0;right:0;top:0;height:13px;border-radius:0}
.prev i:nth-child(2){left:7px;top:19px;width:34px;height:6px}
.prev i:nth-child(3){left:7px;top:29px;width:48px;height:4px;opacity:.35}
.prev i:nth-child(4){left:7px;bottom:6px;width:26px;height:8px;border-radius:4px}
.prev-premium{background:#f6f4fb}
.prev-premium i:nth-child(1){left:5px;right:5px;top:5px;height:18px;border-radius:6px;background:linear-gradient(135deg,var(--g1,#7c3aed),var(--g2,#db2777))}
.prev-premium i:nth-child(2),.prev-premium i:nth-child(3){background:#16141f}
.prev-premium i:nth-child(4){background:linear-gradient(135deg,var(--g1,#7c3aed),var(--g2,#db2777))}
.prev-classico{background:#eef1f6}
.prev-classico i:nth-child(1){background:var(--toga)}
.prev-classico i:nth-child(2),.prev-classico i:nth-child(3){background:#172033}
.prev-classico i:nth-child(4){background:#c9821c}
/* gaveta */
.gaveta-topo .marca{display:inline-grid;place-items:center}
.nav-grupo{margin:12px 0 2px;padding:0 20px 0 max(20px,env(safe-area-inset-left,0px));font-size:.78rem;font-weight:700;color:var(--muted)}
.badge{display:inline-block;min-width:20px;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--lacre);color:var(--lacre-fg);font-size:.75rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
/* Hoje */
.hoje-hero{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:12px;align-items:center;margin:4px 0 2px}
.hh-fase{margin:0;color:var(--muted);font-size:.86rem;font-weight:600}
.hoje-hero h2{margin:4px 0 6px;font-family:var(--f-display);font-size:clamp(1.55rem,5.6vw,2.1rem);line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
.hh-linha{margin:0;max-width:40ch;text-wrap:pretty}
.hoje-hero .ilu{max-width:150px;justify-self:end}
.hoje-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:16px 0 4px}
.hs{background:var(--surface);padding:14px;display:flex;align-items:center;gap:12px;min-width:0;align-content:center}
.hs>div{min-width:0;flex:1}
.hs-seq{flex-wrap:wrap}.hs-seq>div{flex:1 1 auto}
.hs b{display:block;font-family:var(--f-display);font-weight:600;font-size:1.65rem;line-height:1.05;font-variant-numeric:tabular-nums}
.hs b small{font-size:.9rem;color:var(--muted);font-family:var(--f-body);font-weight:500}
.hs span{font-size:.8rem;color:var(--muted);line-height:1.25;display:block}
.anel{width:50px;height:50px;flex:none}
.anel-t{fill:none;stroke:var(--trilho);stroke-width:11}
.anel-v{fill:none;stroke:var(--toga-txt);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .5s}
.anel-v.cheio{stroke:var(--ok)}
.hs-chama,.hs-ic{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--lacre) 15%,transparent);color:var(--lacre)}
.hs-ic{background:color-mix(in srgb,var(--toga-txt) 12%,transparent);color:var(--toga-txt)}
.semana{list-style:none;margin:2px 0 0;padding:0;display:flex;gap:4px;width:100%}
.semana li{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.semana i{width:20px;height:20px;border-radius:50%;background:var(--trilho);display:grid;place-items:center;color:#fff}
.semana .on i{background:var(--lacre)}
.semana i svg.i{width:12px;height:12px;stroke-width:3.2}
.semana .hoje i{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--toga-txt)}
.semana span[aria-hidden]{font-size:.66rem;color:var(--muted);font-weight:600}
@media (max-width:640px){.hoje-stats{grid-template-columns:1fr 1fr}.hs-seq{grid-column:1/-1;order:3}.hs-seq .semana{flex:1 1 200px;width:auto}}
@media (max-width:420px){.hoje-hero{grid-template-columns:minmax(0,1fr) 108px}}
.secao-linha{display:flex;flex-wrap:wrap;align-items:baseline;row-gap:4px;justify-content:space-between;gap:12px;margin:28px 0 12px}
.secao-linha .secao{flex:1 1 auto;margin:0}
.contador{font-size:.82rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.plano-lista+.dica{margin-top:12px}
/* plano de hoje com prioridade às provas */
.pp-intro{margin-bottom:12px}
.pp-etapa{display:flex;gap:12px;align-items:flex-start;margin:6px 0 10px}
.pp-etapa b{display:block;font-family:var(--f-display);font-size:1.02rem}
.pp-etapa small{display:block;color:var(--muted);font-size:.86rem;line-height:1.45;margin-top:2px}
.plano-lista+.pp-etapa{margin-top:22px}
.pp-num{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--toga);color:var(--toga-fg,#fff);font-weight:800;font-size:.85rem}
.pp-agenda{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(68px,1fr);gap:8px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x proximity;scrollbar-width:thin}
.pp-dia{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--fg);scroll-snap-align:start;min-height:104px;transition:border-color .15s,transform .15s}
.pp-dia[aria-pressed="true"]{border-color:var(--toga-borda);box-shadow:0 0 0 2px color-mix(in srgb,var(--toga-borda) 35%,transparent)}
.pp-dsem{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.pp-dia.hoje .pp-dsem{color:var(--toga-txt)}
.pp-dnum{font-family:var(--f-display);font-weight:800;font-size:1.25rem;line-height:1}
.pp-bolas{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;margin-top:4px}
.pp-bola{min-width:24px;height:22px;padding:0 5px;border-radius:99px;background:var(--c);color:#fff;font-style:normal;font-size:.6rem;font-weight:800;display:grid;place-items:center;letter-spacing:-.02em}
.pp-bola.leve{height:17px;min-width:18px;font-size:.52rem;opacity:.55}
.pp-folga{font-style:normal;font-size:.7rem;color:var(--muted)}
.pp-flag{display:inline-flex;align-items:center;gap:3px;margin-top:3px;padding:1px 6px;border-radius:99px;background:#e5484d;color:#fff;font-size:.6rem;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.pp-flag svg.i{width:11px;height:11px}
.pp-det{margin:2px 0 4px;font-size:.88rem;color:var(--fg);min-height:1.4em}
.pp-grupo{margin-bottom:12px}
.pp-cab{display:flex;align-items:center;gap:12px;padding:12px 16px;background:color-mix(in srgb,var(--c) 10%,var(--surface));border-left:4px solid var(--c)}
.pp-cab b{display:block;font-family:var(--f-display);font-size:1.05rem}
.pp-cab small{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}
.pp-prep{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.pp-leve{margin-bottom:12px}
html[data-anim="on"] .pp-dia{animation:pp-sobe .45s cubic-bezier(.3,1.3,.5,1) backwards;animation-delay:calc(var(--i)*55ms)}
html[data-anim="on"] .pp-dia:active{transform:scale(.95)}
html[data-anim="on"] .pp-dia[aria-pressed="true"] .pp-bola{animation:pp-pula .5s cubic-bezier(.3,1.6,.5,1)}
html[data-anim="on"] .pp-dia.tem-prova .pp-flag{animation:pv-pulsa 1.6s ease-in-out infinite}
@keyframes pp-sobe{from{opacity:0;transform:translateY(10px)}}
@keyframes pp-pula{40%{transform:translateY(-5px) scale(1.12)}}
.atalhos .card small{line-height:1.35}
/* busca */
.tile-mini{width:26px;height:26px;border-radius:7px;display:inline-grid;place-items:center;background:var(--c);color:#fff;flex:none;margin-top:2px}
.tile-mini svg.i{width:15px;height:15px}
.gab{display:inline-flex;align-items:center;gap:3px;margin-left:6px;font-size:.78rem;color:var(--ok);font-weight:700;white-space:nowrap}
.gab svg.i{width:14px;height:14px;stroke-width:3}
.ver-mais{display:inline-flex;align-items:center;gap:6px;margin:10px 0 0;background:none;border:0;color:var(--toga-txt);font-weight:700;padding:8px 0}
.ver-mais svg.i{width:16px;height:16px}
.mais-cores svg.i{transform:rotate(90deg);transition:transform .2s}.mais-cores[aria-expanded="true"] svg.i{transform:rotate(-90deg)}
.acoes-linha{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.secao .n{font-family:var(--f-body);font-weight:600;font-size:.8rem;letter-spacing:0;color:var(--muted);margin-left:2px}
.fav-ic svg.i{width:16px;height:16px;fill:var(--lacre);stroke:var(--lacre);vertical-align:-2px;margin-right:6px}
.res-q .rbody p{margin:0 0 6px}
/* leitura */
.neste{margin:4px 0 20px;padding:14px 16px;border-radius:14px;background:var(--surface-2)}
.neste-t{display:flex;align-items:center;gap:6px;margin:0 0 6px;font-weight:700;font-size:.85rem;color:var(--muted)}
.neste-t svg.i{width:16px;height:16px}
.neste ol{margin:0;padding-left:22px;font-size:.95rem;line-height:1.45}
.neste li{margin:3px 0}
.neste-x{margin:8px 0 0;font-size:.85rem;color:var(--muted)}
.trilha{list-style:none;display:flex;gap:4px;margin:10px 0 0;padding:0}
.trilha li{flex:1;min-width:0}
.trilha button{display:block;width:100%;height:24px;border:0;padding:0;background:none;position:relative}
.trilha button::before{content:"";position:absolute;left:0;right:0;top:9px;height:6px;border-radius:3px;background:var(--trilho);transition:background-color .2s}
.trilha .lido button::before{background:color-mix(in srgb,var(--ok) 65%,var(--trilho))}
.trilha .atual button::before{background:var(--toga-txt)}
.trilha button:hover::before{filter:brightness(.92)}
.ap-prog{display:flex;align-items:center;gap:8px;margin-top:8px}
.ap-prog .trilho{flex:1;margin:0}
.ap-prog small{color:var(--muted);font-size:.8rem;white-space:nowrap}
.texto{max-width:72ch}
.texto p,.texto li{text-wrap:pretty}
.texto h3,.texto h4,.tema-ban h3,.ap-hero h2{text-wrap:balance}
/* cartões */
.flash>.ilu{position:absolute;right:10px;top:10px;width:76px;max-width:76px;pointer-events:none}
.flash-cab{padding-right:80px;min-height:44px}
.nota-q{margin:16px 2px 8px;font-weight:700}

/* ilustrações: papel claro e traço visível também no modo escuro */
:root{--papel:#ffffff;--ilu-traco:var(--toga);--ilu-cheio:var(--toga);--cal-tinta:var(--fg);--cal-sub:var(--muted)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--papel:#e9edf4;--ilu-traco:var(--toga-txt);--ilu-cheio:var(--toga-txt);--cal-tinta:#161b26;--cal-sub:#566072}}
:root[data-theme="dark"]{--papel:#e9edf4;--ilu-traco:var(--toga-txt);--ilu-cheio:var(--toga-txt);--cal-tinta:#161b26;--cal-sub:#566072}
.ilu .f-w{fill:var(--papel)}.ilu .s-t{stroke:var(--ilu-traco)}.ilu .f-t{fill:var(--ilu-cheio)}
.ilu .f-alv1{fill:#e5484d}.ilu .f-alv2{fill:#ffc53d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tile{background:color-mix(in srgb,var(--c) 78%,#fff)}}
:root[data-theme="dark"] .tile{background:color-mix(in srgb,var(--c) 78%,#fff)}
/* ---------- chama da ofensiva ---------- */
.chama-viva{position:relative;flex:none;width:58px;height:70px;padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;color:inherit}
.chama-viva svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 6px 10px rgba(255,106,20,.35))}
.chama-viva g{transform-box:fill-box;transform-origin:50% 100%}
.cv-ext{animation:cv-danca 1.8s ease-in-out infinite}
.cv-mei{animation:cv-danca 1.25s ease-in-out infinite reverse}
.cv-int{animation:cv-int .9s ease-in-out infinite}
.cv-brilho{fill:#ff8a1f;opacity:.22;transform-box:fill-box;transform-origin:center;animation:cv-brilho 1.8s ease-in-out infinite}
.chama-viva.n2 svg{filter:drop-shadow(0 6px 14px rgba(255,106,20,.55))}
.chama-viva.n3 svg{filter:drop-shadow(0 0 10px rgba(255,190,40,.7)) drop-shadow(0 6px 16px rgba(255,80,20,.55))}
.chama-viva.apagada svg{filter:none}
.chama-viva.apagada .cv-ext path{fill:var(--trilho)}
.chama-viva.apagada .cv-mei path{fill:var(--line)}
.chama-viva.apagada .cv-int,.chama-viva.apagada .cv-brilho{display:none}
.chama-viva.apagada g{animation:none}
.chama-viva.aticar svg{animation:cv-atica .65s cubic-bezier(.3,1.6,.5,1)}
.chama-viva.apagada.aticar svg{animation:treme .45s}
.chama-viva .faisca{position:absolute;left:50%;bottom:45%;width:7px;height:7px;border-radius:50%;background:#ffc53d;box-shadow:0 0 8px #ff8a1f;pointer-events:none;animation:faisca .85s ease-out forwards}
@keyframes cv-danca{0%,100%{transform:scale(1,1) skewX(0)}25%{transform:scale(1.04,.95) skewX(-3deg)}50%{transform:scale(.96,1.06) skewX(2deg)}75%{transform:scale(1.02,.97) skewX(-1deg)}}
@keyframes cv-int{0%,100%{transform:scale(1)}50%{transform:scale(.9,1.12)}}
@keyframes cv-brilho{50%{opacity:.42;transform:scale(1.18)}}
@keyframes cv-atica{0%{transform:scale(1)}35%{transform:scale(1.3) translateY(-5px)}100%{transform:scale(1)}}
@keyframes faisca{from{transform:translate(-50%,0) scale(1);opacity:1}to{transform:translate(calc(-50% + var(--dx)),var(--dy)) scale(.2);opacity:0}}
/* ---------- calendário da prova ---------- */
.cal-prova{position:relative;flex:none;width:62px;height:74px;padding:0;border:0;background:none;cursor:pointer;perspective:320px;-webkit-tap-highlight-color:transparent;color:inherit}
.cal-in{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transform-origin:50% 0;transition:transform .65s cubic-bezier(.3,1.3,.5,1)}
.cal-prova.virado .cal-in{transform:rotateY(180deg)}
.cal-prova.cal-prova .cal-pag{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:0 4px 0 -1px var(--surface),0 4px 0 0 var(--line),0 10px 18px -12px rgba(0,0,0,.45);overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.cal-prova.cal-prova .cal-verso{transform:rotateY(180deg)}
.cal-prova.cal-prova .cal-mes{display:block;width:100%;background:var(--lacre);color:#fff;font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;line-height:1;padding:6px 0 5px;text-align:center}
.cal-prova.cal-prova .cal-verso .cal-mes{background:var(--toga-txt)}
.cal-prova.cal-prova .cal-dia{display:block;font-family:var(--f-display);font-size:1.75rem;font-weight:700;line-height:1;margin-top:7px;color:var(--fg);font-variant-numeric:tabular-nums}
.cal-prova.cal-prova .cal-sem{display:block;font-size:.62rem;color:var(--muted);font-weight:700;margin-top:3px;line-height:1}
.cal-prova::before,.cal-prova::after{content:"";position:absolute;top:-4px;left:17px;width:6px;height:11px;border-radius:3px;background:var(--muted);z-index:2}
.cal-prova::after{left:auto;right:17px}

.rv-hero{display:grid;grid-template-columns:minmax(150px,200px) 1fr;gap:6px 18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden}
.rv-hero .ilu{position:absolute;right:-18px;bottom:-14px;width:150px;height:auto;opacity:.22;pointer-events:none}
.rv-medidor{background:none;border:0;padding:0;margin:0;cursor:pointer;width:100%;-webkit-tap-highlight-color:transparent;position:relative;z-index:1}
.rv-medidor svg{display:block;width:100%;height:auto;overflow:visible}
.rv-arco-t{fill:none;stroke:var(--trilho);stroke-width:16;stroke-linecap:round}
.rv-arco{fill:none;stroke:url(#rv-gr);stroke-width:16;stroke-linecap:round;stroke-dashoffset:var(--off)}
.rv-marca{stroke:var(--muted);stroke-width:2;stroke-linecap:round;opacity:.5}
.rv-ponteiro{transform-origin:100px 100px;transform:rotate(var(--a))}
.rv-agulha{fill:var(--fg)} .rv-eixo{fill:var(--fg)} .rv-eixo-c{fill:var(--surface)}
html[data-anim="on"] .rv-arco{animation:rv-arco 1.2s cubic-bezier(.3,.8,.3,1) both}
html[data-anim="on"] .rv-ponteiro{animation:rv-ponteiro 1.4s cubic-bezier(.3,1.5,.5,1) both}
@keyframes rv-arco{from{stroke-dashoffset:var(--tot)}}
@keyframes rv-ponteiro{from{transform:rotate(-90deg)}}
html[data-anim="on"] .rv-medidor.treme .rv-ponteiro{animation:rv-treme .55s ease both}
@keyframes rv-treme{0%,100%{transform:rotate(var(--a))}25%{transform:rotate(calc(var(--a) - 14deg))}55%{transform:rotate(calc(var(--a) + 10deg))}80%{transform:rotate(calc(var(--a) - 4deg))}}
.rv-hero-txt{position:relative;z-index:1;min-width:0}
.rv-k{margin:0;font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.rv-hero h2{margin:2px 0 6px;font-size:2rem;line-height:1.05;color:var(--toga-txt);display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.rv-hero h2 small{font-size:.86rem;font-weight:700;color:var(--fg);background:var(--surface-2);border-radius:999px;padding:3px 10px}
.rv-hero-txt>p:last-child{margin:0;color:var(--muted);font-size:.92rem;line-height:1.45}
@media (max-width:520px){.rv-hero{grid-template-columns:1fr;text-align:center;padding-top:10px}.rv-medidor{max-width:220px;margin:0 auto}.rv-hero h2{justify-content:center}}
/* para hoje */
.rv-hoje{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rv-t{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:var(--r);padding:12px;color:var(--fg);font:inherit;cursor:pointer;min-width:0;position:relative;overflow:hidden;transition:transform .2s ease,box-shadow .2s ease}
.rv-t:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 8px 20px -14px var(--c)}
.rv-t:disabled{cursor:default;opacity:1}
.rv-t-ic{display:grid;place-items:center;width:34px;height:34px;border-radius:12px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.rv-t-ic .i{width:19px;height:19px}
.rv-t b{font-size:1.8rem;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.rv-t-rot{font-weight:700;font-size:.9rem}
.rv-t small{color:var(--muted);font-size:.76rem;line-height:1.3;overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
.rv-t.ok{border-top-color:var(--ok)} .rv-t.ok .rv-t-ic{background:var(--ok-bg);color:var(--ok)} .rv-t.ok b{color:var(--muted)}
html[data-anim="on"] .rv-t:not(.ok) .rv-t-ic{animation:rv-pulsa 2.4s ease-in-out infinite}
@keyframes rv-pulsa{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 40%,transparent)}50%{box-shadow:0 0 0 7px transparent}}
@media (max-width:420px){.rv-hoje{gap:7px}.rv-t{padding:10px 9px}.rv-t b{font-size:1.5rem}}
.rv-comecar{width:100%;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px}
.rv-comecar .i{width:18px;height:18px}
.rv-ordem{margin:8px 2px 0;font-size:.84rem;color:var(--muted);line-height:1.4;text-align:center}
.rv-bloco{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px}
/* previsão de 14 dias */
.rv-prev{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:150px}
.rv-barra{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;background:none;border:0;padding:0;font:inherit;color:var(--muted);cursor:pointer;min-width:0;border-radius:8px}
.rv-barra b{font-size:.7rem;font-weight:700;color:var(--fg);min-height:1em;font-variant-numeric:tabular-nums}
.rv-col{display:flex;flex-direction:column-reverse;width:72%;max-width:22px;height:calc((100% - 46px) * var(--h) / 100);border-radius:6px 6px 3px 3px;overflow:hidden;background:var(--trilho);transform-origin:bottom}
.rv-col i{flex-basis:0;flex-shrink:1;min-height:0}
.rv-col .c,.rv-leg .c{background:var(--rv-c)} .rv-col .q,.rv-leg .q{background:var(--rv-q)} .rv-col .m,.rv-leg .m{background:var(--rv-m)}
.rv-barra small{font-size:.62rem;margin-top:4px;text-transform:lowercase;white-space:nowrap}
.rv-barra em{font-style:normal;font-size:.7rem;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums}
.rv-barra.hj small,.rv-barra.hj em{color:var(--toga-txt);font-weight:800}
.rv-barra[aria-pressed="true"]{background:var(--surface-2)}
html[data-anim="on"] .rv-col{animation:rv-sobe .8s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--i) * 45ms + .15s)}
@keyframes rv-sobe{from{transform:scaleY(0)}}
.rv-leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 0;font-size:.78rem;color:var(--muted)}
.rv-leg span{display:inline-flex;align-items:center;gap:6px} .rv-leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.rv-dia-info,.rv-cx-info{margin:10px 0 0;font-size:.88rem;line-height:1.45;background:var(--surface-2);border-radius:12px;padding:9px 12px;min-height:2.9em}
/* caixas de força */
.rv-caixas{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:end}
.rv-cx{background:none;border:0;padding:0;font:inherit;color:var(--fg);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.rv-pote{position:relative;display:block;width:100%;height:96px;border-radius:12px 12px 14px 14px;border:2px solid color-mix(in srgb,var(--c) 55%,var(--line));background:color-mix(in srgb,var(--c) 7%,var(--surface));overflow:hidden}
.rv-pote i{position:absolute;left:0;right:0;bottom:0;height:var(--h);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));transform-origin:bottom}
.rv-pote b{position:absolute;inset:auto 0 6px;text-align:center;font-size:1.05rem;font-variant-numeric:tabular-nums;color:var(--fg);text-shadow:0 1px 0 color-mix(in srgb,var(--surface) 70%,transparent)}
.rv-cx small{font-size:.7rem;line-height:1.2;text-align:center;color:var(--muted);font-weight:600;min-height:2.4em}
.rv-cx[aria-pressed="true"] .rv-pote{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 35%,transparent)}
.rv-cx[aria-pressed="true"] small{color:var(--fg)}
html[data-anim="on"] .rv-pote i{animation:rv-sobe 1s cubic-bezier(.2,1.2,.4,1) both;animation-delay:calc(var(--i) * 90ms + .2s)}
html[data-anim="on"] .rv-cx.pula .rv-pote{animation:rv-pula .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes rv-pula{40%{transform:translateY(-6px) scale(1.04)}}
.rv-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.rv-nums span{display:flex;flex-direction:column;align-items:center;font-size:.76rem;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:8px 4px}
.rv-nums b{font-size:1.25rem;color:var(--fg);font-variant-numeric:tabular-nums}
/* teimosos */
.rv-teim{display:flex;gap:12px;align-items:flex-start;margin-top:14px;background:var(--erro-bg);border-radius:var(--r);padding:14px;border:1px solid color-mix(in srgb,var(--erro) 30%,transparent)}
.rv-teim .ilu{width:84px;flex:none;height:auto}
.rv-teim p{margin:4px 0 0;font-size:.9rem;line-height:1.45}
.rv-teim .botoes{margin-top:10px;flex-wrap:wrap}
/* curva do esquecimento */
.rv-explica>p{margin:0 0 10px;line-height:1.55}
.rv-curva{margin:0}
.rv-curva svg{display:block;width:100%;height:auto;background:var(--surface-2);border-radius:14px}
.rv-grade{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.rv-eixo-t{font-size:9px;fill:var(--muted);font-family:inherit}
.rv-fantasma{fill:none;stroke:var(--erro);stroke-width:2;stroke-dasharray:5 5;opacity:.55}
.rv-linha{fill:none;stroke:var(--toga-txt);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.rv-cm circle{fill:var(--lacre);stroke:var(--surface);stroke-width:2}
.rv-cm path{stroke:var(--lacre);stroke-width:1.2;stroke-dasharray:2 3;opacity:.6}
html[data-anim="on"] .rv-cm{animation:rv-cm .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i) * 120ms + .3s);transform-box:fill-box;transform-origin:center}
@keyframes rv-cm{from{opacity:0;transform:scale(.2)}}
.rv-seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.rv-seg button{font:inherit;font-weight:800;font-size:1.05rem;display:flex;flex-direction:column;align-items:center;padding:7px 2px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;transition:background .2s,color .2s,transform .2s}
.rv-seg button small{font-size:.62rem;font-weight:600;color:var(--muted)}
.rv-seg button[aria-pressed="true"]{background:var(--toga);border-color:var(--toga);color:var(--toga-fg);transform:translateY(-2px)}
.rv-seg button[aria-pressed="true"] small{color:inherit;opacity:.85}
.rv-curva-txt{margin:10px 0 0;font-size:.9rem;line-height:1.45}
.rv-regras{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.rv-regras li{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;line-height:1.45}
.rv-regras li>.i{flex:none;width:30px;height:30px;padding:6px;border-radius:10px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);box-sizing:border-box}
.rv-nota{margin:12px 0 0;font-size:.84rem;color:var(--muted)}
.rv-bt-sub{display:block;font-size:.74rem;font-weight:600;opacity:.85}
/* cartão do Hoje */
.rv-mini{display:flex;align-items:center;gap:12px;width:100%;margin:14px 0 0;padding:12px 14px;text-align:left;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;position:relative;overflow:hidden}
.rv-mini.tem{border-color:color-mix(in srgb,var(--lacre) 55%,var(--line));background:linear-gradient(100deg,color-mix(in srgb,var(--lacre) 9%,var(--surface)),var(--surface) 60%)}
.rv-mini>.i{flex:none;width:18px;height:18px;color:var(--muted)}
.rv-anel{position:relative;flex:none;width:48px;height:48px;display:grid;place-items:center}
.rv-anel svg{position:absolute;inset:0;width:100%;height:100%}
.rv-anel-t{fill:none;stroke:var(--trilho);stroke-width:5}
.rv-anel-v{fill:none;stroke:var(--lacre);stroke-width:5;stroke-linecap:round}
html[data-anim="on"] .rv-anel-v{animation:rv-anel 1.1s cubic-bezier(.3,.8,.3,1) both .2s}
@keyframes rv-anel{from{stroke-dashoffset:119.4}}
.rv-anel b{font-size:.88rem;line-height:1;font-variant-numeric:tabular-nums}.rv-anel b small{font-size:.6rem}
.rv-mini-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rv-mini-txt b{font-size:.98rem}.rv-mini-txt small{font-size:.8rem;color:var(--muted);line-height:1.3}
.rv-mini-sem{flex:none;display:flex;align-items:flex-end;gap:3px;height:34px}
.rv-mini-sem i{width:6px;height:var(--h);border-radius:3px;background:color-mix(in srgb,var(--lacre) 45%,var(--trilho));transform-origin:bottom}
.rv-mini-sem i.hj{background:var(--lacre)}
html[data-anim="on"] .rv-mini-sem i{animation:rv-sobe .7s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--i) * 50ms + .3s)}
@media (max-width:380px){.rv-mini-sem{display:none}}
/* etiqueta que sobe ao avaliar um cartão e aviso de questão dominada */
.rv-voa{position:fixed;z-index:60;transform:translate(-50%,0);pointer-events:none;font-size:.8rem;font-weight:800;padding:5px 11px;border-radius:999px;background:var(--ok);color:#fff;white-space:nowrap;box-shadow:0 6px 16px -8px rgba(0,0,0,.4);animation:rv-voa 1.3s cubic-bezier(.2,.8,.3,1) both}
.rv-voa.v0{background:var(--erro)} .rv-voa.v1{background:var(--aviso);color:#1b1305} .rv-voa.v3{background:var(--nv6)}
@keyframes rv-voa{0%{opacity:0;transform:translate(-50%,6px) scale(.7)}18%{opacity:1;transform:translate(-50%,-10px) scale(1.05)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-56px) scale(1)}}
.rv-toast{position:fixed;left:50%;width:max-content;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-left:5px solid #f6c453;border-radius:14px;padding:10px 16px;box-shadow:0 14px 30px -14px rgba(0,0,0,.45);max-width:calc(100vw - 32px);animation:rv-toast .5s cubic-bezier(.2,1.4,.4,1) both;transition:opacity .5s,transform .5s}
.rv-toast .i{width:24px;height:24px;color:#e0a100;flex:none}
.rv-toast span{display:flex;flex-direction:column}.rv-toast small{color:var(--muted);font-size:.8rem}
.rv-toast.sai{opacity:0;transform:translate(-50%,16px)}
@keyframes rv-toast{from{opacity:0;transform:translate(-50%,30px) scale(.9)}}
/* Premium: degradê da paleta no medidor e nos destaques */
[data-estilo="premium"] .rv-hero{background:var(--grad-suave),var(--surface);box-shadow:var(--sombra);border-color:transparent}

[data-estilo="premium"] .rv-hero h2{color:var(--p1-txt)}

:root[data-theme="dark"] .rv-hero h2,:root[data-theme="dark"][data-estilo="premium"] .rv-hero h2{color:var(--fg)}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rv-hero h2{color:var(--fg)}:root:not([data-theme="light"])[data-estilo="premium"] .rv-linha{stroke:var(--p1-txt-d)}}
/* segredo: Memória de elefante */

const CALC_DEF={
