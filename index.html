/* ---------- notas no formato Afya Unigranrio ----------
   N1 + N2 somam até 100 pontos. Com 70 ou mais, aprovação direta. De 40 a 69,9 a pessoa
   vai para o exame final (toda a matéria, de 0 a 100) e passa se (N1 + N2 + exame) ÷ 2 for 50 ou mais.
   Abaixo de 40, reprovação. A substitutiva é só para quem faltou: entra no lugar da N1 ou da N2 que ficou sem nota. */
const NOTA_REGRA={dir:70,ex:40,fim:50};
const notasOn=()=>!!(S.cfg&&S.cfg.notas);
const fmtNota=v=>(Math.round(v*10)/10).toLocaleString("pt-BR");
function situacaoNotas(p){const N=p.notas||{};const le=k=>N[k]===""||N[k]==null||isNaN(+N[k])?null:+N[k];
 const v1=le("v1")||50,v2=le("v2")||(100-v1>0?100-v1:50);const lim=(x,m)=>x===null?null:Math.max(0,Math.min(m,x));
 let n1=lim(le("n1"),v1),n2=lim(le("n2"),v2),sub=le("sub"),ex=lim(le("ex"),100),usouSub=null;
 if(sub!==null){if(n1===null){n1=lim(sub,v1);usouSub="N1"}else if(n2===null){n2=lim(sub,v2);usouSub="N2"}}
 const R=NOTA_REGRA,base={n1,n2,ex,v1,v2,usouSub,ignorouSub:sub!==null&&!usouSub};
 if(n1===null&&n2===null)return {...base,est:"vazio",soma:null};
 if(n1===null||n2===null){const tem=n1!==null?n1:n2,falta=n1!==null?"N2":"N1",max=n1!==null?v2:v1;const pDir=R.dir-tem,pEx=R.ex-tem;
  if(pDir<=0)return {...base,est:"aprovado",soma:tem,titulo:"Aprovação garantida",msg:`Você já somou ${fmtNota(tem)} pontos. Mesmo com zero na ${falta}, passa direto. Agora é estudar para aprender de verdade.`};
  if(pDir<=max)return {...base,est:"parcial",soma:tem,falta:pDir,titulo:`Mire em ${fmtNota(pDir)} na ${falta}`,msg:`Com ${fmtNota(tem)} pontos até aqui, você precisa de ${fmtNota(pDir)} de ${fmtNota(max)} na ${falta} para passar direto (70). ${pEx>0?`Com ${fmtNota(pEx)} já garante o exame final.`:"O exame final já está garantido como rede de segurança."}`};
  if(pEx<=max)return {...base,est:"parcial",soma:tem,falta:pEx,titulo:`Mire em ${fmtNota(pEx)} na ${falta}`,msg:`A ${falta} vale ${fmtNota(max)}, então os 70 direto ficaram fora de alcance. Com ${fmtNota(pEx)} você chega aos 40 e ganha a chance do exame final. Dá para virar.`};
  return {...base,est:"parcial",soma:tem,titulo:`Capriche na ${falta}`,msg:`Nem a nota máxima na ${falta} leva aos 40. Converse com a coordenação sobre as opções e use a ${falta} para aprender o máximo.`}}
 const soma=n1+n2;
 if(soma>=R.dir)return {...base,est:"aprovado",soma,titulo:"Aprovado direto!",msg:`N1 + N2 = ${fmtNota(soma)} pontos. Passou sem exame final. Parabéns, o esforço valeu.`};
 if(soma<R.ex)return {...base,est:"reprovado",soma,titulo:"Abaixo de 40",msg:`N1 + N2 = ${fmtNota(soma)} pontos, menos que os 40 do exame final. Confira com a coordenação e use o app para chegar mais forte na próxima vez.`};
 const preciso=Math.max(0,2*R.fim-soma);
 if(ex===null)return {...base,est:"exame",soma,falta:preciso,titulo:`Exame final: precisa de ${fmtNota(preciso)}`,msg:`N1 + N2 = ${fmtNota(soma)} pontos. No exame final (toda a matéria, de 0 a 100) você precisa de ${fmtNota(preciso)} para a média (soma + exame) ÷ 2 chegar a 50.`};
 const media=(soma+ex)/2;
 return media>=R.fim?{...base,est:"aprovado",soma,media,titulo:"Aprovado no exame final!",msg:`Média final ${fmtNota(media)} (${fmtNota(soma)} + ${fmtNota(ex)}) ÷ 2. Você virou o jogo.`}
  :{...base,est:"reprovado",soma,media,titulo:`Média final ${fmtNota(media)}`,msg:`Faltaram ${fmtNota(R.fim-media)} pontos na média. Procure a coordenação e não desanime: cada questão que você faz aqui conta para a próxima.`}}
/* régua de 0 a 100 com as marcas do exame (40) e da aprovação direta (70) */
function resultadoNotas(p){const s=situacaoNotas(p);const id="pv-res-"+p.id;
 if(s.est==="vazio")return `<div class="pv-res vazio" id="${id}"><p>Lance as notas quando saírem. O app mostra quanto falta para passar.</p></div>`;

 return `<div class="pv-res ${st}" id="${id}" role="status">

function blocoNotas(p){const N=p.notas||{};const s=situacaoNotas(p);const camp=(k,rot,max,dica)=>`<label class="pv-nt"><span>${rot}</span><input type="text" inputmode="decimal" autocomplete="off" placeholder="—" value="${N[k]==null?"":esc(fmtNota(N[k]))}" data-nota="${k}" data-id="${p.id}" aria-label="${rot} de ${esc(infoDisc(p.d).nome)}"><small>${dica}</small></label>`;

function blocoProvasHoje(P){if(!avOn())return "";const L=P?P.L:provasAtivas();

/* ---------- plano das provas: quais provas entram no estudo de hoje ----------
   Cada ritmo tem "vagas" por dia (leve 1, automático e moderado 2, intenso 3). Se as provas cabem nas vagas,
   todas entram todo dia. Se não cabem, o app reveza: simula os próximos dias dando a cada prova um crédito
   que cresce com a falta de preparo e com a proximidade da data; a cada dia entram as de maior crédito
   (e o crédito delas zera). Prova em até 2 dias entra sempre. A primeira que ficou de fora entra "um pouco",
   só com algumas questões, para a matéria não esfriar. A escolha de hoje fica guardada até virar o dia. */
const vagasProvas=()=>({leve:1,intenso:3}[S.cfg&&S.cfg.ritmo]||2);
const siglaDisc=d=>d.charAt(0).toUpperCase()+d.slice(1);
function planoProvas(){if(!avOn())return null;const L=provasAtivas();if(!L.length)return null;
 const K=vagasProvas(),H=Math.min(60,Math.max(...L.map(x=>x.prox.n))+1),h0=inicioDia();
 const sig=L.map(x=>x.p.id+"@"+x.prox.dt).sort().join(",")+"|"+K;const memo=S.planoPv&&S.planoPv.dia===hojeStr()&&S.planoPv.sig===sig?S.planoPv:null;
 const cred={};L.forEach(x=>{const sem=x.ult?Math.round((h0-inicioDia(x.ult))/864e5):7;cred[x.p.id]=Math.min(7,Math.max(0,sem))*.15});
 const D=[];
 for(let t=0;t<H;t++){const V=L.filter(x=>x.prox.n>=t);if(!V.length){D.push({t,ch:[],leve:[],provas:[]});continue}
  V.forEach(x=>{cred[x.p.id]+=(110-x.preparo)/100*(1+3/(x.prox.n-t+1))});
  let ch,leve;
  if(t===0&&memo){ch=V.filter(x=>memo.ch.includes(x.p.id));leve=V.filter(x=>memo.leve.includes(x.p.id))}
  else{const obrig=V.filter(x=>x.prox.n-t<=2);const resto=V.filter(x=>!obrig.includes(x)).sort((a,b)=>cred[b.p.id]-cred[a.p.id]||a.prox.n-b.prox.n);
   ch=obrig.concat(resto).slice(0,Math.max(K,obrig.length));leve=V.filter(x=>!ch.includes(x)).sort((a,b)=>cred[b.p.id]-cred[a.p.id]).slice(0,1)}
  ch.forEach(x=>cred[x.p.id]=0);leve.forEach(x=>cred[x.p.id]/=2);
  D.push({t,ch:ch.map(x=>x.p.id),leve:leve.map(x=>x.p.id),provas:V.filter(x=>x.prox.n===t).map(x=>x.p.id)})}
 if(!memo)S.planoPv={dia:hojeStr(),sig,ch:D[0].ch,leve:D[0].leve};
 /* com rodízio, cada prova estuda menos dias: as questões e os temas de cada dia sobem na mesma proporção */
 L.forEach(x=>{const dias=D.slice(0,x.prox.n+1).filter(d=>d.ch.includes(x.p.id)).length;x.diasEst=Math.max(1,dias);
  x.modo=D[0].ch.includes(x.p.id)?"cheio":D[0].leve.includes(x.p.id)?"leve":"";
  x.alvoHoje=x.modo==="cheio"?Math.min(40,Math.max(x.alvo,Math.ceil(x.alvo*(x.prox.n+1)/x.diasEst))):x.modo==="leve"?Math.min(5,x.alvo):0;
  x.temasDia=x.temas>x.lidos?Math.ceil((x.temas-x.lidos)/Math.max(1,x.diasEst-(D[x.prox.n]&&D[x.prox.n].ch.includes(x.p.id)?1:0))):0});
 const hoje=L.filter(x=>x.modo==="cheio").sort((a,b)=>a.prox.n-b.prox.n||b.urg-a.urg);
 return {L,K,D,hoje,leve:L.filter(x=>x.modo==="leve"),fora:L.filter(x=>!x.modo)}}

const INTERV=[0,1,3,7,15,30,60,120];
function cartoesDe(d){const P=paginas(d);const out=[];P.secs.forEach((s,k)=>{let j=0;s.corpo.split("\n").forEach(l=>{l=l.trim();if(l.startsWith("?? ")){const x=l.slice(3);const m=x.indexOf(" | ");if(m>0)out.push({id:`${d}:${k+1}:${j}`,d,k:k+1,p:x.slice(0,m),r:x.slice(m+3)});j++}})});return out}
const estC=id=>(S.cards&&S.cards[id])||null;
const DIA=864e5;
/* Cada cartão guarda o intervalo atual (iv, em dias) e a facilidade (ef). Acertar multiplica o intervalo pela facilidade;
   errar zera o intervalo e torna o cartão um pouco mais "difícil", para ele voltar com mais frequência. Cartões antigos (só com b) são convertidos. */
function sr(s){s=s||{};if(s.iv===undefined){s.iv=s.b?INTERV[Math.min(INTERV.length-1,s.b)]:0;s.ef=2.5}if(!s.ef)s.ef=2.5;return s}
function proxIv(s0,nota){const s=sr(Object.assign({},s0));let iv=s.iv||0,ef=s.ef;
 if(nota===0)return {iv:0,ef:Math.max(1.3,ef-0.2)};
 if(nota===1){iv=iv<1?1:Math.max(iv+1,Math.round(iv*1.2));ef=Math.max(1.3,ef-0.15)}
 else if(nota===2){iv=iv<1?1:iv<3?3:Math.round(iv*ef)}
 else{iv=iv<1?4:Math.round(Math.max(iv,1)*ef*1.3)+1;ef=Math.min(3.2,ef+0.15)}

function avaliarCartao(nota){const c=deck.q[deck.pos];S.cards=S.cards||{};const s=sr(S.cards[c.id]||{b:0,due:0,n:0});const agora=Date.now();const r=proxIv(s,nota);s.ef=r.ef;
 if(nota===0){s.iv=0;s.b=0;s.lap=(s.lap||0)+1;s.due=agora+10*60*1000;if(!c.rep){deck.q.push(Object.assign({},c,{rep:1}))}deck.er+=c.rep?0:1}

  const hr=d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  if(d.toDateString()===h.toDateString())return "Hoje<br>"+hr;if(d.toDateString()===o.toDateString())return "Ontem<br>"+hr;
  return `${new Intl.DateTimeFormat("pt-BR",{day:"2-digit",month:"short",year:"numeric"}).format(d).replace(/\s?de\s?/g," ")}<br>${hr}`}
function res(a){let ok=0,er=0,br=0;a.qids.forEach(id=>{const r=a.resp[id];if(r===undefined)br++;else if(r===0)ok++;else er++});return {ok,er,br,pct:a.qids.length?Math.round(ok*100/a.qids.length):0}}
function registrar(id,c){const s=S.stats[id]||{n:0,ok:0,u:0};s.n++;if(c)s.ok++;s.u=c?1:0;s.t=Date.now();S.stats[id]=s;agendarQ(id,c)}
/* questão errada volta amanhã; cada acerto na revisão adia a próxima (3, 7, 15 e 30 dias); depois de 5 acertos seguidos sai da revisão */
const PASSOS_Q=[1,3,7,15,30];
function agendarQ(id,c){S.qrev=S.qrev||{};const r=S.qrev[id];const d0=new Date();d0.setHours(0,0,0,0);const hoje=d0.getTime();
 if(!c){S.qrev[id]={n:0,due:hoje+864e5};return}
 if(r){r.n++;if(r.n>=PASSOS_Q.length)delete S.qrev[id];else r.due=hoje+PASSOS_Q[r.n]*864e5}}
function errosHoje(){const q=S.qrev||{};const now=Date.now();return Object.keys(q).filter(id=>QMAP[id]&&q[id].due<=now)}
const ultima=key=>S.hist.find(a=>a.key===key);

function estado(key){const a=ultima(key);if(!a)return {st:"nao",a:null};if(a.status==="pausado")return {st:"pausa",a};const r=res(a);return {st:r.pct===100?"perf":r.pct>=50?"aprov":"reprov",a,r}}

/* ---------- botão voltar do celular ----------
   Enquanto houver para onde voltar (menu ou janela aberta, tela interna, ou outra aba que não seja Hoje),
   o app mantém uma entrada extra no histórico. O voltar do sistema consome essa entrada e o app volta
   um passo; em Hoje, sem nada aberto, a entrada some e o próximo voltar sai do app normalmente. */
let guardaVoltar=false;
function podeVoltar(){return !!(tourI>=0||gaveta||repQ||folha||document.querySelector(".festa")||pilha.length||rota.tela!=="hoje")}
function syncVoltar(){try{if(podeVoltar()){if(!guardaVoltar){history.pushState({fl:1},"");guardaVoltar=true}}else if(guardaVoltar){guardaVoltar=false;history.back()}}catch(e){}}
function voltarSistema(){
  if(tourI>=0){if(tourI>0)tourIr(tourI-1);else tourFechar();return}
  const fs=document.querySelector(".festa");if(fs){fs.remove();return}
  if(repQ){repQ=null;rota.manterScroll=true;render();return}
  if(gaveta){gaveta=false;rota.manterScroll=true;render();return}
  if(folha){folha=false;confirmar=null;rota.manterScroll=true;render();return}
  /* usa o mesmo botão de voltar do topo, que já sabe pausar o simulado, salvar a leitura etc. */
  const b=document.querySelector('.topo .topo-linha > button.icone:first-child');
  if(b&&b.dataset.acao!=="gaveta"){b.click();return}
  if(rota.tela!=="hoje"){raiz({tela:"hoje"});return}
}
window.addEventListener("popstate",()=>{if(!guardaVoltar)return;guardaVoltar=false;voltarSistema();syncVoltar()});

  const errs=Object.keys(S.stats).filter(k=>S.stats[k].u===0&&QMAP[k]).length;
  return `<div class="camada" data-acao="fechar-gaveta"><aside class="gaveta" role="dialog" aria-modal="true" aria-label="Menu">
   <div class="gaveta-topo"><span class="marca" aria-hidden="true">${ic("balanca")}</span><b>Facul Lab</b><small>${QS.length.toLocaleString("pt-BR")} questões · faculdade e Exame de Ordem</small></div>
   <nav aria-label="Seções do app">${it("hoje","alvo","Hoje"+(itensHoje()?` <span class="badge">${itensHoje()}</span>`:""))}${it("metas","barras","Metas e desempenho")}${it("progresso","pct","Progresso geral")}${it("busca","lupa","Buscar em tudo")}
   <p class="nav-grupo">Estudar</p>${it("faculdade","livro","Faculdade (1º ao 10º)")}${it("cartoes","cartas","Cartões de memorização")}${it("leiseca","recibo","Lei seca")}${it("favs","marcador","Favoritos e anotações")}
   <p class="nav-grupo">Treinar</p>${it("oab","carro","Simulados OAB")}${it("materias","grade","Simulados por matéria")}
   <button data-acao="erradas" ${errs?"":"disabled"} style="${errs?"":"opacity:.5"}">${ic("refazer")}<span>Refazer questões erradas${errs?` (${errs})`:""}</span></button>
   <hr>${it("config","eng","Configurações")}${it("reportes","exc","Questões reportadas"+(nRep()?` (${nRep()})`:""))}<button data-acao="tour">${ic("estrela")}<span>Tour pelo app</span></button>${it("sobre","info","Como funciona")}${it("quem","coracao","Sobre o Facul Lab")}</nav></aside></div>`}

/* ---------- OAB ---------- */
function telaOab(){
  const aba=rota.aba||"progresso";
  const extra=`<div class="abas" role="tablist"><button role="tab" aria-selected="${aba==="progresso"}" data-acao="aba" data-aba="progresso">Progresso</button><button role="tab" aria-selected="${aba==="historico"}" data-acao="aba" data-aba="historico">Histórico</button></div>`;
  return topo("Simulado OAB","1ª fase · 30 simulados de 80 questões",{menu:true,extra})+
   `<main class="wrap">${capaTela("balanca","Rumo à aprovação","30 simulados com a distribuição da 1ª fase. A meta é acertar 40 de 80.")}${aba==="progresso"?blocoProgresso():blocoHistorico()}<p class="sinc">${esc(statusSinc)}</p></main>
   <button class="fab" data-acao="proximo" aria-label="Iniciar próximo simulado">${ic("mais")}</button>`}
function concluidosOab(){const l=[];for(let k=0;k<N_SIM;k++){const a=S.hist.find(x=>x.key==="oab:"+k&&x.status==="concluido");if(a)l.push(a)}return l}
function blocoProgresso(){
  const c=concluidosOab();let ok=0,er=0;c.forEach(a=>{const r=res(a);ok+=r.ok;er+=r.er+r.br});
  const media=c.length?Math.round(c.reduce((s,a)=>s+res(a).pct,0)/c.length):0;
  const tm=c.length?c.reduce((s,a)=>s+a.tempo,0)/c.length:0;
  const tot=ok+er;
  const nh=itensHoje(),sq=sequencia();
  return `${true?`<button class="card hoje-card" data-acao="ir-raiz" data-tela="hoje">${tile("var(--lacre)","alvo")}<b>${nh?`Revisar hoje: ${nh} ${nh>1?"itens":"item"}`:"Plano de hoje"}</b><small>${perAtual()!==null?esc(nomePer(perAtual()))+" · ":""}${sq?`${sq} dia${sq>1?"s":""} seguido${sq>1?"s":""} de estudo · `:""}${esc(textoProva())}</small></button>`:""}<div class="metrica" style="margin-top:6px">${tile("var(--toga)","pct")}<div><div class="top"><span>Nota média</span><b>${c.length?media+"%":"—"}</b></div><div class="trilho"><i class="f-toga" style="width:${media}%;background:var(--ok)"></i></div></div></div>
  <div class="metrica">${tile("var(--lacre)","relogio")}<div><div class="top"><span>Tempo médio</span><b>${c.length?dur(tm):"—"}</b></div><div class="trilho"><i class="f-lacre" style="width:${Math.min(100,tm*100/(5*3600))}%"></i></div></div></div>
  <div class="secao" role="heading" aria-level="2">Progresso geral</div>
  <div class="metrica">${tile("var(--toga)","barras")}<div><div class="top"><span>${c.length} de ${N_SIM}</span>${contagem({ok,er,br:0}).replace(/<span class="c-br"[\s\S]*?<\/span><\/span>(?=<\/span>$)/,"")}</div>
   <div class="trilho"><i class="f-ok" style="width:${c.length*100/N_SIM*(tot?ok/tot:0)}%"></i><i class="f-er" style="width:${c.length*100/N_SIM*(tot?er/tot:0)}%"></i></div></div></div>
  <div class="secao" role="heading" aria-level="2">% acertos por assunto</div>
  <div class="assuntos">${OAB.map(m=>{const ids=porM[m]||[];let o=0,e=0;ids.forEach(id=>{const s=S.stats[id];if(s){if(s.u)o++;else e++}});const v=o+e;const pct=v?Math.round(o*100/v):null;
    return `<button class="assunto" data-acao="materia" data-m="${m}">${tile(META[m].cor,META[m].ic)}<span class="barra${v?" tem":""}">${v?`<i class="ok" style="width:${pct}%"></i><i class="er" style="width:${100-pct}%"></i>`:""}<span><b>${esc(META[m].nome)}</b><em>${v?pct+"%":"—"}</em></span></span></button>`}).join("")}</div>`}
function blocoHistorico(){
  const ks=[];for(let k=0;k<N_SIM;k++)ks.push("oab:"+k);
  const ord=ks.map((k,i)=>({k,i,e:estado(k)})).sort((x,y)=>{const pr={pausa:0,aprov:1,reprov:1,perf:1,nao:2};return pr[x.e.st]-pr[y.e.st]||((y.e.a&&y.e.a.inicio)||0)-((x.e.a&&x.e.a.inicio)||0)||x.i-y.i});
  return `<div class="lista" style="margin-top:4px">${ord.map(o=>itemSim(o.k)).join("")}</div>`}

/* ---------- matérias ---------- */
function statMat(ids){let o=0,e=0;ids.forEach(id=>{const s=S.stats[id];if(s){if(s.u)o++;else e++}});return {o,e,v:o+e,n:ids.length}}
/* ---------- desempenho por assunto ---------- */
const GA={};Object.keys(window.GRUPOS_ASS||{}).forEach(m=>{GA[m]={};window.GRUPOS_ASS[m].split("\n").forEach(l=>{const k=l.indexOf(":");if(k<0)return;const g=l.slice(0,k).trim();l.slice(k+1).split(";").forEach(a=>{a=a.trim();if(a)GA[m][a]=g})})});
const grupoDe=q=>(GA[q.m]&&GA[q.m][q.a])||q.a;
const idsEscopo=sc=>porM[sc]||(DISC[sc]?idsDisc(sc):[]);
const nomeEscopo=sc=>META[sc]?META[sc].nome:infoDisc(sc).nome;
function statAss(sc){const g={};idsEscopo(sc).forEach(id=>{const q=QMAP[id];if(!q)return;const k=grupoDe(q);const x=g[k]=g[k]||{a:k,o:0,e:0,n:0};x.n++;const s=S.stats[id];if(s){if(s.u)x.o++;else x.e++}});
 return Object.values(g).map(x=>{x.v=x.o+x.e;x.pct=x.v?Math.round(x.o*100/x.v):null;return x})}
const ehFraco=x=>x.v>=3&&x.pct<70;
function fracos(sc){return statAss(sc).filter(ehFraco).sort((a,b)=>a.pct-b.pct||b.v-a.v)}
function assuntoMaisFraco(scs){let b=null;scs.forEach(sc=>fracos(sc).forEach(x=>{if(!b||x.pct<b.pct||(x.pct===b.pct&&x.v>b.v))b=Object.assign({sc},x)}));return b}
function chaveAss(sc,a){return `ass:${sc}:${encodeURIComponent(a)}`}
function itemAss(sc,x,comNome){return `<button class="item ass" data-acao="treinar-ass" data-sc="${sc}" data-a="${esc(encodeURIComponent(x.a))}"><span class="ass-l"><span class="item-tit">${esc(x.a)}</span>${comNome?`<span class="item-sub">${esc(nomeCurto(nomeEscopo(sc)))}</span>`:""}<span class="trilho"><i class="f-ok" style="width:${x.o*100/x.n}%"></i><i class="f-er" style="width:${x.e*100/x.n}%"></i></span><span class="item-sub">${x.n} questõ${x.n>1?"es":"ão"} · ${x.v?`${x.pct}% de acerto em ${x.v} respondida${x.v>1?"s":""}`:"nenhuma respondida"}</span></span><span class="item-data">${ehFraco(x)?`<span class="tag-fraco">Ponto fraco</span>`:""}${ic("prox")}</span></button>`}
function secaoAss(sc){const L=statAss(sc).sort((a,b)=>(a.pct===null)-(b.pct===null)||(a.pct||0)-(b.pct||0)||b.n-a.n);const feitos=L.filter(x=>x.v).length;
 return `<div class="secao" role="heading" aria-level="2">Desempenho por assunto</div><p class="nota" style="margin-top:0">${feitos?"Do assunto em que você mais erra para o que mais acerta. Toque em um assunto para treinar só as questões dele.":"Responda algumas questões para ver em quais assuntos você acerta mais e menos. Você também pode treinar um assunto específico agora."}</p>
 <div class="lista">${L.map(x=>itemAss(sc,x)).join("")}</div>`}

/* ---------- reportar erro ---------- */
let repQ=null,repMot="";
const MOTIVOS=["Gabarito errado","Lei ou jurisprudência desatualizada","Enunciado ou alternativa confusa","Outro problema"];
const nRep=()=>Object.keys(S.rep||{}).filter(k=>QMAP[k]).length;
const botaoRep=q=>`<button class="link-rep" data-acao="reportar" data-q="${q.id}">${ic("exc")}${S.rep&&S.rep[q.id]?"Erro reportado · editar aviso":"Reportar erro nesta questão"}</button>`;
function telaRep(){const q=QMAP[repQ];if(!q)return "";const r=(S.rep||{})[repQ]||{};const mot=repMot||r.m||"";
 return `<div class="folha-camada" data-acao="fechar-rep"><div class="folha wrap" role="dialog" aria-label="Reportar erro">
  <h2>Reportar erro na questão</h2><p class="nota">${esc(META[q.m].nome)} · ${esc(q.a)} · código ${esc(q.id)}</p>
  <p class="rep-enun">${esc(q.q)}</p>
  <div class="opcoes col">${MOTIVOS.map(o=>`<button data-acao="rep-mot" data-v="${esc(o)}" aria-pressed="${o===mot}">${o}</button>`).join("")}</div>
  <label class="campo" style="margin-top:12px"><span>O que está errado? (opcional)</span><textarea id="rep-txt" rows="3" placeholder="Ex.: o prazo mudou com uma lei nova; a alternativa B também está certa">${esc(r.t||"")}</textarea></label>
  <div class="botoes">${r.d?`<button class="botao linha" data-acao="rep-tirar">Retirar o aviso</button>`:`<button class="botao linha" data-acao="rep-fechar">Cancelar</button>`}<button class="botao cheio" data-acao="rep-enviar" id="rep-ok" ${mot?"":"disabled"}>Salvar aviso</button></div>
 </div></div>`}
function textoReportes(){const ks=Object.keys(S.rep||{}).filter(k=>QMAP[k]).sort((a,b)=>S.rep[b].d-S.rep[a].d);
 return "Questões reportadas no Simulado OAB\n\n"+ks.map(k=>{const q=QMAP[k],r=S.rep[k];return `[${k}] ${META[q.m].nome} · ${q.a}\n${q.q}\nGabarito do app: ${q.o[0]}\nMotivo: ${r.m}${r.t?`\nObservação: ${r.t}`:""}`}).join("\n\n")}
function telaReportes(){const ks=Object.keys(S.rep||{}).filter(k=>QMAP[k]).sort((a,b)=>S.rep[b].d-S.rep[a].d);
 return topo("Questões reportadas",ks.length?`${ks.length} aviso${ks.length>1?"s":""}`:"Nenhum aviso",{menu:true})+
 `<main class="wrap">${ks.length?`<div class="dica"><p style="margin:0">Para corrigir, toque em <b>Copiar a lista</b> e cole na conversa com o Claude. Os avisos também ficam salvos na sua conta.</p></div>
 <div class="botoes"><button class="botao cheio" data-acao="copiar-rep">Copiar a lista</button></div>
 <div class="lista" style="margin-top:14px">${ks.map(k=>{const q=QMAP[k],r=S.rep[k];const M=META[q.m];
  return `<button class="item" data-acao="reportar" data-q="${k}">${tile(M.cor,M.ic)}<span style="min-width:0"><span class="item-tit">${esc(r.m)}</span><br><span class="item-sub">${esc(M.nome)} · ${esc(q.a)} · ${esc(k)}</span><span class="rep-q">${esc(q.q)}</span>${r.t?`<span class="rep-t">“${esc(r.t)}”</span>`:""}</span><span class="item-data">${ic("prox")}</span></button>`}).join("")}</div>`
 :vazio("checklist","Nenhuma questão reportada","Na correção de cada questão há o botão <b>Reportar erro nesta questão</b>. Use quando desconfiar de um gabarito ou de uma lei desatualizada: o aviso fica guardado aqui para você enviar depois.")}</main>`}

/* ---------- explicação de cada alternativa ---------- */
const explQ=q=>{const x=q.x||(window.EXPL&&window.EXPL[q.id]);return Array.isArray(x)&&x.length>=3?x:null};
function porQue(q,r,ord){const X=explQ(q);if(!X)return "";
 return `<div class="porque"><p class="porque-t">Por que as outras alternativas estão erradas</p>${ord.map((oi,p)=>oi===0?"":`<p class="${oi===r?"sua":""}"><b>${LETRAS[p]})</b> ${esc(X[oi-1])}${oi===r?` <span class="c-er">(sua resposta)</span>`:""}</p>`).join("")}</div>`}
function cardMat(id,acao,attr,nome,cor,icn,ids){const s=statMat(ids);
  return `<button class="card" data-acao="${acao}" ${attr}>${tile(cor,icn)}<b>${esc(nome)}</b><small>${ids.length} questões · ${s.v?Math.round(s.o*100/s.v)+"% de acerto":"não iniciado"}</small>
   <span class="trilho"><i class="f-ok" style="width:${s.o*100/(s.n||1)}%"></i><i class="f-er" style="width:${s.e*100/(s.n||1)}%"></i></span></button>`}
function telaMaterias(){
  return topo("Simulados por matéria","Escolha uma disciplina da OAB",{menu:true})+
  `<main class="wrap">${capaTela("alvo","Treine por matéria","Foque nas disciplinas em que você mais erra.")}<div class="grade-mat">${OAB.map(m=>cardMat(m,"materia",`data-m="${m}"`,META[m].nome,META[m].cor,META[m].ic,porM[m]||[])).join("")}</div><p class="sinc">${esc(statusSinc)}</p></main>`}
function telaMateria(){const m=rota.m,M=META[m];const n=nMat(m);const ks=[];for(let i=0;i<n;i++)ks.push(`mat:${m}:${i}`);
  return topo(M.nome,`${(porM[m]||[]).length} questões`,{})+
  `<main class="wrap"><div class="cabeca">${tile(M.cor,M.ic)}<div><h2>${esc(M.nome)}</h2><p class="nota">Na prova, caem ${(DIST.find(d=>d[0]===m)||[0,0])[1]} questões desta matéria.</p></div></div>
  <div class="secao" role="heading" aria-level="2">Simulados</div><div class="lista">${ks.map(k=>itemSim(k)).join("")}</div>
  <div class="secao" role="heading" aria-level="2">Treino livre</div><div class="lista">${itemSim("mtodas:"+m)}</div>${secaoAss(m)}</main>`}

/* ---------- faculdade ---------- */
function telaFaculdade(){
  const extra=`<div class="periodos" role="group" aria-label="Período">${PERIODOS.map((_,i)=>`<button data-acao="periodo" data-p="${i}" aria-pressed="${periodo===i}">${i+1}º período</button>`).join("")}</div>`;
  const ds=PERIODOS[periodo];
  return topo("Faculdade","Simulados do 1º ao 10º período",{menu:true,extra})+
  `<main class="wrap">${capaTela("capelo",`${periodo+1}º período`,"Apostila, resumo, cartões e simulados de cada disciplina.")}<div class="secao" role="heading" aria-level="2">Apostila do período</div>
  <button class="card apost" data-acao="ap" data-p="${periodo}">${tile("var(--toga)","livro")}<b>Apostila do ${periodo+1}º período</b><small>Explicação de todas as matérias, com técnicas de memorização, ilustrações e mapas mentais</small></button>
  <button class="card resumo" data-acao="resumo" data-p="${periodo}" style="margin-top:10px">${tile("var(--lacre)","recibo")}<b>Resumo do ${periodo+1}º período</b><small>Versão curta com todas as matérias juntas em um só arquivo</small></button>
  ${ds.length>1?`<div class="secao" role="heading" aria-level="2">Simulado do período</div>
  <button class="card destaque" data-acao="per" data-p="${periodo}">${tile("var(--lacre)","alvo")}<b>Simulado do ${periodo+1}º período</b><small>${idsPer(periodo).length} questões de ${ds.length} disciplinas · ${nPer(periodo)} simulado${nPer(periodo)>1?"s":""} de cerca de ${TAM_PER}</small>${(()=>{const s=statMat(idsPer(periodo));return `<span class="trilho"><i class="f-ok" style="width:${s.o*100/(s.n||1)}%"></i><i class="f-er" style="width:${s.e*100/(s.n||1)}%"></i></span>`})()}</button>`:""}
  <div class="secao" role="heading" aria-level="2">${periodo+1}º período · ${ds.length} disciplina${ds.length>1?"s":""}</div>
  <div class="grade-mat">${ds.map(d=>{const f=infoDisc(d);return cardMat(d,"disc",`data-d="${d}"`,f.nome,f.cor,f.ic,idsDisc(d))}).join("")}</div>
  <p class="nota" style="margin-top:16px">A grade segue a ordem mais comum dos cursos de Direito. Se a sua for diferente, as disciplinas continuam todas aqui, só mudam de período.</p></main>`}
function telaPeriodo(){const i=rota.p;const n=nPer(i);const ks=[];for(let k=0;k<n;k++)ks.push(`per:${i}:${k}`);
  const nomes=PERIODOS[i].map(d=>infoDisc(d).nome);
  return topo(`Simulado do ${i+1}º período`,`${idsPer(i).length} questões`,{})+
  `<main class="wrap"><div class="cabeca">${tile("var(--lacre)","alvo")}<div><h2>Simulado do ${i+1}º período</h2><p class="nota">Mistura ${esc(nomes.join(", "))}.</p></div></div>
  ${n>1?`<p class="nota" style="margin-top:14px">Os simulados vão do mais simples ao mais difícil. Faça na ordem: cada um prepara para o seguinte.</p>${escada()}`:""}
  <div class="secao" role="heading" aria-level="2">Simulados</div><div class="lista">${ks.map(k=>itemSim(k)).join("")}</div>
  ${n>1?`<div class="secao" role="heading" aria-level="2">Treino livre</div><div class="lista">${itemSim("ptodas:"+i)}</div>`:""}</main>`}
function telaDisc(){const d=rota.d,f=infoDisc(d);const n=nFac(d);const ks=[];for(let i=0;i<n;i++)ks.push(`fac:${d}:${i}`);
  return topo(f.nome,`${idsDisc(d).length} questões`,{})+
  `<main class="wrap"><div class="cabeca">${tile(f.cor,f.ic)}<div><h2>${esc(f.nome)}</h2><p class="nota">${idsDisc(d).length} questões · ${n} simulado${n>1?"s":""} de cerca de ${TAM_FAC} questões</p></div></div>
  ${temAp(d)?`<button class="btn-ap" data-acao="ler" data-d="${d}">${tile("var(--toga)","livro")}<span><b>Ler a apostila desta matéria</b><small>Teoria explicada, técnicas de memorização e mapa mental</small></span></button>`:""}
  ${n>1?`<p class="nota" style="margin-top:14px">Os simulados vão do mais simples ao mais difícil. Faça na ordem: cada um prepara para o seguinte.</p>${escada()}`:""}
  <div class="secao" role="heading" aria-level="2">Simulados</div><div class="lista">${ks.map(k=>itemSim(k)).join("")}</div>
  ${n>1?`<div class="secao" role="heading" aria-level="2">Treino livre</div><div class="lista">${itemSim("ftodas:"+d)}</div>`:""}${secaoAss(d)}</main>`}

/* ---------- configurar simulado ---------- */
function telaPre(){if(/^faixa:/.test(rota.key||"")){const d=rota.key.split(":")[1];if(!temOk(d)){apDaProva(d);return topo("Configurar simulado","Carregando os temas da apostila",{})+`<main class="wrap"><p class="nota">Carregando…</p></main>`}}
  const s=sim(rota.key);const e=estado(rota.key);
  const n=s.qids.length;
  const NI=s.nivel?NIVEL_INFO[s.nivel-1]:null;
  return topo("Configurar simulado",s.titulo+" · "+s.sub,{})+
  `<main class="wrap"><div class="cartao">
    ${NI?`<div class="box-nivel" style="--c:var(--nv${s.nivel})">${chipNivel(s.nivel)}<p>${esc(NI.dica)}</p></div>`:""}
    <div class="info"><div><strong>${n}</strong><small>questões</small></div><div><strong>${s.limite?dur(s.limite):"Livre"}</strong><small>${s.limite?"de prova":"sem cronômetro"}</small></div><div><strong>50%</strong><small>para aprovação</small></div></div>
    <div class="chave"><p><b>Correção no final ${S.cfg.corrFinal?"ligada":"desligada"}</b><small>${S.cfg.corrFinal?"A correção de cada questão será exibida ao final do simulado":"A correção aparece logo depois de cada resposta"}</small></p>
      <label class="switch"><input type="checkbox" id="corrFinal" ${S.cfg.corrFinal?"checked":""} aria-label="Correção no final"><span></span></label></div>
    <p class="nota">A ordem das alternativas muda a cada tentativa.${s.fixa?" As questões seguem a ordem das matérias na prova.":s.rampa?" As questões começam pelas mais simples e vão ficando mais difíceis; cada correção traz o comentário e o fundamento legal.":" A ordem das questões também muda."}</p>
  </div>
  <div class="botoes">${e.st==="pausa"?`<button class="botao linha" data-acao="comecar">Refazer simulado</button><button class="botao cheio" data-acao="continuar">Continuar onde parei</button>`
    :`${e.a?`<button class="botao linha" data-acao="ver-ultima">Ver última correção</button>`:""}<button class="botao cheio" data-acao="comecar">${e.a?"Refazer simulado":"Iniciar simulado"}</button>`}</div></main>`}
function comecar(key){const s=sim(key);if(!s||!s.qids.length)return;
  const qids=s.fixa?s.qids.slice():s.rampa?rampa(s.qids):emb(s.qids);const ordem={};qids.forEach(id=>ordem[id]=emb([0,1,2,3]));
  S.hist.forEach(a=>{if(a.key===key&&a.status==="pausado"){a.status="descartado"}});

function iniciarRelogio(){if(!sessao||tick)return;ultimoTick=Date.now();

/* ---------- segredos do app (easter eggs) ----------
   Oito segredos: cada um abre uma cena animada com um pouco de Direito. Os encontrados ficam em S.ovos ({id: dia})
   e aparecem em Sobre o Facul Lab, onde dá para rever. Cada descoberta toca um som (se ligado) e dispara o evento "fl-ovo" (detail: {id, novo}).
   Os gatilhos ficam em ouvintes próprios (toques, segurar, teclado, chacoalhar), sem mexer no clique principal. */
const OVOS=[
 {id:"balanca",ic:"balanca",nome:"Equilíbrio da Justiça",dica:"A balança do logo guarda um segredo. Toque nela várias vezes seguidas."},
 {id:"brocardo",ic:"livro",nome:"Brocardo secreto",dica:"A ilustração do Hoje fala latim quando recebe muitos toques rápidos."},
 {id:"martelo",ic:"martelo",nome:"Ordem no tribunal",dica:"Segure o dedo no título de qualquer tela."},
 {id:"chama",ic:"chama",nome:"Chama da Justiça",dica:"Atice a chama da ofensiva cinco vezes seguidas."},
 {id:"sacode",ic:"relogio",nome:"Chacoalhadas da semana",dica:"Chacoalhe o celular. Cada meio dia tem uma cena diferente."},
 {id:"habeas",ic:"escudo",nome:"Habeas corpus",dica:"Descubra as 14 chacoalhadas da semana para libertar a pombinha. No computador, digite habeas."},
 {id:"coruja",ic:"lua",nome:"Coruja da madrugada",dica:"Abra o Hoje entre meia-noite e cinco da manhã."},

 try{document.dispatchEvent(new CustomEvent("fl-ovo",{detail:{id,novo}}))}catch(e){}return novo}

function ovoBalAtualiza(){const el=document.querySelector(".ovo-bal");if(!el||!ovoBal)return;const L=ovoBal.L,R=ovoBal.R.reduce((s,x)=>s+x,0);
 const th=Math.max(-16,Math.min(16,(R-L)*2.4)),rad=th*Math.PI/180,dy=80*Math.sin(rad),dx=80*(1-Math.cos(rad));
 el.querySelector(".ob-braco").style.transform=`rotate(${th}deg)`;
 el.querySelector(".ob-e").style.transform=`translate(${dx}px,${-dy}px)`;el.querySelector(".ob-d").style.transform=`translate(${-dx}px,${dy}px)`;
 el.querySelector(".ob-carga").innerHTML=`<rect x="22" y="${110-26}" width="36" height="26" rx="4"/><text x="40" y="${110-9}">${L} kg</text>`;
 let y=110;el.querySelector(".ob-pilha").innerHTML=ovoBal.R.slice(0,9).map(p=>{const h=6+p*2.4,w=16+p*4;y-=h+1;return `<g class="ob-peso"><rect x="${200-w/2}" y="${y}" width="${w}" height="${h}" rx="2.5"/>${h>=10?`<text x="200" y="${y+h/2+3.4}">${p}</text>`:""}</g>`}).join("");
 const ok=R===L,msg=el.querySelector(".ob-msg");el.classList.toggle("certo",ok);
 msg.className="ob-msg"+(ok?" ok":R>L?" err":"");
 msg.textContent=ok?"Equilíbrio perfeito!":R>L?`Pesou demais: sobram ${R-L} kg. Tire um peso.`:R?`Faltam ${L-R} kg.`:"Toque nos pesos para colocar no prato.";
 el.querySelectorAll('[data-ovo="bal-p"]').forEach(b=>b.disabled=ok);el.querySelector('[data-ovo="bal-tira"]').disabled=ok||!R;
 el.querySelector(".ob-fim").hidden=!ok;if(ok)setTimeout(()=>{ovoConfete();ovoSom("gabarito")},350)}

/* 4. Chama da Justiça: 5 toques seguidos na chama da ofensiva. Nos dias de marco, a chama ganha um brilho dourado no Hoje. */
const OVO_MARCOS=[3,7,15,30,50,100,180,365];
function ovoRecorde(){const D=S.dias||{};let best=0,run=0,prev=null;
 Object.keys(D).filter(k=>temAtiv(D[k])).sort().forEach(k=>{const t=new Date(k+"T12:00:00").getTime();run=prev!==null&&Math.round((t-prev)/864e5)===1?run+1:1;prev=t;if(run>best)best=run});
 return Math.max(best,sequencia())}
function ovoChama(rever){const seq=sequencia(),rec=ovoRecorde(),prox=OVO_MARCOS.find(m=>m>seq),marco=OVO_MARCOS.includes(seq);
 const [t,f]=seq===0?["Faísca guardada","A chama está apagada, mas a faísca é você. Uma questão hoje já acende tudo de novo."]:seq>=100?["Lenda da ofensiva",`${seq} dias seguidos. Pouca gente chega aqui: isso já é quem você é.`]:seq>=30?["Fogo de mês inteiro",`${seq} dias seguidos. Estudar virou parte do seu dia, como escovar os dentes.`]:seq>=7?["Semana de fogo",`${seq} dias seguidos. A chama já aguenta vento.`]:["Chama acesa",`${seq} ${seq===1?"dia":"dias seguidos"}. Cada dia de estudo joga mais lenha na fogueira.`];
 ovoCena("chama","ovo-chama"+(marco?" marco":""),`<div class="oc-palco">${chamaViva(seq)}<i></i><i></i><i></i><i></i><i></i><i></i></div>
 <h2>${marco?`Marco de ${seq} dias!`:t}</h2><p class="frase">${esc(f)}</p>
 <div class="oc-nums"><span><b>${seq}</b>agora</span><span><b>${rec}</b>seu recorde</span><span><b>${prox||"∞"}</b>${prox?`próximo marco · faltam ${prox-seq}`:"você passou de todos"}</span></div>
 <p class="ovo-nota"><b>Por que todo dia?</b> A memória fixa melhor o que é revisto aos poucos, em dias diferentes, do que numa maratona na véspera. É o efeito do espaçamento.</p>${ovoBotoes()}`,{rever,titulo:"Chama da Justiça",confete:marco});ovoSomDepois("fogo",300)}

 <h2>Fim dos autos!</h2><p class="frase">Você puxou até onde não dava mais. Daqui não cabe recurso: a decisão transitou em julgado.</p>
 <p class="ovo-nota"><b>Coisa julgada</b> é a autoridade que torna imutável e indiscutível a decisão de mérito da qual não cabe mais recurso (art. 502 do CPC). Nem lei nova pode prejudicá-la (art. 5º, XXXVI, da CF). <b>Mas atenção:</b> ainda existe a ação rescisória, em até 2 anos do trânsito em julgado (art. 975 do CPC), e no processo penal a revisão criminal a favor do condenado pode ser pedida a qualquer tempo (art. 622 do CPP).</p>${ovoBotoes(`<button class="botao" data-ovo="fundo-carimba">Carimbar de novo</button>`)}`,{rever,titulo:"Fim dos autos"});

/* ações dentro das cenas e gatilhos por toque */
const ovoToques={};
function ovoConta(k,n,ms){const t=Date.now(),a=(ovoToques[k]||[]).filter(x=>t-x<ms);a.push(t);ovoToques[k]=a;if(a.length>=n){ovoToques[k]=[];return true}return false}
function ovoReanima(el,cls){if(!el)return;el.classList.remove(cls);void el.getBoundingClientRect();el.classList.add(cls)}
document.addEventListener("click",e=>{const t=e.target;if(!t||!t.closest)return;
 const b=t.closest("[data-ovo]");
 if(b){const a=b.dataset.ovo,c=b.closest(".festa");
  if(a==="bal-p"&&ovoBal){ovoBal.R.push(+b.dataset.v);ovoSom("peso");ovoBalAtualiza()}
  else if(a==="bal-tira"&&ovoBal){ovoBal.R.pop();ovoSom("tira");ovoBalAtualiza()}
  else if(a==="bal-de-novo")ovoBalanca(true);
  else if(a==="broc-vira"){b.classList.toggle("virada");ovoSom("vira")}
  else if(a==="broc-outro"){const p=c.querySelector(".obr-palco");p.innerHTML=ovoBrocHtml();ovoReanima(p,"troca");ovoSom("vira")}
  else if(a==="mart-bate"){ovoReanima(c.querySelector(".om-palco"),"bate");ovoSomDepois("martelo",animOn()?600:30)}
  else if(a==="fundo-carimba"){ovoReanima(c.querySelector(".of-palco"),"bate");ovoSomDepois("carimbo",animOn()?420:30)}
  else if(a==="hc-solta"){ovoReanima(c.querySelector(".oh-palco"),"solta");ovoSomDepois("pomba",animOn()?650:30)}
  else if(a==="saco-pomba")ovoHabeas();
  else if(a==="rever"&&OVO_ABRE[b.dataset.id])OVO_ABRE[b.dataset.id](true);
  else if(a==="coruja")ovoCoruja();
  else if(a==="data")ovoData();
  return}
 if(t.closest(".festa,#tour"))return;
 const logo=t.closest(".sb-logo,.gaveta-topo .marca");
 if(logo){ovoReanima(logo,"ovo-tic");if(ovoConta("bal",7,4000))setTimeout(()=>ovoBalanca(),200);return}
 if(t.closest(".hoje-hero .ilu")){if(ovoConta("broc",5,3000))setTimeout(()=>ovoBrocardo(),350);return}
 if(t.closest(".chama-viva")&&ovoConta("chama",5,3500))setTimeout(()=>ovoChama(),400)});
/* segurar o título */
let tOvoSeg=null,ovoSegXY=null;
function ovoSoltou(){clearTimeout(tOvoSeg);tOvoSeg=null;document.querySelectorAll(".ovo-segura").forEach(x=>x.classList.remove("ovo-segura"))}
document.addEventListener("pointerdown",e=>{const h=e.target.closest&&e.target.closest(".topo h1");if(!h||document.querySelector(".festa,#tour"))return;
 ovoSoltou();ovoSegXY=[e.clientX,e.clientY];h.classList.add("ovo-segura");tOvoSeg=setTimeout(()=>{ovoSoltou();ovoMartelo()},800)});
document.addEventListener("pointermove",e=>{if(tOvoSeg&&ovoSegXY&&Math.hypot(e.clientX-ovoSegXY[0],e.clientY-ovoSegXY[1])>12)ovoSoltou()});
["pointerup","pointercancel","scroll"].forEach(ev=>document.addEventListener(ev,()=>{if(tOvoSeg)ovoSoltou()},true));
document.addEventListener("contextmenu",e=>{if(e.target.closest&&e.target.closest(".topo h1"))e.preventDefault()});

const SACO_CH="faculLab.sacode";
const sacoTurno=()=>{const d=new Date();return {dia:hojeStr(),tarde:d.getHours()>=12,i:((Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)*2+(d.getHours()>=12?1:0))%SACO.length+SACO.length)%SACO.length}};
function sacoN(){return Object.keys(S.sacode||{}).filter(k=>SACO[+k]).length}
function sacoUsos(){const t=sacoTurno(),p=t.dia+(t.tarde?"b":"a");let o={};try{o=JSON.parse(localStorage.getItem(SACO_CH)||"{}")}catch(e){}return o.p===p?o:{p,n:0}}

function ovoSacode(rever,idx){const t=sacoTurno(),i=idx===undefined?t.i:idx,x=SACO[i];
 S.sacode=S.sacode||{};const nova=!S.sacode[i];if(!rever&&nova){S.sacode[i]=hojeStr();salvar()}
 const n=sacoN(),usos=sacoUsos(),resta=Math.max(0,2-usos.n),todas=n>=SACO.length;
 const info=rever?`Cena ${i+1} de ${SACO.length}. Ela volta toda semana neste mesmo turno.`:resta?`Dá para chacoalhar mais 1 vez neste turno. ${t.tarde?"À meia-noite":"Ao meio-dia"} chega uma cena nova.`:`Esta foi a última chacoalhada deste turno. ${t.tarde?"À meia-noite":"Ao meio-dia"} chega uma cena nova.`;
 ovoCena("sacode","ovo-saco sc-c-"+x.id,`<span class="sc-turno">${ic("relogio")} Chacoalhada ${t.tarde&&!rever?"da tarde":!rever?"da manhã":"da semana"} · ${n} de ${SACO.length} descobertas${nova&&!rever?" · nova!":""}</span>
 <div class="sc-palco" aria-hidden="true"><svg class="sc-svg" viewBox="0 0 220 150">${x.svg}</svg></div>
 <h2>${esc(x.nome)}</h2><p class="frase">${esc(x.frase)}</p><div class="ovo-nota dh-licao"><small>${ic("livro")} Lição da chacoalhada</small><p>${esc(x.licao)}</p><em>${esc(x.ref)}</em></div>
 <p class="sc-info">${info}</p>${ovoBotoes(todas?`<button class="botao" data-ovo="saco-pomba">Libertar a pombinha</button>`:"")}`,{rever,titulo:x.nome,confete:nova&&!rever});
 ovoSomDepois(x.som,450)}

let ovoTec="";
document.addEventListener("keydown",e=>{if(e.ctrlKey||e.metaKey||e.altKey||!e.key||e.key.length!==1)return;const el=document.activeElement;if(el&&(el.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)))return;

/* puxar para cima no fim da tela: uma aba sobe do rodapé acompanhando o dedo; passou do ponto, soltou, abre o segredo */
let ovoPx=null;
function ovoNoFim(){const d=document.documentElement;return window.innerHeight+window.scrollY>=d.scrollHeight-4}
function ovoPuxaEl(){let el=$("#ovo-puxa");if(!el){el=document.createElement("div");el.id="ovo-puxa";el.setAttribute("aria-hidden","true");document.body.appendChild(el)}return el}
function ovoPuxa(h){const el=ovoPuxaEl(),pronto=h>=96;el.classList.remove("solta");
 if(pronto!==el.classList.contains("pronto")||!el.innerHTML){el.classList.toggle("pronto",pronto);el.innerHTML=`<span class="op-ic">${ic("pasta")}</span><span>${pronto?"Solte para carimbar":"Fim dos autos…"}<small>${pronto?"Daqui não cabe recurso":"Continue puxando"}</small></span>`;if(pronto)som("puxa")}
 el.style.transform=`translate(-50%,calc(100% - ${Math.min(h,130)}px))`;return pronto}
function ovoPuxaSolta(abrir){const el=$("#ovo-puxa");if(!el)return;el.classList.add("solta");el.style.transform="";const pr=el.classList.contains("pronto");el.classList.remove("pronto");setTimeout(()=>{if(!el.classList.contains("pronto"))el.innerHTML=""},400);if(abrir&&pr)setTimeout(()=>ovoFundo(),120)}
const ovoPodePuxar=t=>!(t&&t.closest&&t.closest(".festa,#tour,.gaveta,.folha,.camada,.folha-camada,input,textarea,select"))&&!document.querySelector(".festa,#tour")&&!gaveta&&tourI<0;
document.addEventListener("touchstart",e=>{ovoPx=null;if(e.touches.length!==1||!ovoPodePuxar(e.target)||!ovoNoFim())return;ovoPx={y:e.touches[0].clientY,x:e.touches[0].clientX,h:0}},{passive:true});
document.addEventListener("touchmove",e=>{if(!ovoPx)return;const t=e.touches[0],dy=ovoPx.y-t.clientY;
 if(!ovoNoFim()||Math.abs(t.clientX-ovoPx.x)>Math.max(60,dy)){if(ovoPx.h)ovoPuxaSolta(false);ovoPx=null;return}
 const h=dy>30?(dy-30)*.42:0;if(h||ovoPx.h){ovoPx.h=h;ovoPuxa(h)}},{passive:true});
["touchend","touchcancel"].forEach(ev=>document.addEventListener(ev,e=>{if(!ovoPx)return;const ok=ev==="touchend"&&ovoPx.h>=96;if(ovoPx.h)ovoPuxaSolta(ok);ovoPx=null},{passive:true}));
/* no computador: continuar rolando para baixo quando a tela já acabou */
let ovoRoda=0,tOvoRoda=null;
window.addEventListener("wheel",e=>{if(e.deltaY<=0||e.ctrlKey||!ovoPodePuxar(e.target)||!ovoNoFim()){if(ovoRoda){ovoRoda=0;ovoPuxaSolta(false)}return}
 ovoRoda+=Math.min(e.deltaY*(e.deltaMode===1?16:1),120);const h=Math.max(0,ovoRoda-900)*.11;if(h)ovoPuxa(h);
 clearTimeout(tOvoRoda);tOvoRoda=setTimeout(()=>{const ok=h>=96;ovoRoda=0;ovoPuxaSolta(ok)},350)},{passive:true});
